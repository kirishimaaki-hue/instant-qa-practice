<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Instant Q&A Practice</title>

<style>
body {
  font-family: Arial, sans-serif;
  max-width: 760px;
  margin: 40px auto;
  padding: 20px;
  text-align: center;
}

#setupArea {
  font-size: 22px;
  line-height: 1.9;
}

#instructions {
  max-width: 620px;
  margin: 30px auto;
  text-align: left;
}

button {
  font-size: 20px;
  padding: 14px 26px;
  margin: 12px;
  cursor: pointer;
}

button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

#loading {
  margin: 20px 0;
  font-size: 18px;
}

#counter {
  font-size: 20px;
  margin-bottom: 30px;
}

#question {
  font-size: 34px;
  margin: 45px 0;
  min-height: 80px;
}

#phase {
  font-size: 22px;
  margin: 20px 0;
}

#timer {
  font-size: 54px;
  font-weight: bold;
  margin: 20px 0;
}

#recordingStatus {
  min-height: 38px;
  margin: 15px 0;
}

.recording {
  color: #c40000;
  font-size: 26px;
  font-weight: bold;
  animation: blink 1s infinite;
}

@keyframes blink {
  0%, 45% { opacity: 1; }
  50%, 100% { opacity: 0.2; }
}

#summaryArea {
  margin: 25px auto 40px;
  padding: 20px;
  background: #f5f5f5;
  text-align: left;
  max-width: 620px;
}

.summaryTitle {
  font-size: 24px;

  margin-bottom: 15px;
  text-align: center;
}

.summaryRow {

}

.overallResult {
  margin-top: 20px;
  padding-top: 15px;
  border-top: 2px solid #ccc;
  font-size: 27px;
  font-weight: bold;
  text-align: center;
}

.pass {
  color: #16803a;
  font-weight: bold;
}

}

#answerReview {

.reviewItem {

@media (max-width: 600px) {

</head>

<body>

<audio id="signalSound" preload="auto" src="chirin.mp3"></audio>

<div id="setupArea">

  <h2>Instant Q&A Practice</h2>

  <div id="instructions">
    10問を連続で練習します。<br>
    質問の音声を最後まで聞いてください。<br>
    音声が終わると、約1秒後に回答時間が始まります。<br>
    10秒で英語で答えましょう。<br><br>

    10問すべて終わった後に、録音・文字起こし・解答例を確認できます。
  </div>

  <div id="loading">問題データを読み込んでいます...</div>

  <p>
    <strong>準備ができたら「開始」を押してください。</strong>
  </p>

  <button id="startButton" disabled>開始</button>

  <div id="browserMessage">
    ※開始時にマイクの使用を許可してください。
  </div>

  <div id="errorMessage"></div>

</div>


<div id="practiceArea" style="display:none;">

  <div id="counter"></div>
  <div id="question"></div>
  <div id="phase"></div>
  <div id="timer"></div>
  <div id="recordingStatus"></div>

  <button id="stopButton">中断する</button>

</div>


<div id="finishArea" style="display:none;">

  <h2 id="finishTitle">10問終了しました</h2>

  <button id="reviewButton">回答を確認する</button>
  <button id="restartButton">もう一度</button>

  <div id="summaryArea" style="display:none;"></div>
  <div id="answerReview"></div>

</div>


<script>

const API_URL =
  "https://script.google.com/macros/s/AKfycbyUwVGhGkyRpW1OuJqP-9Zl6WKiEcpqOAi3j_r4PTp-O99MQz-8Hxow_1gX8I9LmNd_nQ/exec";

const STUDENT_ID = "yasmin";
const TOPIC = "Favorites";

const ANSWER_SECONDS = 10;

/*
  次の問題を表示してから
  2秒待って質問音声を開始
*/
const QUESTION_AUDIO_DELAY_MS = 2000;

/*
  質問音声終了から回答開始まで1秒
*/
const AFTER_QUESTION_AUDIO_MS = 1000;

/*
  0秒になっても1秒録音継続
*/
const EXTRA_RECORDING_MS = 1000;

/*
  チリン開始後1秒待って
  次の問題画面へ
*/
const AFTER_SIGNAL_MS = 1000;

/*
  合格条件
*/
const PASS_WORDS = 15;
const PASS_CONTENT = 60;


let questions = [];
let current = 0;

let timerId = null;
let transitionTimerId = null;

let mediaStream = null;
let mediaRecorder = null;
let audioChunks = [];

let recognition = null;

/*
  音声認識結果を
  result番号ごとに保存する
*/
let recognitionResults = {};
let lastInterimText = "";

let recognitionEnded = false;
let recordingEnded = false;
let answerSaved = false;

let results = [];

let interrupted = false;
let isEndingAnswer = false;

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


const setupArea =
  document.getElementById("setupArea");

const practiceArea =
  document.getElementById("practiceArea");

const finishArea =
  document.getElementById("finishArea");

const startButton =
  document.getElementById("startButton");

const stopButton =
  document.getElementById("stopButton");

const reviewButton =
  document.getElementById("reviewButton");

const restartButton =
  document.getElementById("restartButton");

const counterDisplay =
  document.getElementById("counter");

const questionDisplay =
  document.getElementById("question");

const phaseDisplay =
  document.getElementById("phase");

const timerDisplay =
  document.getElementById("timer");

const recordingStatus =
  document.getElementById("recordingStatus");

const finishTitle =
  document.getElementById("finishTitle");

const errorMessage =
  document.getElementById("errorMessage");

const browserMessage =
  document.getElementById("browserMessage");

const loadingDisplay =
  document.getElementById("loading");

const signalSound =
  document.getElementById("signalSound");

const summaryArea =
  document.getElementById("summaryArea");


checkBrowser();
loadSpreadsheetData();


/* =========================
   スプレッドシート
========================= */

function loadSpreadsheetData() {

  window.receiveSpreadsheetData =
    function(data) {

      questions = data
        .filter(row =>
          String(row["Student ID"]).toLowerCase() ===
            STUDENT_ID.toLowerCase()
          &&
          String(row["Topic"]).toLowerCase() ===
            TOPIC.toLowerCase()
        )
        .sort((a, b) =>
          Number(a["No."]) -
          Number(b["No."])
        );


      if (questions.length === 0) {

        loadingDisplay.textContent =
          "問題データを読み込めませんでした。";

        return;
      }


      loadingDisplay.textContent =
        questions.length +
        "問を読み込みました。";


      if (
        SpeechRecognition &&
        navigator.mediaDevices &&
        navigator.mediaDevices.getUserMedia
      ) {

        startButton.disabled = false;
      }
    };


  const script =
    document.createElement("script");

  script.src =
    API_URL +
    "?callback=receiveSpreadsheetData&t=" +
    Date.now();

  script.onerror =
    function() {

      loadingDisplay.textContent =
        "スプレッドシートとの接続に失敗しました。";
    };

  document.body.appendChild(script);
}


/* =========================
   ブラウザ確認
========================= */

function checkBrowser() {

  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {

    browserMessage.textContent =
      "このブラウザでは録音機能を利用できません。Chromeをご使用ください。";

    startButton.disabled = true;
    return;
  }


  if (!SpeechRecognition) {

    browserMessage.textContent =
      "このブラウザでは文字起こしに対応していません。PCまたはAndroidのChromeをご使用ください。";

    startButton.disabled = true;
    return;
  }


  browserMessage.textContent =
    "※開始時にマイクの使用を許可してください。";
}


/* =========================
   開始
========================= */

startButton.addEventListener(
  "click",
  async () => {

    errorMessage.textContent = "";

    startButton.disabled = true;


    try {

      mediaStream =
        await navigator.mediaDevices
          .getUserMedia({
            audio: true
          });

    } catch (error) {

      errorMessage.textContent =
        "マイクを使用できません。ブラウザの設定でマイクの使用を許可してください。";

      startButton.disabled = false;

      return;
    }


    clearOldResults();

    current = 0;
    results = [];
    interrupted = false;

    summaryArea.style.display = "none";
    summaryArea.innerHTML = "";

    restartButton.style.display = "none";

    setupArea.style.display = "none";
    finishArea.style.display = "none";
    practiceArea.style.display = "block";

    startQuestion();
  }
);


/* =========================
   質問開始
========================= */

function startQuestion() {

  clearInterval(timerId);
  clearTimeout(transitionTimerId);

  if (interrupted) return;


  if (current >= questions.length) {

    finishPractice();

    return;
  }


  const q =
    questions[current];


  counterDisplay.textContent =
    "Q" +
    (current + 1) +
    " / " +
    questions.length;


  questionDisplay.textContent =
    q["Question"];


  timerDisplay.textContent = "";

  recordingStatus.innerHTML = "";

  phaseDisplay.textContent =
    "質問を聞いてください";


  /*
    問題表示後2秒待ってから
    ネイティブ質問音声
  */

  transitionTimerId =
    setTimeout(() => {

      playQuestionAudio();

    }, QUESTION_AUDIO_DELAY_MS);
}


/* =========================
   質問音声
========================= */

function playQuestionAudio() {

  const no =
    String(
      questions[current]["No."]
    ).padStart(2, "0");


  const audio =
    new Audio(
      "fav" +
      no +
      ".mp3"
    );


  audio.preload = "auto";


  audio.onended =
    function() {

      phaseDisplay.textContent = "";

      transitionTimerId =
        setTimeout(() => {

          startAnswerTime();

        }, AFTER_QUESTION_AUDIO_MS);
    };


  audio.onerror =
    function() {

      phaseDisplay.textContent =
        "質問音声を再生できませんでした";

      transitionTimerId =
        setTimeout(() => {

          startAnswerTime();

        }, 1500);
    };


  audio.play().catch(() => {

    phaseDisplay.textContent =
      "質問音声を再生できませんでした";

    transitionTimerId =
      setTimeout(() => {

        startAnswerTime();

      }, 1500);
  });
}


/* =========================
   回答開始
========================= */

function startAnswerTime() {

  let remaining =
    ANSWER_SECONDS;


  isEndingAnswer = false;
  answerSaved = false;

  recognitionResults = {};
  lastInterimText = "";

  recognitionEnded = false;
  recordingEnded = false;

  audioChunks = [];


  phaseDisplay.textContent =
    "回答時間";


  timerDisplay.textContent =
    remaining;


  recordingStatus.innerHTML =
    '<span class="recording">● Recording</span>';


  startRecording();
  startRecognition();


  timerId =
    setInterval(() => {

      remaining--;

      timerDisplay.textContent =
        remaining;


      if (remaining <= 0) {

        clearInterval(timerId);


        transitionTimerId =
          setTimeout(() => {

            finishCurrentAnswer();

          }, EXTRA_RECORDING_MS);
      }

    }, 1000);
}


/* =========================
   録音
========================= */

function startRecording() {

  try {

    mediaRecorder =
      new MediaRecorder(
        mediaStream
      );


    audioChunks = [];


    mediaRecorder.ondataavailable =
      event => {

        if (
          event.data &&
          event.data.size > 0
        ) {

          audioChunks.push(
            event.data
          );
        }
      };


    mediaRecorder.onstop =
      function() {

        recordingEnded = true;

        checkAnswerReady();
      };


    mediaRecorder.start();


  } catch (error) {

    recordingEnded = true;

    recordingStatus.textContent =
      "録音を開始できませんでした。";
  }
}


/* =========================
   音声認識
========================= */

function startRecognition() {

  recognition =
    new SpeechRecognition();


  recognition.lang =
    "en-US";

  recognition.continuous =
    true;

  recognition.interimResults =
    true;


  recognition.onresult =
    function(event) {

      /*
        resultIndex以降だけ更新する。

        各result番号をキーとして
        1つの認識結果だけ保持するので、
        同じ文章を何度も追加しない。
      */

      for (
        let i =
          event.resultIndex;
        i <
          event.results.length;
        i++
      ) {

        const text =
          event.results[i][0]
            .transcript
            .trim();


        if (
          event.results[i]
            .isFinal
        ) {

          recognitionResults[i] =
            text;

          /*
            finalになったので
            interim候補をリセット
          */

          lastInterimText = "";

        } else {

          /*
            未確定部分は
            最新のものだけ保持
          */

          lastInterimText =
            text;
        }
      }
    };


  recognition.onerror =
    function(event) {

      console.log(
        "Speech recognition error:",
        event.error
      );
    };


  recognition.onend =
    function() {

      recognitionEnded = true;

      checkAnswerReady();
    };


  try {

    recognition.start();

  } catch (error) {

    recognitionEnded = true;
  }
}


/* =========================
   回答終了
========================= */

function finishCurrentAnswer() {

  if (isEndingAnswer) return;

  isEndingAnswer = true;


  recordingStatus.innerHTML = "";


  if (recognition) {

    try {

      recognition.stop();

    } catch (error) {

      recognitionEnded = true;
    }

  } else {

    recognitionEnded = true;
  }


  if (
    mediaRecorder &&
    mediaRecorder.state !==
      "inactive"
  ) {

    try {

      mediaRecorder.stop();

    } catch (error) {

      recordingEnded = true;
    }

  } else {

    recordingEnded = true;
  }


  /*
    Chromeからonendが
    来ない場合の保険
  */

  setTimeout(() => {

    if (!recognitionEnded) {

      recognitionEnded = true;

      checkAnswerReady();
    }

  }, 1500);


  checkAnswerReady();
}


/* =========================
   保存可能か確認
========================= */

function checkAnswerReady() {

  if (
    !recognitionEnded ||
    !recordingEnded ||
    answerSaved
  ) {

    return;
  }


  answerSaved = true;


  saveCurrentResult();

  playSignalAndMove();
}


/* =========================
   文字起こし作成
========================= */

function buildTranscript() {

  const keys =
    Object.keys(
      recognitionResults
    )
    .map(Number)
    .sort(
      (a, b) =>
        a - b
    );


  const finalParts =
    keys
      .map(
        key =>
          recognitionResults[key]
      )
      .filter(Boolean);


  let transcript =
    finalParts.join(" ").trim();


  /*
    最後がfinalにならなかった場合のみ、
    最新interimを補う。

    ただしfinal部分と重なる単語は
    二重追加しない。
  */

  if (lastInterimText) {

    transcript =
      appendWithoutOverlap(
        transcript,
        lastInterimText
      );
  }


  return cleanDuplicatePhrases(
    transcript
  );
}


/*
  文末と追加部分の
  単語の重なりを検出
*/

function appendWithoutOverlap(
  base,
  extra
) {

  base =
    String(base || "")
      .trim();

  extra =
    String(extra || "")
      .trim();


  if (!base) return extra;
  if (!extra) return base;


  const baseWords =
    base.split(/\s+/);

  const extraWords =
    extra.split(/\s+/);


  const maxOverlap =
    Math.min(
      baseWords.length,
      extraWords.length,
      12
    );


  let overlap = 0;


  for (
    let n = maxOverlap;
    n >= 1;
    n--
  ) {

    const end =
      baseWords
        .slice(-n)
        .join(" ")
        .toLowerCase();

    const start =
      extraWords
        .slice(0, n)
        .join(" ")
        .toLowerCase();


    if (end === start) {

      overlap = n;
      break;
    }
  }


  return (
    base +
    " " +
    extraWords
      .slice(overlap)
      .join(" ")
  ).trim();
}


/*
  Chromeが同じ長い語列を
  二重に返した場合の保険
*/

function cleanDuplicatePhrases(
  text
) {

  const words =
    String(text || "")
      .trim()
      .split(/\s+/)
      .filter(Boolean);


  if (words.length < 6) {

    return words.join(" ");
  }


  /*
    3〜15語の連続フレーズが
    直後に完全重複していた場合削除
  */

  for (
    let size =
      Math.min(
        15,
        Math.floor(
          words.length / 2
        )
      );
    size >= 3;
    size--
  ) {

    let i = 0;


    while (
      i +
      size * 2 <=
      words.length
    ) {

      const first =
        words
          .slice(
            i,
            i + size
          )
          .join(" ")
          .toLowerCase();


      const second =
        words
          .slice(
            i + size,
            i + size * 2
          )
          .join(" ")
          .toLowerCase();


      if (
        first === second
      ) {

        words.splice(
          i + size,
          size
        );

      } else {

        i++;
      }
    }
  }


  return words.join(" ");
}


/* =========================
   結果保存
========================= */

function saveCurrentResult() {

  let audioUrl = null;


  if (
    audioChunks.length > 0
  ) {

    const mimeType =
      mediaRecorder &&
      mediaRecorder.mimeType
        ? mediaRecorder.mimeType
        : "audio/webm";


    const blob =
      new Blob(
        audioChunks,
        {
          type: mimeType
        }
      );


    audioUrl =
      URL.createObjectURL(
        blob
      );
  }


  const transcript =
    buildTranscript();


  const wordCount =
    countWords(
      transcript
    );


  const wpm =
    wordCount > 0
      ? Math.round(
          wordCount *
          60 /
          ANSWER_SECONDS
        )
      : 0;


  const keywordResult =
    calculateKeywordScore(
      transcript,
      questions[current]
    );


  const passed =
    wordCount >=
      PASS_WORDS
    &&
    keywordResult.score >=
      PASS_CONTENT;


  results.push({

    no:
      questions[current]["No."],

    question:
      questions[current]["Question"],

    transcript:
      transcript,

    modelAnswer:
      questions[current]
        ["Model Answer"],

    audioUrl:
      audioUrl,

    wordCount:
      wordCount,

    wpm:
      wpm,

    keywordScore:
      keywordResult.score,

    matchedGroups:
      keywordResult.matched,

    totalGroups:
      keywordResult.total,

    passed:
      passed
  });
}


/* =========================
   内容一致率
========================= */

function calculateKeywordScore(
  transcript,
  question
) {

  const normalized =
    normalizeText(
      transcript
    );


  const groups = [];


  for (
    let i = 1;
    i <= 5;
    i++
  ) {

    const value =
      question[
        "Keyword Group " + i
      ];


    if (
      value &&
      String(value).trim()
    ) {

      groups.push(
        String(value)
      );
    }
  }


  let matched = 0;


  groups.forEach(
    group => {

      const alternatives =
        group
          .split("|")
          .map(
            item =>
              normalizeText(
                item
              )
          )
          .filter(Boolean);


      const hit =
        alternatives.some(
          alternative =>
            alternativeMatches(
              normalized,
              alternative
            )
        );


      if (hit) {

        matched++;
      }
    }
  );


  const score =
    groups.length > 0
      ? Math.round(
          matched /
          groups.length *
          100
        )
      : 0;


  return {
    score: score,
    matched: matched,
    total: groups.length
  };
}


/* =========================
   キーワード照合
========================= */

function alternativeMatches(
  transcript,
  alternative
) {

  if (!alternative) {

    return false;
  }


  const paddedTranscript =
    " " +
    transcript +
    " ";


  const paddedAlternative =
    " " +
    alternative +
    " ";


  if (
    paddedTranscript.includes(
      paddedAlternative
    )
  ) {

    return true;
  }


  /*
    1単語の場合のみ
    基本的な語形変化を許容
  */

  if (
    !alternative.includes(" ")
  ) {

    const words =
      transcript.split(" ");


    const forms =
      makeWordForms(
        alternative
      );


    return words.some(
      word =>
        forms.includes(
          word
        )
    );
  }


  return false;
}


function makeWordForms(
  word
) {

  const forms =
    new Set([word]);


  if (
    word.length < 3
  ) {

    return Array.from(
      forms
    );
  }


  forms.add(
    word + "s"
  );

  forms.add(
    word + "ed"
  );

  forms.add(
    word + "ing"
  );


  if (
    word.endsWith("e")
  ) {

    forms.add(
      word.slice(0, -1) +
      "ing"
    );

    forms.add(
      word + "d"
    );
  }


  if (
    word.endsWith("y")
  ) {

    forms.add(
      word.slice(0, -1) +
      "ies"
    );
  }


  return Array.from(
    forms
  );
}


function normalizeText(
  text
) {

  return String(
    text || ""
  )
    .toLowerCase()
    .replace(
      /[^a-z0-9\s]/g,
      " "
    )
    .replace(
      /\s+/g,
      " "
    )
    .trim();
}


function countWords(
  text
) {

  if (!text) {

    return 0;
  }


  return text
    .trim()
    .split(/\s+/)
    .filter(Boolean)
    .length;
}


/* =========================
   チリン → 次の問題
========================= */

function playSignalAndMove() {

  if (interrupted) {

    return;
  }


  try {

    signalSound.currentTime =
      0;


    signalSound
      .play()
      .catch(() => {});

  } catch (error) {}


  /*
    チリン開始後1秒で
    次の問題を表示。

    その問題の音声は、
    startQuestion内で
    さらに2秒待って始まる。
  */

  transitionTimerId =
    setTimeout(() => {

      if (interrupted) {

        return;
      }


      current++;

      startQuestion();

    }, AFTER_SIGNAL_MS);
}


/* =========================
   中断
========================= */

stopButton.addEventListener(
  "click",
  () => {

    interrupted = true;

    clearInterval(
      timerId
    );

    clearTimeout(
      transitionTimerId
    );


    if (recognition) {

      try {

        recognition.abort();

      } catch (error) {}
    }


    if (
      mediaRecorder &&
      mediaRecorder.state !==
        "inactive"
    ) {

      mediaRecorder.onstop =
        null;


      try {

        mediaRecorder.stop();

      } catch (error) {}
    }


    stopMicrophone();


    practiceArea.style.display =
      "none";


    finishArea.style.display =
      "block";


    finishTitle.textContent =
      "中断しました（" +
      results.length +
      "問完了）";


    reviewButton.style.display =
      results.length > 0
        ? "inline-block"
        : "none";


    restartButton.style.display =
      "none";
  }
);


/* =========================
   終了
========================= */

function finishPractice() {

  clearInterval(
    timerId
  );

  clearTimeout(
    transitionTimerId
  );


  stopMicrophone();


  practiceArea.style.display =
    "none";


  finishArea.style.display =
    "block";


  finishTitle.textContent =
    "10問終了しました";


  reviewButton.style.display =
    "inline-block";


  restartButton.style.display =
    "none";
}


function stopMicrophone() {

  if (mediaStream) {

    mediaStream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );


    mediaStream = null;
  }
}


/* =========================
   回答確認
========================= */

reviewButton.addEventListener(
  "click",
  () => {

    showSummary();

    showDetailedResults();

    restartButton.style.display =
      "inline-block";
  }
);


/* =========================
   判定一覧
========================= */

function showSummary() {

  summaryArea.innerHTML = "";


  const title =
    document.createElement(
      "div"
    );

  title.className =
    "summaryTitle";

  title.textContent =
    "判定結果";

  summaryArea.appendChild(
    title
  );


  results.forEach(
    (result, index) => {

      const row =
        document.createElement(
          "div"
        );

      row.className =
        "summaryRow";


      row.innerHTML =
        "Q" +
        (index + 1) +
        "　" +
        (
          result.passed
            ? '<span class="pass">PASS</span>'
            : '<span class="retry">RETRY</span>'
        );


      summaryArea.appendChild(
        row
      );
    }
  );


  const allPassed =
    results.length ===
      questions.length
    &&
    results.every(
      result =>
        result.passed
    );


  const overall =
    document.createElement(
      "div"
    );


  overall.className =
    "overallResult";


  overall.innerHTML =
    allPassed
      ? '総合結果：<span class="pass">PASS</span>'
      : '総合結果：<span class="retry">RETRY</span>';


  summaryArea.appendChild(
    overall
  );


  summaryArea.style.display =
    "block";
}


/* =========================
   詳細結果
========================= */

function showDetailedResults() {

  const review =
    document.getElementById(
      "answerReview"
    );


  review.innerHTML = "";


  results.forEach(
    (result, index) => {

      const item =
        document.createElement(
          "div"
        );


      item.className =
        "reviewItem";


      const question =
        document.createElement(
          "div"
        );


      question.className =
        "reviewQuestion";


      question.textContent =
        "Q" +
        (index + 1) +
        ". " +
        result.question;


      item.appendChild(
        question
      );


      const judgment =
        document.createElement(
          "div"
        );


      judgment.className =
        "judgment " +
        (
          result.passed
            ? "pass"
            : "retry"
        );


      judgment.textContent =
        result.passed
          ? "PASS"
          : "RETRY";


      item.appendChild(
        judgment
      );


      addLabel(
        item,
        "自分の録音"
      );


      if (result.audioUrl) {

        const audio =
          document.createElement(
            "audio"
          );


        audio.controls =
          true;


        audio.src =
          result.audioUrl;


        item.appendChild(
          audio
        );
      }


      addLabel(
        item,
        "文字起こし"
      );


      const transcript =
        document.createElement(
          "div"
        );


      transcript.className =
        "box";


      transcript.textContent =
        result.transcript ||
        "文字起こしを取得できませんでした。";


      item.appendChild(
        transcript
      );


      const stats =
        document.createElement(
          "div"
        );


      stats.className =
        "stats";


      stats.innerHTML =
        "単語数：" +
        result.wordCount +
        "語<br>" +
        "WPM：" +
        result.wpm +
        "<br>" +
        "内容一致率：" +
        result.keywordScore +
        "%（" +
        result.matchedGroups +
        "/" +
        result.totalGroups +
        "項目）";


      item.appendChild(
        stats
      );


      addLabel(
        item,
        "模範回答"
      );


      const model =
        document.createElement(
          "div"
        );


      model.className =
        "box";


      model.textContent =
        result.modelAnswer;


      item.appendChild(
        model
      );


      /*
        模範回答クローン音声は
        結果画面には表示しない
      */


      review.appendChild(
        item
      );
    }
  );


  review.style.display =
    "block";
}


function addLabel(
  parent,
  text
) {

  const label =
    document.createElement(
      "div"
    );


  label.className =
    "label";


  label.textContent =
    text;


  parent.appendChild(
    label
  );
}


/* =========================
   もう一度
========================= */

restartButton.addEventListener(
  "click",
  () => {

    clearInterval(
      timerId
    );


    clearTimeout(
      transitionTimerId
    );


    stopMicrophone();

    clearOldResults();


    results = [];
    current = 0;
    interrupted = false;


    finishArea.style.display =
      "none";


    practiceArea.style.display =
      "none";


    setupArea.style.display =
      "block";


    summaryArea.style.display =
      "none";


    document
      .getElementById(
        "answerReview"
      )
      .style.display =
        "none";


    restartButton.style.display =
      "none";


    reviewButton.style.display =
      "inline-block";


    startButton.disabled =
      false;
  }
);


function clearOldResults() {

  results.forEach(
    result => {

      if (
        result.audioUrl
      ) {

        URL.revokeObjectURL(
          result.audioUrl
        );
      }
    }
  );
}

</script>
