<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Instant Q&A Practice</title>

<style>
body {
  font-family: Arial, sans-serif;
  max-width: 760px;
  margin: 40px auto;
  padding: 20px;
  text-align: center;
}

#setupArea {
  font-size: 22px;
  line-height: 1.9;
}

#instructions {
  max-width: 620px;
  margin: 30px auto;
  text-align: left;
}

button {
  font-size: 20px;
  padding: 14px 26px;
  margin: 12px;
  cursor: pointer;
}

button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

#loading {
  margin: 20px 0;
  font-size: 18px;
}

#counter {
  font-size: 20px;
  margin-bottom: 30px;
}

#question {
  font-size: 34px;
  margin: 45px 0;
  min-height: 80px;
}

#phase {
  font-size: 22px;
  margin: 20px 0;
}

#timer {
  font-size: 54px;
  font-weight: bold;
  margin: 20px 0;
}

#recordingStatus {
  min-height: 38px;
  margin: 15px 0;
}

.recording {
  color: #c40000;
  font-size: 26px;
  font-weight: bold;
  animation: blink 1s infinite;
}

@keyframes blink {
  0%, 45% { opacity: 1; }
  50%, 100% { opacity: 0.2; }
}

#answerReview {
  display: none;
  margin-top: 35px;
  text-align: left;
}

.reviewItem {
  padding: 26px 0;
  border-bottom: 1px solid #ccc;
}

.reviewQuestion {
  font-size: 21px;
  font-weight: bold;
  margin-bottom: 14px;
}

.label {
  font-weight: bold;
  margin-top: 15px;
}

.box {
  background: #f5f5f5;
  padding: 12px;
  margin-top: 6px;
  line-height: 1.6;
}

.stats {
  font-size: 18px;
  margin-top: 10px;
  line-height: 1.7;
}

.score {
  font-weight: bold;
  font-size: 20px;
}

audio {
  width: 100%;
  margin-top: 8px;
}

#errorMessage {
  color: #b00020;
  font-size: 18px;
  margin-top: 16px;
}

#browserMessage {
  font-size: 17px;
  margin-top: 18px;
}

#restartButton {
  display: none;
}

@media (max-width: 600px) {
  body {
    margin: 15px auto;
    padding: 16px;
  }

  #setupArea {
    font-size: 19px;
  }

  #question {
    font-size: 28px;
    margin: 35px 0;
  }

  #timer {
    font-size: 48px;
  }
}
</style>
</head>

<body>

<audio id="signalSound" preload="auto" src="chirin.mp3"></audio>


<div id="setupArea">

  <h2>Instant Q&A Practice</h2>

  <div id="instructions">
    10問を連続で練習します。<br>
    質問の音声を最後まで聞いてください。<br>
    音声が終わると、約1秒後に回答時間が始まります。<br>
    10秒で英語で答えましょう。<br><br>

    10問すべて終わった後に、録音・文字起こし・解答例を確認できます。
  </div>

  <div id="loading">問題データを読み込んでいます...</div>

  <p>
    <strong>準備ができたら「開始」を押してください。</strong>
  </p>

  <button id="startButton" disabled>開始</button>

  <div id="browserMessage">
    ※開始時にマイクの使用を許可してください。
  </div>

  <div id="errorMessage"></div>

</div>


<div id="practiceArea" style="display:none;">

  <div id="counter"></div>
  <div id="question"></div>
  <div id="phase"></div>
  <div id="timer"></div>
  <div id="recordingStatus"></div>

  <button id="stopButton">中断する</button>

</div>


<div id="finishArea" style="display:none;">

  <h2 id="finishTitle">10問終了しました</h2>

  <button id="reviewButton">回答を確認する</button>
  <button id="restartButton">もう一度</button>

  <div id="answerReview"></div>

</div>


<script>

const API_URL =
  "https://script.google.com/macros/s/AKfycbyUwVGhGkyRpW1OuJqP-9Zl6WKiEcpqOAi3j_r4PTp-O99MQz-8Hxow_1gX8I9LmNd_nQ/exec";

const STUDENT_ID = "yasmin";
const TOPIC = "Favorites";

const ANSWER_SECONDS = 10;
const EXTRA_RECORDING_MS = 1000;
const AFTER_QUESTION_AUDIO_MS = 1000;
const AFTER_SIGNAL_MS = 1000;

let questions = [];

let current = 0;
let timerId = null;
let transitionTimerId = null;

let mediaStream = null;
let mediaRecorder = null;
let audioChunks = [];

let recognition = null;

let finalTranscript = "";
let interimTranscript = "";

let recognitionEnded = false;
let recordingEnded = false;

let results = [];
let interrupted = false;
let isEndingAnswer = false;

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


const setupArea =
  document.getElementById("setupArea");

const practiceArea =
  document.getElementById("practiceArea");

const finishArea =
  document.getElementById("finishArea");

const startButton =
  document.getElementById("startButton");

const stopButton =
  document.getElementById("stopButton");

const reviewButton =
  document.getElementById("reviewButton");

const restartButton =
  document.getElementById("restartButton");

const counterDisplay =
  document.getElementById("counter");

const questionDisplay =
  document.getElementById("question");

const phaseDisplay =
  document.getElementById("phase");

const timerDisplay =
  document.getElementById("timer");

const recordingStatus =
  document.getElementById("recordingStatus");

const finishTitle =
  document.getElementById("finishTitle");

const errorMessage =
  document.getElementById("errorMessage");

const browserMessage =
  document.getElementById("browserMessage");

const loadingDisplay =
  document.getElementById("loading");

const signalSound =
  document.getElementById("signalSound");


checkBrowser();
loadSpreadsheetData();


/* -------------------------
   スプレッドシート読み込み
------------------------- */

function loadSpreadsheetData() {

  window.receiveSpreadsheetData = function(data) {

    questions = data
      .filter(row =>
        String(row["Student ID"]).toLowerCase() ===
          STUDENT_ID.toLowerCase()
        &&
        String(row["Topic"]).toLowerCase() ===
          TOPIC.toLowerCase()
      )
      .sort((a, b) =>
        Number(a["No."]) - Number(b["No."])
      );

    if (questions.length === 0) {

      loadingDisplay.textContent =
        "問題データを読み込めませんでした。";

      return;
    }

    loadingDisplay.textContent =
      questions.length + "問を読み込みました。";

    if (SpeechRecognition &&
        navigator.mediaDevices &&
        navigator.mediaDevices.getUserMedia) {

      startButton.disabled = false;
    }
  };


  const script =
    document.createElement("script");

  script.src =
    API_URL +
    "?callback=receiveSpreadsheetData&t=" +
    Date.now();

  script.onerror = function() {

    loadingDisplay.textContent =
      "スプレッドシートとの接続に失敗しました。";

  };

  document.body.appendChild(script);
}


/* -------------------------
   ブラウザ確認
------------------------- */

function checkBrowser() {

  if (!navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia) {

    browserMessage.textContent =
      "このブラウザでは録音機能を利用できません。Chromeをご使用ください。";

    startButton.disabled = true;

    return;
  }

  if (!SpeechRecognition) {

    browserMessage.textContent =
      "このブラウザでは文字起こしに対応していません。PCまたはAndroidのChromeをご使用ください。";

    startButton.disabled = true;

    return;
  }

  browserMessage.textContent =
    "※開始時にマイクの使用を許可してください。";
}


/* -------------------------
   開始
------------------------- */

startButton.addEventListener("click", async () => {

  errorMessage.textContent = "";
  startButton.disabled = true;

  try {

    mediaStream =
      await navigator.mediaDevices.getUserMedia({
        audio: true
      });

  } catch (error) {

    errorMessage.textContent =
      "マイクを使用できません。ブラウザの設定でマイクの使用を許可してください。";

    startButton.disabled = false;

    return;
  }

  clearOldResults();

  current = 0;
  results = [];
  interrupted = false;

  restartButton.style.display = "none";

  setupArea.style.display = "none";
  finishArea.style.display = "none";
  practiceArea.style.display = "block";

  startQuestion();

});


/* -------------------------
   質問
------------------------- */

function startQuestion() {

  clearInterval(timerId);
  clearTimeout(transitionTimerId);

  if (interrupted) return;

  if (current >= questions.length) {

    finishPractice();

    return;
  }

  const q = questions[current];

  counterDisplay.textContent =
    "Q" + (current + 1) +
    " / " + questions.length;

  questionDisplay.textContent =
    q["Question"];

  timerDisplay.textContent = "";

  recordingStatus.innerHTML = "";

  phaseDisplay.textContent =
    "質問を聞いてください";

  playQuestionAudio();
}


/* -------------------------
   質問音声
------------------------- */

function playQuestionAudio() {

  const no =
    String(questions[current]["No."])
      .padStart(2, "0");

  const audio =
    new Audio("fav" + no + ".mp3");

  audio.preload = "auto";

  audio.onended = function() {

    phaseDisplay.textContent = "";

    transitionTimerId =
      setTimeout(() => {

        startAnswerTime();

      }, AFTER_QUESTION_AUDIO_MS);
  };


  audio.onerror = function() {

    /*
      音声が読み込めない場合も
      テスト自体は停止させない
    */

    phaseDisplay.textContent =
      "質問音声を再生できませんでした";

    transitionTimerId =
      setTimeout(() => {

        startAnswerTime();

      }, 1500);
  };


  audio.play().catch(() => {

    phaseDisplay.textContent =
      "質問音声を再生できませんでした";

    transitionTimerId =
      setTimeout(() => {

        startAnswerTime();

      }, 1500);

  });
}


/* -------------------------
   回答開始
------------------------- */

function startAnswerTime() {

  let remaining = ANSWER_SECONDS;

  isEndingAnswer = false;

  finalTranscript = "";
  interimTranscript = "";

  recognitionEnded = false;
  recordingEnded = false;

  audioChunks = [];

  phaseDisplay.textContent =
    "回答時間";

  timerDisplay.textContent =
    remaining;

  recordingStatus.innerHTML =
    '<span class="recording">● Recording</span>';

  startRecording();
  startRecognition();

  timerId = setInterval(() => {

    remaining--;

    timerDisplay.textContent =
      remaining;

    if (remaining <= 0) {

      clearInterval(timerId);

      /*
        0秒を表示したまま
        さらに1秒録音する
      */

      transitionTimerId =
        setTimeout(() => {

          finishCurrentAnswer();

        }, EXTRA_RECORDING_MS);
    }

  }, 1000);
}


/* -------------------------
   録音
------------------------- */

function startRecording() {

  try {

    mediaRecorder =
      new MediaRecorder(mediaStream);

    audioChunks = [];

    mediaRecorder.ondataavailable =
      event => {

        if (event.data &&
            event.data.size > 0) {

          audioChunks.push(
            event.data
          );
        }
      };


    mediaRecorder.onstop =
      function() {

        recordingEnded = true;

        checkAnswerReady();
      };


    mediaRecorder.start();

  } catch (error) {

    recordingEnded = true;

    recordingStatus.textContent =
      "録音を開始できませんでした。";
  }
}


/* -------------------------
   音声認識
------------------------- */

function startRecognition() {

  recognition =
    new SpeechRecognition();

  recognition.lang = "en-US";
  recognition.continuous = true;
  recognition.interimResults = true;


  recognition.onresult =
    function(event) {

      interimTranscript = "";

      for (
        let i = event.resultIndex;
        i < event.results.length;
        i++
      ) {

        const text =
          event.results[i][0].transcript;

        if (event.results[i].isFinal) {

          finalTranscript +=
            text + " ";

        } else {

          interimTranscript +=
            text + " ";
        }
      }
    };


  recognition.onerror =
    function(event) {

      console.log(
        "Speech recognition error:",
        event.error
      );
    };


  recognition.onend =
    function() {

      recognitionEnded = true;

      checkAnswerReady();
    };


  try {

    recognition.start();

  } catch (error) {

    recognitionEnded = true;
  }
}


/* -------------------------
   回答終了
------------------------- */

function finishCurrentAnswer() {

  if (isEndingAnswer) return;

  isEndingAnswer = true;

  recordingStatus.innerHTML = "";

  /*
    interim結果も最後に保存候補へ残す
  */

  if (interimTranscript.trim()) {

    finalTranscript +=
      interimTranscript.trim() + " ";

  }

  interimTranscript = "";


  if (recognition) {

    try {

      recognition.stop();

    } catch (error) {

      recognitionEnded = true;
    }

  } else {

    recognitionEnded = true;
  }


  if (
    mediaRecorder &&
    mediaRecorder.state !== "inactive"
  ) {

    try {

      mediaRecorder.stop();

    } catch (error) {

      recordingEnded = true;
    }

  } else {

    recordingEnded = true;
  }


  /*
    認識終了イベントを待つが、
    万一来なかった場合も停止しない
  */

  setTimeout(() => {

    if (!recognitionEnded) {

      recognitionEnded = true;

      checkAnswerReady();
    }

  }, 1200);


  checkAnswerReady();
}


function checkAnswerReady() {

  if (!recognitionEnded ||
      !recordingEnded) {

    return;
  }

  saveCurrentResult();

  playSignalAndMove();
}


/* -------------------------
   結果保存
------------------------- */

function saveCurrentResult() {

  let audioUrl = null;

  if (audioChunks.length > 0) {

    const mimeType =
      mediaRecorder &&
      mediaRecorder.mimeType
        ? mediaRecorder.mimeType
        : "audio/webm";

    const blob =
      new Blob(
        audioChunks,
        { type: mimeType }
      );

    audioUrl =
      URL.createObjectURL(blob);
  }


  const transcript =
    finalTranscript.trim();

  const wordCount =
    countWords(transcript);

  const wpm =
    wordCount > 0
      ? Math.round(
          wordCount *
          60 /
          ANSWER_SECONDS
        )
      : 0;


  const keywordResult =
    calculateKeywordScore(
      transcript,
      questions[current]
    );


  results.push({

    no:
      questions[current]["No."],

    question:
      questions[current]["Question"],

    transcript:
      transcript,

    modelAnswer:
      questions[current]["Model Answer"],

    audioUrl:
      audioUrl,

    wordCount:
      wordCount,

    wpm:
      wpm,

    keywordScore:
      keywordResult.score,

    matchedGroups:
      keywordResult.matched,

    totalGroups:
      keywordResult.total
  });
}


/* -------------------------
   キーワード内容判定
------------------------- */

function calculateKeywordScore(
  transcript,
  question
) {

  const normalized =
    normalizeText(transcript);

  const groups = [];

  for (let i = 1; i <= 5; i++) {

    const value =
      question[
        "Keyword Group " + i
      ];

    if (value &&
        String(value).trim()) {

      groups.push(
        String(value)
      );
    }
  }


  let matched = 0;

  groups.forEach(group => {

    const alternatives =
      group
        .split("|")
        .map(item =>
          normalizeText(item)
        )
        .filter(Boolean);


    const hit =
      alternatives.some(
        alternative =>
          normalized.includes(
            alternative
          )
      );


    if (hit) matched++;
  });


  const score =
    groups.length > 0
      ? Math.round(
          matched /
          groups.length *
          100
        )
      : 0;


  return {
    score: score,
    matched: matched,
    total: groups.length
  };
}


function normalizeText(text) {

  return String(text || "")
    .toLowerCase()
    .replace(/[.,!?'"’]/g, "")
    .replace(/\s+/g, " ")
    .trim();
}


function countWords(text) {

  if (!text) return 0;

  return text
    .trim()
    .split(/\s+/)
    .filter(Boolean)
    .length;
}


/* -------------------------
   切り替え音 → 次へ
------------------------- */

function playSignalAndMove() {

  if (interrupted) return;

  try {

    signalSound.currentTime = 0;

    signalSound
      .play()
      .catch(() => {});

  } catch (error) {}


  /*
    チリンを鳴らしてから
    1秒待って次の問題へ
  */

  transitionTimerId =
    setTimeout(() => {

      if (interrupted) return;

      current++;

      startQuestion();

    }, AFTER_SIGNAL_MS);
}


/* -------------------------
   中断
------------------------- */

stopButton.addEventListener(
  "click",
  () => {

    interrupted = true;

    clearInterval(timerId);
    clearTimeout(transitionTimerId);

    if (recognition) {

      try {
        recognition.abort();
      } catch (error) {}
    }


    if (
      mediaRecorder &&
      mediaRecorder.state !== "inactive"
    ) {

      mediaRecorder.onstop = null;

      try {
        mediaRecorder.stop();
      } catch (error) {}
    }


    stopMicrophone();

    practiceArea.style.display =
      "none";

    finishArea.style.display =
      "block";

    finishTitle.textContent =
      "中断しました（" +
      results.length +
      "問完了）";

    reviewButton.style.display =
      results.length > 0
        ? "inline-block"
        : "none";

    restartButton.style.display =
      "none";
  }
);


/* -------------------------
   全問終了
------------------------- */

function finishPractice() {

  clearInterval(timerId);
  clearTimeout(transitionTimerId);

  stopMicrophone();

  practiceArea.style.display =
    "none";

  finishArea.style.display =
    "block";

  finishTitle.textContent =
    "10問終了しました";

  reviewButton.style.display =
    "inline-block";

  restartButton.style.display =
    "none";
}


function stopMicrophone() {

  if (mediaStream) {

    mediaStream
      .getTracks()
      .forEach(
        track => track.stop()
      );

    mediaStream = null;
  }
}


/* -------------------------
   結果確認
------------------------- */

reviewButton.addEventListener(
  "click",
  () => {

    const review =
      document.getElementById(
        "answerReview"
      );

    review.innerHTML = "";


    results.forEach(
      (result, index) => {

        const item =
          document.createElement(
            "div"
          );

        item.className =
          "reviewItem";


        const question =
          document.createElement(
            "div"
          );

        question.className =
          "reviewQuestion";

        question.textContent =
          "Q" +
          (index + 1) +
          ". " +
          result.question;


        item.appendChild(
          question
        );


        addLabel(
          item,
          "自分の録音"
        );


        if (result.audioUrl) {

          const audio =
            document.createElement(
              "audio"
            );

          audio.controls = true;
          audio.src =
            result.audioUrl;

          item.appendChild(
            audio
          );
        }


        addLabel(
          item,
          "文字起こし"
        );


        const transcript =
          document.createElement(
            "div"
          );

        transcript.className =
          "box";

        transcript.textContent =
          result.transcript ||
          "文字起こしを取得できませんでした。";

        item.appendChild(
          transcript
        );


        const stats =
          document.createElement(
            "div"
          );

        stats.className =
          "stats";

        stats.innerHTML =
          "単語数：" +
          result.wordCount +
          "語<br>" +
          "WPM：" +
          result.wpm +
          "<br>" +
          '<span class="score">' +
          "内容一致率：" +
          result.keywordScore +
          "%</span>" +
          "（" +
          result.matchedGroups +
          "/" +
          result.totalGroups +
          "項目）";

        item.appendChild(
          stats
        );


        addLabel(
          item,
          "模範回答"
        );


        const model =
          document.createElement(
            "div"
          );

        model.className =
          "box";

        model.textContent =
          result.modelAnswer;

        item.appendChild(
          model
        );


        addLabel(
          item,
          "模範回答の音声"
        );


        const modelAudio =
          document.createElement(
            "audio"
          );

        modelAudio.controls = true;

        const no =
          String(result.no)
            .padStart(2, "0");

        modelAudio.src =
          "yasmin_fav" +
          no +
          ".mp3";

        item.appendChild(
          modelAudio
        );


        review.appendChild(
          item
        );
      }
    );


    review.style.display =
      "block";

    restartButton.style.display =
      "inline-block";
  }
);


function addLabel(parent, text) {

  const label =
    document.createElement(
      "div"
    );

  label.className =
    "label";

  label.textContent =
    text;

  parent.appendChild(
    label
  );
}


/* -------------------------
   もう一度
------------------------- */

restartButton.addEventListener(
  "click",
  () => {

    clearInterval(timerId);
    clearTimeout(transitionTimerId);

    stopMicrophone();

    clearOldResults();

    results = [];
    current = 0;
    interrupted = false;

    finishArea.style.display =
      "none";

    practiceArea.style.display =
      "none";

    setupArea.style.display =
      "block";

    document
      .getElementById(
        "answerReview"
      )
      .style.display =
        "none";

    restartButton.style.display =
      "none";

    reviewButton.style.display =
      "inline-block";

    startButton.disabled =
      false;
  }
);


function clearOldResults() {

  results.forEach(
    result => {

      if (result.audioUrl) {

        URL.revokeObjectURL(
          result.audioUrl
        );
      }
    }
  );
}

</script>

</body>
</html>
