<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Instant Q&A Practice</title>

<style>
body {
  font-family: Arial, sans-serif;
  max-width: 760px;
  margin: 40px auto;
  padding: 20px;
  text-align: center;
}

#setupArea {
  font-size: 22px;
  line-height: 1.9;
}

#instructions {
  max-width: 620px;
  margin: 30px auto;
  text-align: left;
}

button {
  font-size: 20px;
  padding: 14px 26px;
  margin: 12px;
  cursor: pointer;
}

button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

#loading {
  margin: 20px 0;
  font-size: 18px;
}

#counter {
  font-size: 20px;
  margin-bottom: 30px;
}

#question {
  font-size: 34px;
  margin: 45px 0;
  min-height: 80px;
}

#phase {
  font-size: 22px;
  margin: 20px 0;
}

#timer {
  font-size: 54px;
  font-weight: bold;
  margin: 20px 0;
}

#recordingStatus {
  min-height: 38px;
  margin: 15px 0;
}

.recording {
  color: #c40000;
  font-size: 26px;
  font-weight: bold;
  animation: blink 1s infinite;
}

@keyframes blink {
  0%, 45% { opacity: 1; }
  50%, 100% { opacity: 0.2; }
}

#finishTitle {
  font-size: 30px;
  margin-bottom: 24px;
}

#summaryArea {
  margin: 20px auto 40px;
  padding: 24px;
  background: #f5f5f5;
  max-width: 620px;
  text-align: left;
}

#scoreDisplay {
  font-size: 40px;
  font-weight: bold;
  text-align: center;
  margin-bottom: 12px;
}

#scoreMessage {
  font-size: 22px;
  font-weight: bold;
  text-align: center;
  margin-bottom: 24px;
  line-height: 1.6;
}

.summaryRow {
  font-size: 20px;
  padding: 6px 0;
}

.pass {
  color: #16803a;
  font-weight: bold;
}

.retry {
  color: #c40000;
  font-weight: bold;
}

#answerReview {
  margin-top: 35px;
  text-align: left;
}

.reviewItem {
  padding: 26px 0;
  border-bottom: 1px solid #ccc;
}

.reviewQuestion {
  font-size: 21px;
  font-weight: bold;
  margin-bottom: 10px;
}

.judgment {
  font-size: 24px;
  margin-bottom: 12px;
}

.label {
  font-weight: bold;
  margin-top: 15px;
}

.box {
  background: #f5f5f5;
  padding: 12px;
  margin-top: 6px;
  line-height: 1.6;
}

.stats {
  font-size: 18px;
  margin-top: 12px;
  line-height: 1.8;
}

audio {
  width: 100%;
  margin-top: 8px;
}

#errorMessage {
  color: #b00020;
  font-size: 18px;
  margin-top: 16px;
}

#browserMessage {
  font-size: 17px;
  margin-top: 18px;
}

#restartArea {
  margin-top: 40px;
  padding-top: 25px;
}

@media (max-width: 600px) {
  body {
    margin: 15px auto;
    padding: 16px;
  }

  #setupArea {
    font-size: 19px;
  }

  #question {
    font-size: 28px;
    margin: 35px 0;
  }

  #timer {
    font-size: 48px;
  }

  #scoreDisplay {
    font-size: 34px;
  }
}
</style>
</head>

<body>

<audio id="signalSound" preload="auto" src="chirin.mp3"></audio>

<div id="setupArea">

  <h2>Instant Q&A Practice</h2>

  <div id="instructions">
    5問を連続で練習します。<br>
    質問の音声を最後まで聞いてください。<br>
    音声が終わったら、すぐに英語で答えましょう。<br><br>

    5問すべて終わった後に、成績と回答内容を確認できます。
  </div>

  <div id="loading">
    問題データを読み込んでいます...
  </div>

  <p>
    <strong>準備ができたら「開始」を押してください。</strong>
  </p>

  <button id="startButton" disabled>
    開始
  </button>

  <div id="browserMessage">
    ※開始時にマイクの使用を許可してください。
  </div>

  <div id="errorMessage"></div>

</div>


<div id="practiceArea" style="display:none;">

  <div id="counter"></div>
  <div id="question"></div>
  <div id="phase"></div>
  <div id="timer"></div>
  <div id="recordingStatus"></div>

  <button id="stopButton">
    中断する
  </button>

</div>


<div id="finishArea" style="display:none;">

  <h2 id="finishTitle">
    成績を確認しましょう
  </h2>

  <div id="summaryArea"></div>

  <div id="answerReview"></div>

  <div id="restartArea">
    <button id="restartButton">
      もう一度
    </button>
  </div>

</div>


<script>

const API_URL =
  "https://script.google.com/macros/s/AKfycbyUwVGhGkyRpW1OuJqP-9Zl6WKiEcpqOAi3j_r4PTp-O99MQz-8Hxow_1gX8I9LmNd_nQ/exec";

const STUDENT_ID = "yasmin";
const TOPIC = "Favorites";

const ANSWER_SECONDS = 10;

/*
新しい設問を表示したら
すぐにネイティブ音声を開始
*/
const QUESTION_AUDIO_DELAY_MS = 0;

/*
質問音声ファイル末尾の無音を見越して
ファイル終了0.8秒前から回答受付開始
*/
const QUESTION_TAIL_LEAD_MS = 800;

/*
0表示後も1秒録音
*/
const EXTRA_RECORDING_MS = 1000;

/*
チリンが完全に終了した後
さらに1秒待って次の問題へ
*/
const AFTER_SIGNAL_END_MS = 1000;

/*
合格条件
*/
const PASS_WORDS = 15;
const PASS_CONTENT = 60;

/*
出題数と配点
*/
const QUESTION_COUNT = 5;
const POINTS_PER_QUESTION = 20;


let questions = [];
let current = 0;

let timerId = null;
let transitionTimerId = null;
let answerStartTimerId = null;

let questionAudio = null;

let mediaStream = null;
let mediaRecorder = null;
let audioChunks = [];

let recognition = null;

let recognitionResults = {};
let lastInterimText = "";

let recognitionEnded = false;
let recordingEnded = false;
let answerSaved = false;

let results = [];

let interrupted = false;
let isEndingAnswer = false;
let answerStarted = false;


const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


const setupArea =
  document.getElementById("setupArea");

const practiceArea =
  document.getElementById("practiceArea");

const finishArea =
  document.getElementById("finishArea");

const startButton =
  document.getElementById("startButton");

const stopButton =
  document.getElementById("stopButton");

const restartButton =
  document.getElementById("restartButton");

const counterDisplay =
  document.getElementById("counter");

const questionDisplay =
  document.getElementById("question");

const phaseDisplay =
  document.getElementById("phase");

const timerDisplay =
  document.getElementById("timer");

const recordingStatus =
  document.getElementById("recordingStatus");

const finishTitle =
  document.getElementById("finishTitle");

const errorMessage =
  document.getElementById("errorMessage");

const browserMessage =
  document.getElementById("browserMessage");

const loadingDisplay =
  document.getElementById("loading");

const signalSound =
  document.getElementById("signalSound");

const summaryArea =
  document.getElementById("summaryArea");

const answerReview =
  document.getElementById("answerReview");


checkBrowser();
loadSpreadsheetData();


function loadSpreadsheetData() {

  window.receiveSpreadsheetData =
    function(data) {

      questions = data
        .filter(row =>
          String(row["Student ID"]).toLowerCase() ===
            STUDENT_ID.toLowerCase()
          &&
          String(row["Topic"]).toLowerCase() ===
            TOPIC.toLowerCase()
        )
        .sort((a, b) =>
          Number(a["No."]) -
          Number(b["No."])
        )
        .slice(0, QUESTION_COUNT);


      if (questions.length === 0) {

        loadingDisplay.textContent =
          "問題データを読み込めませんでした。";

        return;
      }


      loadingDisplay.textContent =
        questions.length +
        "問を読み込みました。";


      if (
        SpeechRecognition &&
        navigator.mediaDevices &&
        navigator.mediaDevices.getUserMedia
      ) {

        startButton.disabled = false;
      }
    };


  const script =
    document.createElement("script");

  script.src =
    API_URL +
    "?callback=receiveSpreadsheetData&t=" +
    Date.now();

  script.onerror =
    function() {

      loadingDisplay.textContent =
        "スプレッドシートとの接続に失敗しました。";
    };

  document.body.appendChild(script);
}


function checkBrowser() {

  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {

    browserMessage.textContent =
      "このブラウザでは録音機能を利用できません。Chromeをご使用ください。";

    startButton.disabled = true;

    return;
  }


  if (!SpeechRecognition) {

    browserMessage.textContent =
      "このブラウザでは文字起こしに対応していません。PCまたはAndroidのChromeをご使用ください。";

    startButton.disabled = true;

    return;
  }


  browserMessage.textContent =
    "※開始時にマイクの使用を許可してください。";
}


startButton.addEventListener(
  "click",
  async () => {

    errorMessage.textContent = "";

    startButton.disabled = true;


    try {

      mediaStream =
        await navigator.mediaDevices
          .getUserMedia({
            audio: true
          });

    } catch (error) {

      errorMessage.textContent =
        "マイクを使用できません。ブラウザの設定でマイクの使用を許可してください。";

      startButton.disabled = false;

      return;
    }


    clearOldResults();

    current = 0;
    results = [];
    interrupted = false;

    summaryArea.innerHTML = "";
    answerReview.innerHTML = "";

    setupArea.style.display = "none";
    finishArea.style.display = "none";
    practiceArea.style.display = "block";

    startQuestion();
  }
);


function startQuestion() {

  clearInterval(timerId);
  clearTimeout(transitionTimerId);
  clearTimeout(answerStartTimerId);

  answerStarted = false;


  if (interrupted) return;


  if (current >= questions.length) {

    finishPractice();

    return;
  }


  const q =
    questions[current];


  counterDisplay.textContent =
    "Q" +
    (current + 1) +
    " / " +
    questions.length;


  questionDisplay.textContent =
    q["Question"];


  timerDisplay.textContent = "";

  recordingStatus.innerHTML = "";

  phaseDisplay.textContent =
    "質問を聞いてください";


  transitionTimerId =
    setTimeout(() => {

      playQuestionAudio();

    }, QUESTION_AUDIO_DELAY_MS);
}


function playQuestionAudio() {

  const no =
    String(
      questions[current]["No."]
    ).padStart(2, "0");


  questionAudio =
    new Audio(
      "fav" +
      no +
      ".mp3"
    );


  questionAudio.preload = "auto";


  questionAudio.onloadedmetadata =
    function() {

      const durationMs =
        questionAudio.duration * 1000;


      const startAfterMs =
        Math.max(
          0,
          durationMs -
          QUESTION_TAIL_LEAD_MS
        );


      answerStartTimerId =
        setTimeout(() => {

          startAnswerTime();

        }, startAfterMs);
    };


  questionAudio.onended =
    function() {

      if (!answerStarted) {

        startAnswerTime();
      }
    };


  questionAudio.onerror =
    function() {

      phaseDisplay.textContent =
        "質問音声を再生できませんでした";


      if (!answerStarted) {

        setTimeout(() => {

          startAnswerTime();

        }, 500);
      }
    };


  questionAudio
    .play()
    .catch(() => {

      phaseDisplay.textContent =
        "質問音声を再生できませんでした";


      if (!answerStarted) {

        setTimeout(() => {

          startAnswerTime();

        }, 500);
      }
    });
}


function startAnswerTime() {

  if (answerStarted) return;

  answerStarted = true;

  clearTimeout(answerStartTimerId);


  let remaining =
    ANSWER_SECONDS;


  isEndingAnswer = false;
  answerSaved = false;

  recognitionResults = {};
  lastInterimText = "";

  recognitionEnded = false;
  recordingEnded = false;

  audioChunks = [];


  phaseDisplay.textContent =
    "回答時間";


  timerDisplay.textContent =
    remaining;


  recordingStatus.innerHTML =
    '<span class="recording">● Recording</span>';


  startRecording();
  startRecognition();


  timerId =
    setInterval(() => {

      remaining--;

      timerDisplay.textContent =
        remaining;


      if (remaining <= 0) {

        clearInterval(timerId);


        transitionTimerId =
          setTimeout(() => {

            finishCurrentAnswer();

          }, EXTRA_RECORDING_MS);
      }

    }, 1000);
}


function startRecording() {

  try {

    mediaRecorder =
      new MediaRecorder(
        mediaStream
      );


    audioChunks = [];


    mediaRecorder.ondataavailable =
      event => {

        if (
          event.data &&
          event.data.size > 0
        ) {

          audioChunks.push(
            event.data
          );
        }
      };


    mediaRecorder.onstop =
      function() {

        recordingEnded = true;

        checkAnswerReady();
      };


    mediaRecorder.start();


  } catch (error) {

    recordingEnded = true;

    recordingStatus.textContent =
      "録音を開始できませんでした。";
  }
}


function startRecognition() {

  recognition =
    new SpeechRecognition();


  recognition.lang =
    "en-US";

  recognition.continuous =
    true;

  recognition.interimResults =
    true;


  recognition.onresult =
    function(event) {

      for (
        let i = event.resultIndex;
        i < event.results.length;
        i++
      ) {

        const text =
          event.results[i][0]
            .transcript
            .trim();


        if (
          event.results[i].isFinal
        ) {

          recognitionResults[i] =
            text;

          lastInterimText = "";

        } else {

          lastInterimText =
            text;
        }
      }
    };


  recognition.onerror =
    function(event) {

      console.log(
        "Speech recognition error:",
        event.error
      );
    };


  recognition.onend =
    function() {

      recognitionEnded = true;

      checkAnswerReady();
    };


  try {

    recognition.start();

  } catch (error) {

    recognitionEnded = true;
  }
}


function finishCurrentAnswer() {

  if (isEndingAnswer) return;


  isEndingAnswer = true;

  recordingStatus.innerHTML = "";


  if (recognition) {

    try {

      recognition.stop();

    } catch (error) {

      recognitionEnded = true;
    }

  } else {

    recognitionEnded = true;
  }


  if (
    mediaRecorder &&
    mediaRecorder.state !== "inactive"
  ) {

    try {

      mediaRecorder.stop();

    } catch (error) {

      recordingEnded = true;
    }

  } else {

    recordingEnded = true;
  }


  setTimeout(() => {

    if (!recognitionEnded) {

      recognitionEnded = true;

      checkAnswerReady();
    }

  }, 1500);


  checkAnswerReady();
}


function checkAnswerReady() {

  if (
    !recognitionEnded ||
    !recordingEnded ||
    answerSaved
  ) {

    return;
  }


  answerSaved = true;


  saveCurrentResult();

  playSignalAndMove();
}


function buildTranscript() {

  const keys =
    Object.keys(
      recognitionResults
    )
    .map(Number)
    .sort(
      (a, b) =>
        a - b
    );


  const finalParts =
    keys
      .map(
        key =>
          recognitionResults[key]
      )
      .filter(Boolean);


  let transcript =
    finalParts
      .join(" ")
      .trim();


  if (lastInterimText) {

    transcript =
      appendWithoutOverlap(
        transcript,
        lastInterimText
      );
  }


  return cleanDuplicatePhrases(
    transcript
  );
}


function appendWithoutOverlap(
  base,
  extra
) {

  base =
    String(base || "").trim();

  extra =
    String(extra || "").trim();


  if (!base) return extra;

  if (!extra) return base;


  const baseWords =
    base.split(/\s+/);

  const extraWords =
    extra.split(/\s+/);


  const maxOverlap =
    Math.min(
      baseWords.length,
      extraWords.length,
      12
    );


  let overlap = 0;


  for (
    let n = maxOverlap;
    n >= 1;
    n--
  ) {

    const end =
      baseWords
        .slice(-n)
        .join(" ")
        .toLowerCase();


    const start =
      extraWords
        .slice(0, n)
        .join(" ")
        .toLowerCase();


    if (end === start) {

      overlap = n;

      break;
    }
  }


  return (
    base +
    " " +
    extraWords
      .slice(overlap)
      .join(" ")
  ).trim();
}


function cleanDuplicatePhrases(
  text
) {

  const words =
    String(text || "")
      .trim()
      .split(/\s+/)
      .filter(Boolean);


  if (words.length < 6) {

    return words.join(" ");
  }


  for (
    let size =
      Math.min(
        15,
        Math.floor(
          words.length / 2
        )
      );
    size >= 3;
    size--
  ) {

    let i = 0;


    while (
      i +
      size * 2 <=
      words.length
    ) {

      const first =
        words
          .slice(
            i,
            i + size
          )
          .join(" ")
          .toLowerCase();


      const second =
        words
          .slice(
            i + size,
            i + size * 2
          )
          .join(" ")
          .toLowerCase();


      if (first === second) {

        words.splice(
          i + size,
          size
        );

      } else {

        i++;
      }
    }
  }


  return words.join(" ");
}


function saveCurrentResult() {

  let audioUrl = null;


  if (
    audioChunks.length > 0
  ) {

    const mimeType =
      mediaRecorder &&
      mediaRecorder.mimeType
        ? mediaRecorder.mimeType
        : "audio/webm";


    const blob =
      new Blob(
        audioChunks,
        {
          type: mimeType
        }
      );


    audioUrl =
      URL.createObjectURL(
        blob
      );
  }


  const transcript =
    buildTranscript();


  const wordCount =
    countWords(
      transcript
    );


  const wpm =
    wordCount > 0
      ? Math.round(
          wordCount *
          60 /
          ANSWER_SECONDS
        )
      : 0;


  const keywordResult =
    calculateKeywordScore(
      transcript,
      questions[current]
    );


  const passed =
    wordCount >= PASS_WORDS
    &&
    keywordResult.score >= PASS_CONTENT;


  results.push({

    no:
      questions[current]["No."],

    question:
      questions[current]["Question"],

    transcript:
      transcript,

    modelAnswer:
      questions[current]
        ["Model Answer"],

    audioUrl:
      audioUrl,

    wordCount:
      wordCount,

    wpm:
      wpm,

    keywordScore:
      keywordResult.score,

    matchedGroups:
      keywordResult.matched,

    totalGroups:
      keywordResult.total,

    passed:
      passed
  });
}


function calculateKeywordScore(
  transcript,
  question
) {

  const normalized =
    normalizeText(
      transcript
    );


  const groups = [];


  for (
    let i = 1;
    i <= 5;
    i++
  ) {

    const value =
      question[
        "Keyword Group " + i
      ];


    if (
      value &&
      String(value).trim()
    ) {

      groups.push(
        String(value)
      );
    }
  }


  let matched = 0;


  groups.forEach(
    group => {

      const alternatives =
        group
          .split("|")
          .map(
            item =>
              normalizeText(
                item
              )
          )
          .filter(Boolean);


      const hit =
        alternatives.some(
          alternative =>
            alternativeMatches(
              normalized,
              alternative
            )
        );


      if (hit) {

        matched++;
      }
    }
  );


  const score =
    groups.length > 0
      ? Math.round(
          matched /
          groups.length *
          100
        )
      : 0;


  return {
    score: score,
    matched: matched,
    total: groups.length
  };
}


function alternativeMatches(
  transcript,
  alternative
) {

  if (!alternative) {

    return false;
  }


  const paddedTranscript =
    " " +
    transcript +
    " ";


  const paddedAlternative =
    " " +
    alternative +
    " ";


  if (
    paddedTranscript.includes(
      paddedAlternative
    )
  ) {

    return true;
  }


  if (
    !alternative.includes(" ")
  ) {

    const words =
      transcript.split(" ");


    const forms =
      makeWordForms(
        alternative
      );


    return words.some(
      word =>
        forms.includes(
          word
        )
    );
  }


  return false;
}


function makeWordForms(
  word
) {

  const forms =
    new Set([word]);


  if (
    word.length < 3
  ) {

    return Array.from(
      forms
    );
  }


  forms.add(
    word + "s"
  );

  forms.add(
    word + "ed"
  );

  forms.add(
    word + "ing"
  );


  if (
    word.endsWith("e")
  ) {

    forms.add(
      word.slice(0, -1) +
      "ing"
    );

    forms.add(
      word + "d"
    );
  }


  if (
    word.endsWith("y")
  ) {

    forms.add(
      word.slice(0, -1) +
      "ies"
    );
  }


  return Array.from(
    forms
  );
}


function normalizeText(
  text
) {

  return String(
    text || ""
  )
    .toLowerCase()
    .replace(
      /[^a-z0-9\s]/g,
      " "
    )
    .replace(
      /\s+/g,
      " "
    )
    .trim();
}


function countWords(
  text
) {

  if (!text) {

    return 0;
  }


  return text
    .trim()
    .split(/\s+/)
    .filter(Boolean)
    .length;
}


function playSignalAndMove() {

  if (interrupted) return;


  let moved = false;


  const moveToNext =
    function() {

      if (
        moved ||
        interrupted
      ) {

        return;
      }


      moved = true;


      transitionTimerId =
        setTimeout(() => {

          if (interrupted) return;


          current++;

          startQuestion();

        }, AFTER_SIGNAL_END_MS);
    };


  signalSound.onended =
    function() {

      moveToNext();
    };


  signalSound.onerror =
    function() {

      moveToNext();
    };


  try {

    signalSound.currentTime =
      0;


    signalSound
      .play()
      .catch(() => {

        moveToNext();
      });

  } catch (error) {

    moveToNext();
  }
}


stopButton.addEventListener(
  "click",
  () => {

    interrupted = true;

    clearInterval(timerId);
    clearTimeout(transitionTimerId);
    clearTimeout(answerStartTimerId);


    if (questionAudio) {

      try {

        questionAudio.pause();

      } catch (error) {}
    }


    if (recognition) {

      try {

        recognition.abort();

      } catch (error) {}
    }


    if (
      mediaRecorder &&
      mediaRecorder.state !==
        "inactive"
    ) {

      mediaRecorder.onstop =
        null;


      try {

        mediaRecorder.stop();

      } catch (error) {}
    }


    stopMicrophone();


    practiceArea.style.display =
      "none";


    finishArea.style.display =
      "block";


    finishTitle.textContent =
      "中断しました";


    showInterruptedResults();
  }
);


function finishPractice() {

  clearInterval(timerId);
  clearTimeout(transitionTimerId);
  clearTimeout(answerStartTimerId);

  stopMicrophone();


  practiceArea.style.display =
    "none";


  finishArea.style.display =
    "block";


  finishTitle.textContent =
    "成績を確認しましょう";


  showFinalResults();
}


function showFinalResults() {

  const passCount =
    results.filter(
      result =>
        result.passed
    ).length;


  const score =
    passCount *
    POINTS_PER_QUESTION;


  summaryArea.innerHTML = "";


  const scoreDisplay =
    document.createElement(
      "div"
    );


  scoreDisplay.id =
    "scoreDisplay";


  scoreDisplay.textContent =
    score +
    " / 100点";


  summaryArea.appendChild(
    scoreDisplay
  );


  const message =
    document.createElement(
      "div"
    );


  message.id =
    "scoreMessage";


  if (score === 100) {

    message.innerHTML =
      '<span class="pass">合格です！</span> 練習の成果が発揮できましたね。';

  } else if (score >= 70) {

    message.innerHTML =
      '<strong>もう一息です！</strong> 次回は合格をねらいましょう。';

  } else {

    message.innerHTML =
      '<strong>お疲れさまです！練習してから再挑戦しましょう。</strong>';
  }


  summaryArea.appendChild(
    message
  );


  results.forEach(
    (result, index) => {

      const row =
        document.createElement(
          "div"
        );


      row.className =
        "summaryRow";


      row.innerHTML =
        "Q" +
        (index + 1) +
        "　" +
        (
          result.passed
            ? '<span class="pass">PASS</span>'
            : '<span class="retry">RETRY</span>'
        );


      summaryArea.appendChild(
        row
      );
    }
  );


  showDetailedResults();
}


function showInterruptedResults() {

  summaryArea.innerHTML =
    "<p>完了した問題のみ表示します。</p>";


  showDetailedResults();
}


function showDetailedResults() {

  answerReview.innerHTML = "";


  results.forEach(
    (result, index) => {

      const item =
        document.createElement(
          "div"
        );


      item.className =
        "reviewItem";


      const question =
        document.createElement(
          "div"
        );


      question.className =
        "reviewQuestion";


      question.textContent =
        "Q" +
        (index + 1) +
        ". " +
        result.question;


      item.appendChild(
        question
      );


      const judgment =
        document.createElement(
          "div"
        );


      judgment.className =
        "judgment " +
        (
          result.passed
            ? "pass"
            : "retry"
        );


      judgment.textContent =
        result.passed
          ? "PASS"
          : "RETRY";


      item.appendChild(
        judgment
      );


      addLabel(
        item,
        "自分の録音"
      );


      if (result.audioUrl) {

        const audio =
          document.createElement(
            "audio"
          );


        audio.controls = true;

        audio.src =
          result.audioUrl;


        item.appendChild(
          audio
        );
      }


      addLabel(
        item,
        "文字起こし"
      );


      const transcript =
        document.createElement(
          "div"
        );


      transcript.className =
        "box";


      transcript.textContent =
        result.transcript ||
        "文字起こしを取得できませんでした。";


      item.appendChild(
        transcript
      );


      const stats =
        document.createElement(
          "div"
        );


      stats.className =
        "stats";


      stats.innerHTML =
        "単語数：" +
        result.wordCount +
        "語<br>" +
        "WPM：" +
        result.wpm +
        "<br>" +
        "内容一致率：" +
        result.keywordScore +
        "%（" +
        result.matchedGroups +
        "/" +
        result.totalGroups +
        "項目）";


      item.appendChild(
        stats
      );


      addLabel(
        item,
        "模範回答"
      );


      const model =
        document.createElement(
          "div"
        );


      model.className =
        "box";


      model.textContent =
        result.modelAnswer;


      item.appendChild(
        model
      );


      answerReview.appendChild(
        item
      );
    }
  );
}


function addLabel(
  parent,
  text
) {

  const label =
    document.createElement(
      "div"
    );


  label.className =
    "label";


  label.textContent =
    text;


  parent.appendChild(
    label
  );
}


function stopMicrophone() {

  if (mediaStream) {

    mediaStream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );


    mediaStream = null;
  }
}


restartButton.addEventListener(
  "click",
  () => {

    clearInterval(timerId);
    clearTimeout(transitionTimerId);
    clearTimeout(answerStartTimerId);

    stopMicrophone();

    clearOldResults();


    results = [];
    current = 0;
    interrupted = false;


    finishArea.style.display =
      "none";


    practiceArea.style.display =
      "none";


    setupArea.style.display =
      "block";


    summaryArea.innerHTML = "";
    answerReview.innerHTML = "";


    startButton.disabled =
      false;
  }
);


function clearOldResults() {

  results.forEach(
    result => {

      if (result.audioUrl) {

        URL.revokeObjectURL(
          result.audioUrl
        );
      }
    }
  );
}

</script>

</body>
</html>
