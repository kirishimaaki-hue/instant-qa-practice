<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Favorites 練習</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f7f7f7;
  color: #111;
}

.app {
  max-width: 900px;
  margin: 0 auto;
  min-height: 100vh;
  background: white;
  padding: 36px 42px 60px;
}

h1 {
  font-size: 34px;
  margin-bottom: 32px;
}

.question {
  font-size: 30px;
  font-weight: bold;
  margin-bottom: 16px;
}

.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin: 20px 0;
}

button {
  font-family: inherit;
  cursor: pointer;
}

.action-button {
  font-size: 17px;
  padding: 11px 18px;
  border: 1px solid #888;
  background: white;
  border-radius: 6px;
}

.main-button {
  font-size: 18px;
  padding: 13px 20px;
  border: none;
  background: #111;
  color: white;
  border-radius: 7px;
}

button:disabled {
  opacity: 0.4;
  cursor: default;
}

.step-area {
  margin: 32px 0 22px;
}

.step-buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.step-button {
  font-size: 17px;
  padding: 11px 16px;
  border: 1px solid #bbb;
  background: white;
  border-radius: 7px;
}

.step-button.active {
  background: #111;
  color: white;
}

.hint-box {
  min-height: 110px;
  padding: 22px;
  margin-top: 18px;
  background: #f5f5f5;
  border-radius: 9px;
}

.full-answer {
  font-size: 21px;
  line-height: 1.8;
}

.hints {
  font-size: 21px;
  line-height: 1.8;
  font-weight: bold;
}

.no-hint {
  font-size: 20px;
  color: #777;
  text-align: center;
  padding-top: 20px;
}

#status {
  min-height: 40px;
  font-size: 24px;
  font-weight: bold;
  margin: 16px 0 8px;
}

.sentence-card {
  background: #f5f5f5;
  padding: 18px 20px;
  margin-bottom: 14px;
  border-radius: 9px;
}

.sentence-text {
  font-size: 20px;
  line-height: 1.6;
  margin-bottom: 10px;
}

.record-area {
  margin-top: 35px;
  padding-top: 25px;
  border-top: 1px solid #ddd;
}

.record-toggle {
  font-size: 18px;
  margin-bottom: 18px;
}

.record-toggle label {
  cursor: pointer;
}

#recordingStatus {
  min-height: 28px;
  font-size: 19px;
  font-weight: bold;
}

.recording {
  color: #c40000;
}

.transcript-title {
  font-weight: bold;
  margin-top: 16px;
  margin-bottom: 7px;
}

#transcript {
  min-height: 90px;
  background: #f5f5f5;
  padding: 15px;
  border-radius: 8px;
  font-size: 19px;
  line-height: 1.6;
}

#loading {
  color: #777;
  min-height: 22px;
}

@media (max-width: 600px) {
  .app {
    padding: 22px 16px 45px;
  }

  h1 {
    font-size: 28px;
  }

  .question {
    font-size: 25px;
  }

  .full-answer,
  .hints {
    font-size: 19px;
  }
}
</style>
</head>

<body>

<div class="app">

  <h1>Favorites 練習</h1>

  <div class="question">
    Q1. What's your favorite season?
  </div>

  <div class="controls">
    <button id="questionAudioButton" class="action-button">
      ▶ 質問を聞く
    </button>
  </div>

  <div class="step-area">

    <div class="step-buttons">
      <button class="step-button active" data-step="1">
        Step 1
      </button>

      <button class="step-button" data-step="2">
        Step 2
      </button>

      <button class="step-button" data-step="3">
        Step 3
      </button>

      <button class="step-button" data-step="4">
        Step 4
      </button>
    </div>

    <div id="hintBox" class="hint-box"></div>

  </div>

  <div class="controls">
    <button id="autoButton" class="main-button" disabled>
      ▶ 英文をまとめてリッスン＆リピート
    </button>

    <button id="pauseButton" class="action-button" disabled>
      一時停止
    </button>
  </div>

  <div id="status"></div>

  <div id="loading">
    音声を読み込んでいます…
  </div>

  <div id="sentences"></div>


  <div class="record-area">

    <div class="record-toggle">
      <label>
        <input type="checkbox" id="recordToggle">
        自分の声を録音・文字起こしする
      </label>
    </div>

    <div id="recordingStatus"></div>

    <div class="transcript-title">
      リアルタイム文字起こし
    </div>

    <div id="transcript">
      録音をONにすると、ここに発話が表示されます。
    </div>

  </div>

</div>


<script>

/* =========================
   Q1データ
========================= */

const QUESTION = {
  questionAudio: "fav01.mp3",
  answerAudio: "yasmin_fav01.mp3",

  sentences: [
    "My favorite season is summer.",
    "I hate cold weather.",
    "Summers here are humid and tough, but I still prefer summer."
  ],

  step2:
    "favorite season / summer / hate cold weather / humid / tough / still prefer summer",

  step3:
    "summer / cold / humid / prefer summer"
};


/* =========================
   音声分割設定
========================= */

const MIN_SILENCE_SECONDS = 0.25;
const SILENCE_THRESHOLD = 0.02;


/* =========================
   音声状態
========================= */

let segments = [];

let player =
  new Audio(
    QUESTION.answerAudio
  );

let questionPlayer =
  new Audio(
    QUESTION.questionAudio
  );

let currentSegmentIndex = 0;

let segmentEndTime = null;

let animationFrameId = null;

let autoRunning = false;

let isPaused = false;

let inRepeatPause = false;

let repeatTimer = null;

let repeatDeadline = null;

let remainingRepeatMs = 0;


/* =========================
   録音・文字起こし
========================= */

let mediaStream = null;
let mediaRecorder = null;
let audioChunks = [];

let recognition = null;

let recordingEnabled = false;
let recognitionRunning = false;

let finalTranscript = "";
let interimTranscript = "";

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


/* =========================
   DOM
========================= */

const questionAudioButton =
  document.getElementById(
    "questionAudioButton"
  );

const autoButton =
  document.getElementById(
    "autoButton"
  );

const pauseButton =
  document.getElementById(
    "pauseButton"
  );

const statusDisplay =
  document.getElementById(
    "status"
  );

const loadingDisplay =
  document.getElementById(
    "loading"
  );

const sentencesDisplay =
  document.getElementById(
    "sentences"
  );

const hintBox =
  document.getElementById(
    "hintBox"
  );

const stepButtons =
  document.querySelectorAll(
    ".step-button"
  );

const recordToggle =
  document.getElementById(
    "recordToggle"
  );

const recordingStatus =
  document.getElementById(
    "recordingStatus"
  );

const transcriptDisplay =
  document.getElementById(
    "transcript"
  );


/* =========================
   初期表示
========================= */

renderStep(1);
renderSentences();

prepareAudioSegments();


/* =========================
   Step切替
========================= */

stepButtons.forEach(
  button => {

    button.addEventListener(
      "click",
      () => {

        const step =
          Number(
            button.dataset.step
          );

        renderStep(step);


        stepButtons.forEach(
          btn => {

            btn.classList.toggle(
              "active",
              btn === button
            );
          }
        );
      }
    );
  }
);


function renderStep(step) {

  hintBox.innerHTML = "";


  if (step === 1) {

    const div =
      document.createElement("div");

    div.className =
      "full-answer";

    div.innerHTML =
      QUESTION.sentences
        .map(
          sentence =>
            sentence
        )
        .join("<br>");

    hintBox.appendChild(div);

    return;
  }


  if (step === 2) {

    const div =
      document.createElement("div");

    div.className =
      "hints";

    div.textContent =
      QUESTION.step2;

    hintBox.appendChild(div);

    return;
  }


  if (step === 3) {

    const div =
      document.createElement("div");

    div.className =
      "hints";

    div.textContent =
      QUESTION.step3;

    hintBox.appendChild(div);

    return;
  }


  if (step === 4) {

    const div =
      document.createElement("div");

    div.className =
      "no-hint";

    div.textContent =
      "ヒントなし";

    hintBox.appendChild(div);
  }
}


/* =========================
   センテンス表示
========================= */

function renderSentences() {

  sentencesDisplay.innerHTML = "";


  QUESTION.sentences.forEach(
    (sentence, index) => {

      const card =
        document.createElement("div");

      card.className =
        "sentence-card";


      const text =
        document.createElement("div");

      text.className =
        "sentence-text";

      text.textContent =
        (index + 1) +
        ". " +
        sentence;


      const button =
        document.createElement("button");

      button.className =
        "action-button";

      button.textContent =
        "▶ この文を聞く";

      button.disabled = true;

      button.dataset.index =
        index;


      button.addEventListener(
        "click",
        () => {

          playIndividualSentence(
            index
          );
        }
      );


      card.appendChild(text);
      card.appendChild(button);

      sentencesDisplay.appendChild(
        card
      );
    }
  );
}


/* =========================
   音声分割
========================= */

async function prepareAudioSegments() {

  try {

    segments =
      await detectSentenceSegments(
        QUESTION.answerAudio,
        QUESTION.sentences.length
      );


    loadingDisplay.textContent = "";

    autoButton.disabled = false;


    document
      .querySelectorAll(
        ".sentence-card button"
      )
      .forEach(
        button => {

          button.disabled = false;
        }
      );


  } catch (error) {

    console.error(error);

    loadingDisplay.textContent =
      "音声を正しく分割できませんでした。";
  }
}


/* =========================
   質問音声
========================= */

questionAudioButton.addEventListener(
  "click",
  () => {

    stopAnswerPlayback();

    questionPlayer.currentTime = 0;

    questionPlayer.play();
  }
);


/* =========================
   1文だけ再生
========================= */

function playIndividualSentence(
  index
) {

  stopAnswerPlayback();

  statusDisplay.textContent =
    "Sentence " +
    (index + 1);

  pauseButton.disabled = false;

  pauseButton.textContent =
    "一時停止";

  isPaused = false;

  playSegment(
    index,
    () => {

      pauseButton.disabled = true;

      statusDisplay.textContent = "";
    }
  );
}


/* =========================
   まとめて練習
========================= */

autoButton.addEventListener(
  "click",
  () => {

    stopAnswerPlayback();

    autoRunning = true;

    currentSegmentIndex = 0;

    isPaused = false;

    inRepeatPause = false;

    pauseButton.disabled = false;

    pauseButton.textContent =
      "一時停止";

    playAutoSentence();
  }
);


function playAutoSentence() {

  if (
    !autoRunning ||
    currentSegmentIndex >=
      segments.length
  ) {

    finishAutoPractice();

    return;
  }


  statusDisplay.textContent =
    "Sentence " +
    (currentSegmentIndex + 1);


  playSegment(
    currentSegmentIndex,
    () => {

      if (!autoRunning) return;

      startRepeatPause();
    }
  );
}


/* =========================
   Repeat
========================= */

function startRepeatPause() {

  inRepeatPause = true;

  statusDisplay.textContent =
    "Repeat";


  const sentence =
    QUESTION.sentences[
      currentSegmentIndex
    ];


  const wordCount =
    sentence
      .trim()
      .split(/\s+/)
      .length;


  remainingRepeatMs =
    calculateRepeatPause(
      wordCount
    );


  startRepeatTimer(
    remainingRepeatMs
  );
}


function startRepeatTimer(ms) {

  clearTimeout(
    repeatTimer
  );


  repeatDeadline =
    Date.now() + ms;


  repeatTimer =
    setTimeout(
      () => {

        inRepeatPause = false;

        remainingRepeatMs = 0;


        if (
          !autoRunning ||
          isPaused
        ) {

          return;
        }


        currentSegmentIndex++;

        playAutoSentence();

      },
      ms
    );
}


function calculateRepeatPause(
  wordCount
) {

  if (wordCount <= 8) {
    return 3000;
  }

  if (wordCount <= 14) {
    return 4000;
  }

  if (wordCount <= 20) {
    return 5000;
  }

  return 6000;
}


/* =========================
   区間再生
========================= */

function playSegment(
  index,
  callback
) {

  if (!segments[index]) return;


  cancelAnimationFrame(
    animationFrameId
  );


  const segment =
    segments[index];


  currentSegmentIndex =
    index;

  segmentEndTime =
    segment.end;


  player.currentTime =
    segment.start;


  player.play();


  monitorSegmentEnd(
    callback
  );
}


function monitorSegmentEnd(
  callback
) {

  cancelAnimationFrame(
    animationFrameId
  );


  const check =
    () => {

      if (
        player.currentTime >=
          segmentEndTime - 0.03
      ) {

        player.pause();


        if (callback) {
          callback();
        }

        return;
      }


      if (
        !player.paused &&
        !isPaused
      ) {

        animationFrameId =
          requestAnimationFrame(
            check
          );
      }
    };


  player._segmentCallback =
    callback;


  animationFrameId =
    requestAnimationFrame(
      check
    );
}


/* =========================
   一時停止 / 再開
========================= */

pauseButton.addEventListener(
  "click",
  () => {

    if (!isPaused) {

      pausePractice();

    } else {

      resumePractice();
    }
  }
);


function pausePractice() {

  isPaused = true;

  pauseButton.textContent =
    "再開";


  if (!player.paused) {

    player.pause();

    cancelAnimationFrame(
      animationFrameId
    );

    return;
  }


  if (inRepeatPause) {

    clearTimeout(
      repeatTimer
    );


    remainingRepeatMs =
      Math.max(
        0,
        repeatDeadline -
        Date.now()
      );
  }
}


function resumePractice() {

  isPaused = false;

  pauseButton.textContent =
    "一時停止";


  if (inRepeatPause) {

    startRepeatTimer(
      remainingRepeatMs
    );

    return;
  }


  if (
    segmentEndTime !== null &&
    player.currentTime <
      segmentEndTime
  ) {

    player.play();


    monitorSegmentEnd(
      player._segmentCallback
    );
  }
}


function finishAutoPractice() {

  autoRunning = false;

  isPaused = false;

  inRepeatPause = false;

  statusDisplay.textContent = "";

  pauseButton.disabled = true;

  pauseButton.textContent =
    "一時停止";
}


function stopAnswerPlayback() {

  clearTimeout(
    repeatTimer
  );

  cancelAnimationFrame(
    animationFrameId
  );

  player.pause();

  autoRunning = false;

  isPaused = false;

  inRepeatPause = false;

  segmentEndTime = null;

  statusDisplay.textContent = "";

  pauseButton.disabled = true;

  pauseButton.textContent =
    "一時停止";
}


/* =========================
   録音ON/OFF
========================= */

recordToggle.addEventListener(
  "change",
  async () => {

    recordingEnabled =
      recordToggle.checked;


    if (recordingEnabled) {

      await startUserRecording();

    } else {

      stopUserRecording();
    }
  }
);


/* =========================
   録音開始
========================= */

async function startUserRecording() {

  if (!SpeechRecognition) {

    recordToggle.checked = false;

    recordingEnabled = false;

    recordingStatus.textContent =
      "このブラウザでは文字起こしを利用できません。";

    return;
  }


  try {

    mediaStream =
      await navigator.mediaDevices
        .getUserMedia({
          audio: true
        });


    mediaRecorder =
      new MediaRecorder(
        mediaStream
      );


    audioChunks = [];


    mediaRecorder.ondataavailable =
      event => {

        if (
          event.data &&
          event.data.size > 0
        ) {

          audioChunks.push(
            event.data
          );
        }
      };


    mediaRecorder.start();


    startRecognition();


    recordingStatus.innerHTML =
      '<span class="recording">● Recording</span>';


    transcriptDisplay.textContent = "";


  } catch (error) {

    recordToggle.checked = false;

    recordingEnabled = false;

    recordingStatus.textContent =
      "マイクを使用できません。";
  }
}


/* =========================
   文字起こし
========================= */

function startRecognition() {

  finalTranscript = "";
  interimTranscript = "";


  recognition =
    new SpeechRecognition();


  recognition.lang =
    "en-US";

  recognition.continuous =
    true;

  recognition.interimResults =
    true;


  recognition.onresult =
    function(event) {

      interimTranscript = "";


      for (
        let i =
          event.resultIndex;
        i <
          event.results.length;
        i++
      ) {

        const text =
          event.results[i][0]
            .transcript;


        if (
          event.results[i].isFinal
        ) {

          finalTranscript +=
            text + " ";

        } else {

          interimTranscript +=
            text;
        }
      }


      transcriptDisplay.textContent =
        (
          finalTranscript +
          interimTranscript
        ).trim();
    };


  recognition.onerror =
    function(event) {

      console.log(
        "SpeechRecognition:",
        event.error
      );
    };


  recognition.onend =
    function() {

      recognitionRunning =
        false;


      /*
      ONのままなら
      Chrome側で自動終了した場合に再開
      */

      if (
        recordingEnabled
      ) {

        try {

          recognition.start();

          recognitionRunning = true;

        } catch (error) {}
      }
    };


  try {

    recognition.start();

    recognitionRunning =
      true;

  } catch (error) {}
}


/* =========================
   録音停止
========================= */

function stopUserRecording() {

  recordingEnabled = false;


  if (recognition) {

    recognition.onend = null;


    try {

      recognition.stop();

    } catch (error) {}
  }


  recognitionRunning = false;


  if (
    mediaRecorder &&
    mediaRecorder.state !==
      "inactive"
  ) {

    try {

      mediaRecorder.stop();

    } catch (error) {}
  }


  if (mediaStream) {

    mediaStream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );

    mediaStream = null;
  }


  recordingStatus.textContent = "";
}


/* =========================
   MP3自動分割
========================= */

async function detectSentenceSegments(
  file,
  expectedCount
) {

  const response =
    await fetch(file);


  const arrayBuffer =
    await response.arrayBuffer();


  const audioContext =
    new AudioContext();


  const audioBuffer =
    await audioContext.decodeAudioData(
      arrayBuffer
    );


  const length =
    audioBuffer.length;


  const mono =
    new Float32Array(
      length
    );


  for (
    let channel = 0;
    channel <
      audioBuffer.numberOfChannels;
    channel++
  ) {

    const data =
      audioBuffer.getChannelData(
        channel
      );


    for (
      let i = 0;
      i < length;
      i++
    ) {

      mono[i] +=
        data[i] /
        audioBuffer.numberOfChannels;
    }
  }


  const sampleRate =
    audioBuffer.sampleRate;


  const frameSeconds =
    0.02;


  const frameSize =
    Math.floor(
      sampleRate *
      frameSeconds
    );


  const frames = [];


  for (
    let start = 0;
    start < mono.length;
    start += frameSize
  ) {

    const end =
      Math.min(
        start + frameSize,
        mono.length
      );


    let sum = 0;


    for (
      let i = start;
      i < end;
      i++
    ) {

      sum +=
        mono[i] *
        mono[i];
    }


    const rms =
      Math.sqrt(
        sum /
        (end - start)
      );


    frames.push({
      time:
        start /
        sampleRate,

      rms: rms
    });
  }


  const silenceRanges = [];

  let silenceStart = null;


  for (
    let i = 0;
    i < frames.length;
    i++
  ) {

    const silent =
      frames[i].rms <
      SILENCE_THRESHOLD;


    if (
      silent &&
      silenceStart === null
    ) {

      silenceStart =
        frames[i].time;
    }


    if (
      !silent &&
      silenceStart !== null
    ) {

      const silenceEnd =
        frames[i].time;


      if (
        silenceEnd -
        silenceStart >=
        MIN_SILENCE_SECONDS
      ) {

        silenceRanges.push({
          start:
            silenceStart,

          end:
            silenceEnd,

          duration:
            silenceEnd -
            silenceStart
        });
      }


      silenceStart = null;
    }
  }


  const internalSilences =
    silenceRanges.filter(
      range =>
        range.start > 0.3
        &&
        range.end <
          audioBuffer.duration -
          0.3
    );


  const requiredBreaks =
    expectedCount - 1;


  const selected =
    internalSilences
      .sort(
        (a, b) =>
          b.duration -
          a.duration
      )
      .slice(
        0,
        requiredBreaks
      )
      .sort(
        (a, b) =>
          a.start -
          b.start
      );


  if (
    selected.length !==
    requiredBreaks
  ) {

    await audioContext.close();

    throw new Error(
      "Sentence split failed"
    );
  }


  let actualStart = 0;

  let actualEnd =
    audioBuffer.duration;


  for (
    let i = 0;
    i < frames.length;
    i++
  ) {

    if (
      frames[i].rms >=
      SILENCE_THRESHOLD
    ) {

      actualStart =
        Math.max(
          0,
          frames[i].time -
          0.05
        );

      break;
    }
  }


  for (
    let i =
      frames.length - 1;
    i >= 0;
    i--
  ) {

    if (
      frames[i].rms >=
      SILENCE_THRESHOLD
    ) {

      actualEnd =
        Math.min(
          audioBuffer.duration,
          frames[i].time +
          frameSeconds +
          0.08
        );

      break;
    }
  }


  const result = [];

  let sentenceStart =
    actualStart;


  selected.forEach(
    gap => {

      result.push({
        start:
          sentenceStart,

        end:
          gap.start +
          0.05
      });


      sentenceStart =
        gap.end -
        0.05;
    }
  );


  result.push({
    start:
      sentenceStart,

    end:
      actualEnd
  });


  await audioContext.close();


  return result;
}

</script>
