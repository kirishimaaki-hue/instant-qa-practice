<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Favorites 練習</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f6f6f6;
  color: #111;
}

.app {
  max-width: 900px;
  min-height: 100vh;
  margin: 0 auto;
  padding: 35px 42px 70px;
  background: white;
}

h1 {
  margin: 0 0 30px;
  font-size: 32px;
}

.question {
  margin-bottom: 15px;
  font-size: 29px;
  font-weight: bold;
  line-height: 1.5;
}

button {
  font-family: inherit;
  cursor: pointer;
}

.button {
  padding: 10px 16px;
  margin: 4px 5px 4px 0;
  font-size: 16px;
  border: 1px solid #999;
  border-radius: 6px;
  background: white;
}

.button.primary {
  background: #111;
  color: white;
  border-color: #111;
}

.button.record {
  background: #b00020;
  color: white;
  border-color: #b00020;
}

.button:disabled {
  opacity: 0.4;
  cursor: default;
}

.record-controls {
  margin: 8px 0 12px;
}

#recordStatus {
  margin-left: 8px;
  font-weight: bold;
  color: #b00020;
}

#recordPlayback {
  margin-top: 10px;
}

#recordPlayback audio {
  width: 100%;
  max-width: 520px;
}

.transcript-section {
  margin: 20px 0 32px;
}

.transcript-title {
  margin-bottom: 7px;
  font-size: 19px;
  font-weight: bold;
}

#transcript {
  min-height: 85px;
  padding: 15px;
  background: #f3f3f3;
  border-radius: 8px;
  font-size: 19px;
  line-height: 1.6;
}

#judgment {
  min-height: 32px;
  margin-top: 9px;
  font-size: 21px;
  font-weight: bold;
}

.pass { color: #16803a; }
.retry { color: #c00000; }

.step-title {
  margin: 30px 0 13px;
  font-size: 21px;
  font-weight: bold;
}

.step-tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-bottom: 20px;
}

.step-button {
  padding: 11px 14px;
  font-size: 15px;
  border: 1px solid #bbb;
  border-radius: 7px;
  background: white;
}

.step-button.active {
  background: #111;
  color: white;
  border-color: #111;
}

#stepDescription {
  margin-bottom: 8px;
  font-size: 18px;
  font-weight: bold;
}

#repeatInstruction {
  min-height: 24px;
  margin-bottom: 12px;
  font-size: 16px;
  color: #555;
}

#hintBox {
  min-height: 75px;
  margin-bottom: 20px;
  padding: 20px;
  background: #f3f3f3;
  border-radius: 9px;
  font-size: 20px;
  line-height: 1.8;
}

.no-hint {
  text-align: center;
  color: #777;
}

.sentence-card {
  margin-bottom: 14px;
  padding: 18px 20px;
  background: #f3f3f3;
  border-radius: 9px;
}

.sentence-text {
  margin-bottom: 9px;
  font-size: 20px;
  line-height: 1.6;
}

#practiceControls {
  margin-top: 15px;
}

#status {
  min-height: 38px;
  margin: 16px 0 4px;
  font-size: 24px;
  font-weight: bold;
}

#loading {
  min-height: 23px;
  color: #777;
}

@media (max-width: 600px) {
  .app { padding: 22px 16px 50px; }
  h1 { font-size: 27px; }
  .question { font-size: 24px; }
  .step-button { font-size: 14px; }
  #transcript, #hintBox { font-size: 18px; }
}
</style>
</head>

<body>

<div class="app">

  <h1>Favorites 練習</h1>

  <div class="question">
    Q1. What's your favorite season?
  </div>

  <button id="questionAudioButton" class="button">
    ▶ 質問を聞く
  </button>

  <div class="record-controls">
    <button id="recordButton" class="button record">
      ● 録音
    </button>

    <button id="stopRecordButton" class="button" disabled>
      ■ 停止
    </button>

    <span id="recordStatus"></span>
    <div id="recordPlayback"></div>
  </div>

  <div class="transcript-section">

    <div class="transcript-title">
      文字起こし
    </div>

    <div id="transcript">
      リピートした英文がここに表示されます。
    </div>

    <div id="judgment"></div>

  </div>

  <div class="step-title">
    練習ステップ
  </div>

  <div class="step-tabs">
    <button class="step-button active" data-step="1">Step 1</button>
    <button class="step-button" data-step="2">Step 2</button>
    <button class="step-button" data-step="3">Step 3</button>
    <button class="step-button" data-step="4">Step 4</button>
    <button class="step-button" data-step="5">Step 5</button>
    <button class="step-button" data-step="6">Step 6</button>
    <button class="step-button" data-step="7">Step 7</button>
  </div>

  <div id="stepDescription"></div>
  <div id="repeatInstruction"></div>
  <div id="hintBox"></div>
  <div id="step1Area"></div>
  <div id="practiceControls"></div>
  <div id="status"></div>
  <div id="loading">音声を読み込んでいます…</div>

</div>

<script>

const QUESTION = {
  questionAudio: "fav01.mp3",
  answerAudio: "yasmin_fav01.mp3",

  sentences: [
    "My favorite season is summer.",
    "I hate cold weather.",
    "Summers here are humid and tough, but I still prefer summer."
  ],

  hintMany:
    "favorite season / summer / hate cold weather / humid / tough / still prefer summer",

  hintFew:
    "summer / cold / humid / prefer summer"
};

const PASS_SCORE = 90;
const FINAL_SENTENCE_GRACE_MS = 2000;

const MIN_SILENCE_SECONDS = 0.25;
const SILENCE_THRESHOLD = 0.02;


/* DOM */

const questionAudioButton =
  document.getElementById("questionAudioButton");

const recordButton =
  document.getElementById("recordButton");

const stopRecordButton =
  document.getElementById("stopRecordButton");

const recordStatus =
  document.getElementById("recordStatus");

const recordPlayback =
  document.getElementById("recordPlayback");

const transcriptDisplay =
  document.getElementById("transcript");

const judgmentDisplay =
  document.getElementById("judgment");

const stepDescription =
  document.getElementById("stepDescription");

const repeatInstruction =
  document.getElementById("repeatInstruction");

const hintBox =
  document.getElementById("hintBox");

const step1Area =
  document.getElementById("step1Area");

const practiceControls =
  document.getElementById("practiceControls");

const statusDisplay =
  document.getElementById("status");

const loadingDisplay =
  document.getElementById("loading");

const stepButtons =
  document.querySelectorAll(".step-button");


/* 基本 */

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

const questionPlayer =
  new Audio(QUESTION.questionAudio);

const answerPlayer =
  new Audio(QUESTION.answerAudio);

let segments = [];

let currentStep = 1;
let currentSegment = 0;

let practiceRunning = false;

let segmentEndTime = 0;
let animationId = null;
let repeatTimer = null;
let graceTimer = null;

let isPaused = false;

let recognition = null;
let recognitionText = "";


/* 録音 */

let recordStream = null;
let mediaRecorder = null;
let recordedChunks = [];
let recordedUrl = null;


/* 初期化 */

renderStep();
prepareSegments();


/* 質問音声 */

questionAudioButton.onclick = () => {
  stopAllPractice();

  questionPlayer.currentTime = 0;
  questionPlayer.play();
};


/* Step切替 */

stepButtons.forEach(button => {

  button.onclick = () => {

    stopAllPractice();

    currentStep =
      Number(button.dataset.step);

    stepButtons.forEach(btn => {
      btn.classList.toggle(
        "active",
        btn === button
      );
    });

    resetTranscript();
    renderStep();
  };
});


/* Step表示 */

function renderStep() {

  step1Area.innerHTML = "";
  practiceControls.innerHTML = "";
  hintBox.innerHTML = "";
  repeatInstruction.textContent = "";
  statusDisplay.textContent = "";

  if (currentStep === 1) {

    stepDescription.textContent =
      "1センテンスずつリピート";

    hintBox.style.display = "none";

    QUESTION.sentences.forEach(
      (sentence, index) => {

        const card =
          document.createElement("div");

        card.className = "sentence-card";


        const text =
          document.createElement("div");

        text.className = "sentence-text";
        text.textContent =
          `${index + 1}. ${sentence}`;


        const listen =
          document.createElement("button");

        listen.className = "button";

        listen.textContent =
          "▶ リッスン＆リピート";

        listen.disabled =
          segments.length === 0;

        listen.onclick =
          () => playStep1(index);


        const speak =
          document.createElement("button");

        speak.className = "button";

        speak.textContent =
          "🎤 発話のみ練習";

        speak.onclick =
          () => startStep1SpeakOnly(index);


        card.appendChild(text);
        card.appendChild(listen);
        card.appendChild(speak);

        step1Area.appendChild(card);
      }
    );

    return;
  }

  hintBox.style.display = "block";


  if (currentStep === 2) {

    stepDescription.textContent =
      "全文を見ながら、1センテンスずつリッスン＆リピート";

    hintBox.innerHTML =
      QUESTION.sentences.join("<br>");

    createPracticeButtons(
      "▶ リッスン＆リピート"
    );

    return;
  }


  if (currentStep === 3) {

    stepDescription.textContent =
      "ヒントを見ながら、1センテンスずつリッスン＆リピート";

    hintBox.textContent =
      QUESTION.hintFew;

    createPracticeButtons(
      "▶ リッスン＆リピート"
    );

    return;
  }


  if (currentStep === 4) {

    stepDescription.textContent =
      "ヒントなしで、1センテンスずつリッスン＆リピート";

    hintBox.innerHTML =
      '<div class="no-hint">ヒントなし</div>';

    createPracticeButtons(
      "▶ リッスン＆リピート"
    );

    return;
  }


  if (currentStep === 5) {

    stepDescription.textContent =
      "全文を聞いてから、ヒントを見ながらまとめてリピート";

    repeatInstruction.textContent =
      "「Repeat」が表示されてから話してください。";

    hintBox.textContent =
      QUESTION.hintMany;

    createPracticeButtons(
      "▶ 全文を聞く"
    );

    return;
  }


  if (currentStep === 6) {

    stepDescription.textContent =
      "全文を聞いてから、ヒントを見ながらまとめてリピート";

    repeatInstruction.textContent =
      "「Repeat」が表示されてから話してください。";

    hintBox.textContent =
      QUESTION.hintFew;

    createPracticeButtons(
      "▶ 全文を聞く"
    );

    return;
  }


  if (currentStep === 7) {

    stepDescription.textContent =
      "全文を聞いてから、ヒントなしでまとめてリピート";

    repeatInstruction.textContent =
      "「Repeat」が表示されてから話してください。";

    hintBox.innerHTML =
      '<div class="no-hint">ヒントなし</div>';

    createPracticeButtons(
      "▶ 全文を聞く"
    );
  }
}


/* Step2〜7 ボタン */

function createPracticeButtons(label) {

  const listen =
    document.createElement("button");

  listen.className =
    "button primary";

  listen.textContent = label;

  listen.disabled =
    segments.length === 0;

  listen.onclick = () => {

    if (
      currentStep >= 2 &&
      currentStep <= 4
    ) {
      startStep2to4();
    } else {
      startStep5to7();
    }
  };

  practiceControls.appendChild(listen);


  const speak =
    document.createElement("button");

  speak.className = "button";

  speak.textContent =
    "🎤 発話のみ練習";

  speak.onclick =
    startSpeakOnlyWhole;

  practiceControls.appendChild(speak);


  const pause =
    document.createElement("button");

  pause.id =
    "practicePauseButton";

  pause.className = "button";

  pause.textContent =
    "一時停止";

  pause.disabled = true;

  pause.onclick =
    () => togglePause(pause);

  practiceControls.appendChild(pause);
}


/* =====================================================
   Step1
===================================================== */

function playStep1(index) {

  stopAllPractice();
  resetTranscript();

  statusDisplay.textContent =
    `Sentence ${index + 1}`;

  playSegment(
    index,
    () => {

      statusDisplay.textContent =
        "Repeat";

      startSimpleRecognition(
        QUESTION.sentences[index]
      );
    }
  );
}


function startStep1SpeakOnly(index) {

  stopAllPractice();
  resetTranscript();

  statusDisplay.textContent =
    "Speak";

  startSimpleRecognition(
    QUESTION.sentences[index]
  );
}


/* =====================================================
   Step1用Recognition
===================================================== */

function startSimpleRecognition(target) {

  stopRecognition();

  if (!SpeechRecognition) {

    transcriptDisplay.textContent =
      "このブラウザでは文字起こしを利用できません。";

    return;
  }

  const r =
    new SpeechRecognition();

  recognition = r;
  recognitionText = "";

  r.lang = "en-US";
  r.continuous = true;
  r.interimResults = true;


  r.onresult = event => {

    recognitionText =
      buildRecognitionText(
        event.results
      );

    transcriptDisplay.textContent =
      recognitionText;

    if (recognitionText) {

      showScore(
        calculateSimilarity(
          recognitionText,
          target
        )
      );
    }
  };


  r.onend = () => {

    if (recognition === r) {
      recognition = null;
    }

    statusDisplay.textContent = "";
  };


  try {
    r.start();
  } catch (e) {}
}


/* =====================================================
   Step2〜4
   この部分は変更しない
===================================================== */

function startStep2to4() {

  stopAllPractice();
  resetTranscript();

  practiceRunning = true;
  currentSegment = 0;

  startOneContinuousRecognition();

  setTimeout(() => {

    if (practiceRunning) {
      playNextStep2to4();
    }

  }, 250);
}


function startOneContinuousRecognition() {

  stopRecognition();

  if (!SpeechRecognition) {

    transcriptDisplay.textContent =
      "このブラウザでは文字起こしを利用できません。";

    return;
  }

  const r =
    new SpeechRecognition();

  recognition = r;
  recognitionText = "";

  r.lang = "en-US";
  r.continuous = true;
  r.interimResults = true;


  r.onresult = event => {

    recognitionText =
      buildRecognitionText(
        event.results
      );

    transcriptDisplay.textContent =
      recognitionText;
  };


  r.onend = () => {

    if (recognition === r) {
      recognition = null;
    }
  };


  try {
    r.start();
  } catch (e) {}
}


function playNextStep2to4() {

  if (
    !practiceRunning ||
    currentSegment >=
      QUESTION.sentences.length
  ) {

    finishStep2to4();

    return;
  }

  statusDisplay.textContent =
    `Sentence ${currentSegment + 1}`;

  playSegmentCore(
    currentSegment,
    () => {

      statusDisplay.textContent =
        "Repeat";

      const sentence =
        QUESTION.sentences[
          currentSegment
        ];

      const repeatMs =
        calculateRepeatPause(
          countWords(sentence)
        );

      repeatTimer =
        setTimeout(() => {

          const isLast =
            currentSegment ===
            QUESTION.sentences.length - 1;

          if (isLast) {

            graceTimer =
              setTimeout(() => {

                currentSegment++;

                playNextStep2to4();

              }, FINAL_SENTENCE_GRACE_MS);

          } else {

            currentSegment++;

            playNextStep2to4();
          }

        }, repeatMs);
    }
  );
}


function finishStep2to4() {

  practiceRunning = false;

  statusDisplay.textContent = "";

  const target =
    QUESTION.sentences.join(" ");

  stopRecognitionGracefully(() => {

    showScore(
      calculateBestSimilarity(
        recognitionText,
        target
      )
    );
  });
}


/* =====================================================
   Step5〜7

   お手本終了
   ↓
   Recognition開始
   ↓
   Chromeのonstart
   ↓
   Repeat表示
===================================================== */

function startStep5to7() {

  stopAllPractice();
  resetTranscript();

  practiceRunning = true;

  statusDisplay.textContent =
    "Listen";

  answerPlayer.currentTime = 0;

  answerPlayer.onended = () => {

    answerPlayer.onended = null;

    if (!practiceRunning) {
      return;
    }

    startWholeRecognitionWhenReady(
      QUESTION.sentences.join(" ")
    );
  };

  answerPlayer.play();
}


/* Step5〜7専用
   実際にRecognitionが開始してからRepeat表示 */

function startWholeRecognitionWhenReady(target) {

  stopRecognition();

  if (!SpeechRecognition) {

    transcriptDisplay.textContent =
      "このブラウザでは文字起こしを利用できません。";

    return;
  }

  const r =
    new SpeechRecognition();

  recognition = r;
  recognitionText = "";

  r.lang = "en-US";
  r.continuous = true;
  r.interimResults = true;


  r.onstart = () => {

    if (
      recognition === r &&
      practiceRunning
    ) {

      statusDisplay.textContent =
        "Repeat";
    }
  };


  r.onresult = event => {

    recognitionText =
      buildRecognitionText(
        event.results
      );

    transcriptDisplay.textContent =
      recognitionText;

    if (recognitionText) {

      showScore(
        calculateSimilarity(
          recognitionText,
          target
        )
      );
    }
  };


  r.onend = () => {

    if (recognition === r) {
      recognition = null;
    }

    statusDisplay.textContent = "";
  };


  try {
    r.start();
  } catch (e) {}
}


/* 発話のみ */

function startSpeakOnlyWhole() {

  stopAllPractice();
  resetTranscript();

  statusDisplay.textContent =
    "Speak";

  startSimpleRecognition(
    QUESTION.sentences.join(" ")
  );
}


/* =====================================================
   Recognition表示文字列
===================================================== */

function buildRecognitionText(results) {

  let text = "";

  for (
    let i = 0;
    i < results.length;
    i++
  ) {

    text +=
      results[i][0]
        .transcript +
      " ";
  }

  return text
    .replace(/\s+/g, " ")
    .trim();
}


/* =====================================================
   Recognition停止
===================================================== */

function stopRecognition() {

  if (!recognition) {
    return;
  }

  recognition.onend = null;

  try {
    recognition.stop();
  } catch (e) {}

  recognition = null;
}


function stopRecognitionGracefully(callback) {

  if (!recognition) {

    callback();
    return;
  }

  const r = recognition;

  r.onend = () => {

    if (recognition === r) {
      recognition = null;
    }

    callback();
  };

  try {

    r.stop();

  } catch (e) {

    recognition = null;
    callback();
  }
}


/* =====================================================
   センテンス音声
===================================================== */

function playSegment(index, callback) {

  stopRecognition();

  playSegmentCore(
    index,
    callback
  );
}


function playSegmentCore(
  index,
  callback
) {

  if (!segments[index]) {
    return;
  }

  cancelAnimationFrame(
    animationId
  );

  const segment =
    segments[index];

  answerPlayer.onended = null;

  answerPlayer.currentTime =
    segment.start;

  segmentEndTime =
    segment.end;

  answerPlayer._callback =
    callback;

  isPaused = false;

  answerPlayer.play();

  enablePauseButton();

  monitorSegment();
}


function monitorSegment() {

  cancelAnimationFrame(
    animationId
  );

  const monitor = () => {

    if (
      answerPlayer.currentTime >=
      segmentEndTime - 0.03
    ) {

      answerPlayer.pause();

      disablePauseButton();

      const callback =
        answerPlayer._callback;

      answerPlayer._callback = null;

      if (callback) {
        callback();
      }

      return;
    }

    if (
      !answerPlayer.paused &&
      !isPaused
    ) {

      animationId =
        requestAnimationFrame(
          monitor
        );
    }
  };

  animationId =
    requestAnimationFrame(
      monitor
    );
}


/* Repeat時間 */

function calculateRepeatPause(wordCount) {

  if (wordCount <= 8) {
    return 3000;
  }

  if (wordCount <= 14) {
    return 4000;
  }

  if (wordCount <= 20) {
    return 5000;
  }

  return 6000;
}


function countWords(text) {

  return String(text || "")
    .trim()
    .split(/\s+/)
    .filter(Boolean)
    .length;
}


/* =====================================================
   一時停止
===================================================== */

function enablePauseButton() {

  const button =
    document.getElementById(
      "practicePauseButton"
    );

  if (button) {
    button.disabled = false;
  }
}


function disablePauseButton() {

  const button =
    document.getElementById(
      "practicePauseButton"
    );

  if (button) {

    button.disabled = true;
    button.textContent =
      "一時停止";
  }

  isPaused = false;
}


function togglePause(button) {

  if (!isPaused) {

    isPaused = true;

    answerPlayer.pause();

    cancelAnimationFrame(
      animationId
    );

    button.textContent =
      "再開";

  } else {

    isPaused = false;

    button.textContent =
      "一時停止";

    answerPlayer.play();

    monitorSegment();
  }
}


/* =====================================================
   全停止
===================================================== */

function stopAllPractice() {

  practiceRunning = false;

  clearTimeout(repeatTimer);
  clearTimeout(graceTimer);

  cancelAnimationFrame(
    animationId
  );

  answerPlayer.pause();
  answerPlayer.onended = null;

  stopRecognition();

  disablePauseButton();

  statusDisplay.textContent = "";
}


/* =====================================================
   文字起こしリセット
===================================================== */

function resetTranscript() {

  recognitionText = "";

  transcriptDisplay.textContent =
    "リピートした英文がここに表示されます。";

  judgmentDisplay.textContent = "";
}


/* =====================================================
   判定
===================================================== */

function showScore(score) {

  if (score >= PASS_SCORE) {

    judgmentDisplay.innerHTML =
      '<span class="pass">PASS</span>　' +
      score +
      "%";

  } else {

    judgmentDisplay.innerHTML =
      '<span class="retry">RETRY</span>　' +
      score +
      "%";
  }
}


function calculateBestSimilarity(
  spoken,
  target
) {

  const spokenWords =
    normalize(spoken)
      .split(" ")
      .filter(Boolean);

  const targetWords =
    normalize(target)
      .split(" ")
      .filter(Boolean);

  if (
    spokenWords.length <=
    targetWords.length
  ) {

    return calculateSimilarity(
      spoken,
      target
    );
  }

  let best = 0;

  const windowSize =
    targetWords.length;

  for (
    let i = 0;
    i <=
      spokenWords.length -
      windowSize;
    i++
  ) {

    const sample =
      spokenWords
        .slice(
          i,
          i + windowSize
        )
        .join(" ");

    best =
      Math.max(
        best,
        calculateSimilarity(
          sample,
          target
        )
      );
  }

  return best;
}


function calculateSimilarity(
  spoken,
  target
) {

  const a =
    normalize(spoken)
      .split(" ")
      .filter(Boolean);

  const b =
    normalize(target)
      .split(" ")
      .filter(Boolean);

  if (!a.length || !b.length) {
    return 0;
  }

  const distance =
    levenshteinWords(a, b);

  const length =
    Math.max(
      a.length,
      b.length
    );

  return Math.round(
    Math.max(
      0,
      1 - distance / length
    ) * 100
  );
}


function normalize(text) {

  return String(text || "")
    .toLowerCase()
    .replace(/[’']/g, "")
    .replace(
      /[^a-z0-9\s]/g,
      " "
    )
    .replace(
      /\s+/g,
      " "
    )
    .trim();
}


function levenshteinWords(a, b) {

  const matrix =
    Array.from(
      { length: a.length + 1 },
      () =>
        new Array(
          b.length + 1
        ).fill(0)
    );

  for (
    let i = 0;
    i <= a.length;
    i++
  ) {
    matrix[i][0] = i;
  }

  for (
    let j = 0;
    j <= b.length;
    j++
  ) {
    matrix[0][j] = j;
  }

  for (
    let i = 1;
    i <= a.length;
    i++
  ) {

    for (
      let j = 1;
      j <= b.length;
      j++
    ) {

      const cost =
        a[i - 1] ===
        b[j - 1]
          ? 0
          : 1;

      matrix[i][j] =
        Math.min(
          matrix[i - 1][j] + 1,
          matrix[i][j - 1] + 1,
          matrix[i - 1][j - 1] +
          cost
        );
    }
  }

  return matrix[a.length][b.length];
}


/* =====================================================
   任意録音
===================================================== */

recordButton.onclick =
  async () => {

    if (
      mediaRecorder &&
      mediaRecorder.state ===
        "recording"
    ) {
      return;
    }

    try {

      recordStream =
        await navigator.mediaDevices
          .getUserMedia({
            audio: true
          });

      recordedChunks = [];

      mediaRecorder =
        new MediaRecorder(
          recordStream
        );

      mediaRecorder.ondataavailable =
        event => {

          if (
            event.data &&
            event.data.size > 0
          ) {

            recordedChunks.push(
              event.data
            );
          }
        };

      mediaRecorder.onstop = () => {

        const blob =
          new Blob(
            recordedChunks,
            {
              type:
                mediaRecorder.mimeType ||
                "audio/webm"
            }
          );

        if (recordedUrl) {

          URL.revokeObjectURL(
            recordedUrl
          );
        }

        recordedUrl =
          URL.createObjectURL(blob);

        recordPlayback.innerHTML = "";

        const audio =
          document.createElement(
            "audio"
          );

        audio.controls = true;
        audio.src = recordedUrl;

        recordPlayback.appendChild(
          audio
        );

        if (recordStream) {

          recordStream
            .getTracks()
            .forEach(
              track =>
                track.stop()
            );

          recordStream = null;
        }
      };

      mediaRecorder.start();

      recordStatus.textContent =
        "● Recording";

      recordButton.disabled = true;
      stopRecordButton.disabled = false;

    } catch (e) {

      recordStatus.textContent =
        "マイクを使用できません。";
    }
  };


stopRecordButton.onclick = () => {

  if (
    mediaRecorder &&
    mediaRecorder.state !==
      "inactive"
  ) {

    mediaRecorder.stop();
  }

  recordStatus.textContent = "";

  recordButton.disabled = false;
  stopRecordButton.disabled = true;
};


/* =====================================================
   音声自動分割
===================================================== */

async function prepareSegments() {

  try {

    segments =
      await detectSentenceSegments(
        QUESTION.answerAudio,
        QUESTION.sentences.length
      );

    loadingDisplay.textContent = "";

    renderStep();

  } catch (e) {

    console.error(e);

    loadingDisplay.textContent =
      "音声を正しく分割できませんでした。";
  }
}


async function detectSentenceSegments(
  file,
  expectedCount
) {

  const response =
    await fetch(file);

  if (!response.ok) {
    throw new Error(
      "Audio fetch failed"
    );
  }

  const arrayBuffer =
    await response.arrayBuffer();

  const audioContext =
    new AudioContext();

  const audioBuffer =
    await audioContext
      .decodeAudioData(arrayBuffer);

  const length =
    audioBuffer.length;

  const mono =
    new Float32Array(length);

  for (
    let channel = 0;
    channel <
      audioBuffer.numberOfChannels;
    channel++
  ) {

    const data =
      audioBuffer
        .getChannelData(channel);

    for (
      let i = 0;
      i < length;
      i++
    ) {

      mono[i] +=
        data[i] /
        audioBuffer.numberOfChannels;
    }
  }

  const sampleRate =
    audioBuffer.sampleRate;

  const frameSeconds = 0.02;

  const frameSize =
    Math.floor(
      sampleRate *
      frameSeconds
    );

  const frames = [];

  for (
    let start = 0;
    start < mono.length;
    start += frameSize
  ) {

    const end =
      Math.min(
        start + frameSize,
        mono.length
      );

    let sum = 0;

    for (
      let i = start;
      i < end;
      i++
    ) {

      sum +=
        mono[i] *
        mono[i];
    }

    frames.push({
      time:
        start / sampleRate,

      rms:
        Math.sqrt(
          sum /
          (end - start)
        )
    });
  }

  const silenceRanges = [];

  let silenceStart = null;

  for (
    let i = 0;
    i < frames.length;
    i++
  ) {

    const silent =
      frames[i].rms <
      SILENCE_THRESHOLD;

    if (
      silent &&
      silenceStart === null
    ) {

      silenceStart =
        frames[i].time;
    }

    if (
      !silent &&
      silenceStart !== null
    ) {

      const silenceEnd =
        frames[i].time;

      if (
        silenceEnd -
        silenceStart >=
        MIN_SILENCE_SECONDS
      ) {

        silenceRanges.push({
          start:
            silenceStart,

          end:
            silenceEnd,

          duration:
            silenceEnd -
            silenceStart
        });
      }

      silenceStart = null;
    }
  }

  if (
    silenceStart !== null
  ) {

    const silenceEnd =
      audioBuffer.duration;

    if (
      silenceEnd -
      silenceStart >=
      MIN_SILENCE_SECONDS
    ) {

      silenceRanges.push({
        start:
          silenceStart,

        end:
          silenceEnd,

        duration:
          silenceEnd -
          silenceStart
      });
    }
  }

  const internal =
    silenceRanges.filter(
      range =>
        range.start > 0.3 &&
        range.end <
          audioBuffer.duration -
          0.3
    );

  const selected =
    internal
      .sort(
        (a, b) =>
          b.duration -
          a.duration
      )
      .slice(
        0,
        expectedCount - 1
      )
      .sort(
        (a, b) =>
          a.start -
          b.start
      );

  if (
    selected.length !==
    expectedCount - 1
  ) {

    await audioContext.close();

    throw new Error(
      "Sentence split failed"
    );
  }

  let actualStart = 0;

  let actualEnd =
    audioBuffer.duration;

  for (
    let i = 0;
    i < frames.length;
    i++
  ) {

    if (
      frames[i].rms >=
      SILENCE_THRESHOLD
    ) {

      actualStart =
        Math.max(
          0,
          frames[i].time - 0.05
        );

      break;
    }
  }

  for (
    let i =
      frames.length - 1;
    i >= 0;
    i--
  ) {

    if (
      frames[i].rms >=
      SILENCE_THRESHOLD
    ) {

      actualEnd =
        Math.min(
          audioBuffer.duration,
          frames[i].time +
          frameSeconds +
          0.08
        );

      break;
    }
  }

  const result = [];

  let sentenceStart =
    actualStart;

  selected.forEach(gap => {

    result.push({
      start:
        sentenceStart,

      end:
        Math.min(
          actualEnd,
          gap.start + 0.05
        )
    });

    sentenceStart =
      Math.max(
        0,
        gap.end - 0.05
      );
  });

  result.push({
    start:
      sentenceStart,
    end:
      actualEnd
  });

  await audioContext.close();

  return result;
}
