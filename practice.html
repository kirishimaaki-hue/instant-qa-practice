<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Favorites 練習</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f6f6f6;
  color: #111;
}

.app {
  max-width: 900px;
  min-height: 100vh;
  margin: 0 auto;
  padding: 35px 42px 70px;
  background: white;
}

h1 {
  margin: 0 0 30px;
  font-size: 32px;
}

.question {
  margin-bottom: 15px;
  font-size: 29px;
  font-weight: bold;
  line-height: 1.5;
}

button {
  font-family: inherit;
  cursor: pointer;
}

.button {
  padding: 10px 16px;
  margin: 4px 5px 4px 0;
  font-size: 16px;
  border: 1px solid #999;
  border-radius: 6px;
  background: white;
}

.button.primary {
  border-color: #111;
  background: #111;
  color: white;
}

.button.record {
  border-color: #b00020;
  background: #b00020;
  color: white;
}

.button:disabled {
  opacity: 0.4;
  cursor: default;
}

.top-controls {
  margin-bottom: 10px;
}

.record-controls {
  margin: 8px 0 12px;
}

#recordStatus {
  margin-left: 8px;
  font-weight: bold;
  color: #b00020;
}

#recordPlayback {
  margin-top: 8px;
}

#recordPlayback audio {
  width: 100%;
  max-width: 520px;
}

.transcript-section {
  margin: 20px 0 32px;
}

.transcript-title {
  margin-bottom: 7px;
  font-size: 19px;
  font-weight: bold;
}

#transcript {
  min-height: 85px;
  padding: 15px;
  background: #f3f3f3;
  border-radius: 8px;
  font-size: 19px;
  line-height: 1.6;
}

#judgment {
  min-height: 32px;
  margin-top: 9px;
  font-size: 21px;
  font-weight: bold;
}

.pass {
  color: #16803a;
}

.retry {
  color: #c00000;
}

.step-title {
  margin: 30px 0 13px;
  font-size: 21px;
  font-weight: bold;
}

.step-tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-bottom: 20px;
}

.step-button {
  padding: 11px 14px;
  font-size: 15px;
  border: 1px solid #bbb;
  border-radius: 7px;
  background: white;
}

.step-button.active {
  border-color: #111;
  background: #111;
  color: white;
}

#stepDescription {
  margin-bottom: 18px;
  font-size: 18px;
  font-weight: bold;
}

#hintBox {
  min-height: 75px;
  margin-bottom: 20px;
  padding: 20px;
  background: #f3f3f3;
  border-radius: 9px;
  font-size: 20px;
  line-height: 1.8;
}

.no-hint {
  padding-top: 5px;
  text-align: center;
  color: #777;
}

.sentence-card {
  margin-bottom: 14px;
  padding: 18px 20px;
  background: #f3f3f3;
  border-radius: 9px;
}

.sentence-text {
  margin-bottom: 9px;
  font-size: 20px;
  line-height: 1.6;
}

#practiceControls {
  margin-top: 15px;
}

#status {
  min-height: 38px;
  margin: 16px 0 4px;
  font-size: 24px;
  font-weight: bold;
}

  min-height: 23px;
  color: #777;
}

@media (max-width: 600px) {
  .app {
    padding: 22px 16px 50px;
  }

  h1 {
    font-size: 27px;
  }

  .question {
    font-size: 24px;
  }

  .step-button {
    font-size: 14px;
  }

  #transcript,
  #hintBox {
    font-size: 18px;
  }
}
</style>
</head>

<body>

<div class="app">

  <h1>Favorites 練習</h1>

  <div class="question">
    Q1. What's your favorite season?
  </div>

  <div class="top-controls">
    <button id="questionAudioButton" class="button">
      ▶ 質問を聞く
    </button>
  </div>

  <div class="record-controls">

    <button id="recordButton" class="button record">
      ● 録音
    </button>

    <button id="stopRecordButton" class="button" disabled>
      ■ 停止
    </button>

    <span id="recordStatus"></span>

    <div id="recordPlayback"></div>

  </div>


  <div class="transcript-section">

    <div class="transcript-title">
      文字起こし
    </div>

    <div id="transcript">
      リピートした英文がここに表示されます。
    </div>

    <div id="judgment"></div>

  </div>


  <div class="step-title">
    練習ステップ
  </div>

  <div class="step-tabs">

    <button class="step-button active" data-step="1">
      Step 1
    </button>

    <button class="step-button" data-step="2">
      Step 2
    </button>

    <button class="step-button" data-step="3">
      Step 3
    </button>

    <button class="step-button" data-step="4">
      Step 4
    </button>

    <button class="step-button" data-step="5">
      Step 5
    </button>

    <button class="step-button" data-step="6">
      Step 6
    </button>

    <button class="step-button" data-step="7">
      Step 7
    </button>

  </div>

  <div id="stepDescription"></div>

  <div id="hintBox"></div>

  <div id="step1Area"></div>

  <div id="practiceControls"></div>

  <div id="status"></div>

  <div id="loading">
    音声を読み込んでいます…
  </div>

</div>


<script>

/* ==============================
   Q1
============================== */

const QUESTION = {

  questionAudio:
    "fav01.mp3",

  answerAudio:
    "yasmin_fav01.mp3",

  sentences: [
    "My favorite season is summer.",
    "I hate cold weather.",
    "Summers here are humid and tough, but I still prefer summer."
  ],

  hintMany:
    "favorite season / summer / hate cold weather / humid / tough / still prefer summer",

  hintFew:
    "summer / cold / humid / prefer summer"
};


/* ==============================
   設定
============================== */

const PASS_SCORE = 90;

const MIN_SILENCE_SECONDS = 0.25;
const SILENCE_THRESHOLD = 0.02;


/* ==============================
   DOM
============================== */

const questionAudioButton =
  document.getElementById("questionAudioButton");

const recordButton =
  document.getElementById("recordButton");

const stopRecordButton =
  document.getElementById("stopRecordButton");

const recordStatus =
  document.getElementById("recordStatus");

const recordPlayback =
  document.getElementById("recordPlayback");

const transcriptDisplay =
  document.getElementById("transcript");

const judgmentDisplay =
  document.getElementById("judgment");

const stepDescription =
  document.getElementById("stepDescription");

const hintBox =
  document.getElementById("hintBox");

const step1Area =
  document.getElementById("step1Area");

const practiceControls =
  document.getElementById("practiceControls");

const statusDisplay =
  document.getElementById("status");

const loadingDisplay =
  document.getElementById("loading");

const stepButtons =
  document.querySelectorAll(".step-button");


/* ==============================
   音声
============================== */

const questionPlayer =
  new Audio(
    QUESTION.questionAudio
  );

const answerPlayer =
  new Audio(
    QUESTION.answerAudio
  );

let segments = [];

let currentStep = 1;
let currentSegment = 0;

let segmentEndTime = null;
let animationId = null;
let repeatTimer = null;

let isPaused = false;
let practiceRunning = false;


/* ==============================
   SpeechRecognition
============================== */

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

let recognition = null;

let recognitionFinal = "";
let recognitionInterim = "";

let activeTarget = "";

let accumulatedTranscript = [];

let recognitionFinishCallback = null;


/* ==============================
   録音
============================== */

let recordStream = null;
let mediaRecorder = null;
let recordedChunks = [];
let recordedUrl = null;


/* ==============================
   初期化
============================== */

renderStep();
prepareSegments();


/* ==============================
   質問音声
============================== */

questionAudioButton.addEventListener(
  "click",
  () => {

    stopAllPractice();

    questionPlayer.currentTime = 0;

    questionPlayer.play();
  }
);


/* ==============================
   Step切替
============================== */

stepButtons.forEach(
  button => {

    button.addEventListener(
      "click",
      () => {

        stopAllPractice();

        currentStep =
          Number(
            button.dataset.step
          );


        stepButtons.forEach(
          btn => {

            btn.classList.toggle(
              "active",
              btn === button
            );
          }
        );


        resetTranscript();

        renderStep();
      }
    );
  }
);


/* ==============================
   Step表示
============================== */

function renderStep() {

  step1Area.innerHTML = "";
  practiceControls.innerHTML = "";
  hintBox.innerHTML = "";

  statusDisplay.textContent = "";


  /* Step 1 */

  if (currentStep === 1) {

    stepDescription.textContent =
      "1センテンスずつ、何度でもリピート";

    hintBox.style.display =
      "none";


    QUESTION.sentences.forEach(
      (sentence, index) => {

        const card =
          document.createElement("div");

        card.className =
          "sentence-card";


        const text =
          document.createElement("div");

        text.className =
          "sentence-text";

        text.textContent =
          (index + 1) +
          ". " +
          sentence;


        const button =
          document.createElement("button");

        button.className =
          "button";

        button.textContent =
          "▶ この文を聞く";

        button.disabled =
          segments.length === 0;


        button.addEventListener(
          "click",
          () => {

            playStep1Sentence(
              index
            );
          }
        );


        card.appendChild(text);
        card.appendChild(button);

        step1Area.appendChild(card);
      }
    );


    return;
  }


  hintBox.style.display =
    "block";


  /* Step 2 */

  if (currentStep === 2) {

    stepDescription.textContent =
      "全文を見ながら、1センテンスずつリッスン＆リピート";

    hintBox.innerHTML =
      QUESTION.sentences.join("<br>");

    createStartButton(
      "▶ リッスン＆リピート"
    );

    return;
  }


  /* Step 3 */

  if (currentStep === 3) {

    stepDescription.textContent =
      "ヒントを見ながら、1センテンスずつリッスン＆リピート";

    hintBox.textContent =
      QUESTION.hintFew;

    createStartButton(
      "▶ リッスン＆リピート"
    );

    return;
  }


  /* Step 4 */

  if (currentStep === 4) {

    stepDescription.textContent =
      "ヒントなしで、1センテンスずつリッスン＆リピート";

    hintBox.innerHTML =
      '<div class="no-hint">ヒントなし</div>';

    createStartButton(
      "▶ リッスン＆リピート"
    );

    return;
  }


  /* Step 5 */

  if (currentStep === 5) {

    stepDescription.textContent =
      "全文を聞いてから、まとめてリピート";

    hintBox.textContent =
      QUESTION.hintMany;

    createStartButton(
      "▶ 全文を聞く"
    );

    return;
  }


  /* Step 6 */

  if (currentStep === 6) {

    stepDescription.textContent =
      "全文を聞いてから、まとめてリピート";

    hintBox.textContent =
      QUESTION.hintFew;

    createStartButton(
      "▶ 全文を聞く"
    );

    return;
  }


  /* Step 7 */

  if (currentStep === 7) {

    stepDescription.textContent =
      "全文を聞いてから、ヒントなしでまとめてリピート";

    hintBox.innerHTML =
      '<div class="no-hint">ヒントなし</div>';

    createStartButton(
      "▶ 全文を聞く"
    );
  }
}


/* ==============================
   開始ボタン
============================== */

function createStartButton(label) {

  const button =
    document.createElement("button");

  button.className =
    "button primary";

  button.textContent =
    label;

  button.disabled =
    segments.length === 0;


  button.addEventListener(
    "click",
    () => {

      if (
        currentStep >= 2 &&
        currentStep <= 4
      ) {

        startSentenceBySentence();

      } else {

        startWholeRetention();
      }
    }
  );


  practiceControls.appendChild(
    button
  );


  const pause =
    document.createElement("button");

  pause.id =
    "practicePauseButton";

  pause.className =
    "button";

  pause.textContent =
    "一時停止";

  pause.disabled =
    true;


  pause.addEventListener(
    "click",
    () => {

      togglePause(
        pause
      );
    }
  );


  practiceControls.appendChild(
    pause
  );
}


/* ==============================
   Step 1
============================== */

function playStep1Sentence(index) {

  stopAllPractice();

  resetTranscript();


  activeTarget =
    QUESTION.sentences[index];


  statusDisplay.textContent =
    "Sentence " +
    (index + 1);


  playSegment(
    index,
    () => {

      statusDisplay.textContent =
        "Repeat";


      startRecognition(
        activeTarget,
        false
      );


      showRepeatFinishButton(
        activeTarget
      );
    }
  );
}


/* ==============================
   Step 2〜4
============================== */

function startSentenceBySentence() {

  stopAllPractice();

  resetTranscript();

  accumulatedTranscript = [];

  currentSegment = 0;

  practiceRunning = true;

  playNextSentence();
}


function playNextSentence() {

  if (
    !practiceRunning ||
    currentSegment >=
      QUESTION.sentences.length
  ) {

    practiceRunning = false;

    statusDisplay.textContent = "";

    evaluateAccumulated();

    return;
  }


  stopRecognition();


  statusDisplay.textContent =
    "Sentence " +
    (currentSegment + 1);


  playSegment(
    currentSegment,
    () => {

      statusDisplay.textContent =
        "Repeat";


      const target =
        QUESTION.sentences[
          currentSegment
        ];


      const wordCount =
        target
          .split(/\s+/)
          .length;


      const pauseMs =
        calculateRepeatPause(
          wordCount
        );


      startRecognition(
        target,
        true
      );


      repeatTimer =
        setTimeout(
          () => {

            finishRecognition(
              () => {

                currentSegment++;

                playNextSentence();
              }
            );

          },
          pauseMs
        );
    }
  );
}


/* ==============================
   Step 5〜7
============================== */

function startWholeRetention() {

  stopAllPractice();

  resetTranscript();

  practiceRunning = true;


  statusDisplay.textContent =
    "Listen";


  stopRecognition();


  answerPlayer.currentTime = 0;


  answerPlayer.onended =
    function() {

      answerPlayer.onended = null;


      if (!practiceRunning) {
        return;
      }


      statusDisplay.textContent =
        "Repeat";


      const target =
        QUESTION.sentences.join(" ");


      startRecognition(
        target,
        false
      );


      showRepeatFinishButton(
        target
      );
    };


  answerPlayer.play();

  enablePauseButton();
}


/* ==============================
   手動Repeat終了
============================== */

function showRepeatFinishButton(
  target
) {

  const old =
    document.getElementById(
      "repeatFinishButton"
    );


  if (old) {
    old.remove();
  }


  const button =
    document.createElement("button");

  button.id =
    "repeatFinishButton";

  button.className =
    "button primary";

  button.textContent =
    "■ リピート終了・判定";


  button.addEventListener(
    "click",
    () => {

      finishRecognition(
        () => {

          button.remove();

          statusDisplay.textContent =
            "";

          evaluateCurrent(
            target
          );
        }
      );
    }
  );


  practiceControls.appendChild(
    button
  );
}


/* ==============================
   区間再生
============================== */

function playSegment(
  index,
  callback
) {

  if (!segments[index]) {
    return;
  }


  stopRecognition();

  cancelAnimationFrame(
    animationId
  );


  const segment =
    segments[index];


  answerPlayer.onended = null;

  answerPlayer.currentTime =
    segment.start;

  segmentEndTime =
    segment.end;

  answerPlayer._callback =
    callback;


  answerPlayer.play();

  enablePauseButton();

  monitorSegment();
}


function monitorSegment() {

  cancelAnimationFrame(
    animationId
  );


  const monitor =
    () => {

      if (
        answerPlayer.currentTime >=
          segmentEndTime - 0.03
      ) {

        answerPlayer.pause();

        disablePauseButton();


        const callback =
          answerPlayer._callback;

        answerPlayer._callback =
          null;


        if (callback) {
          callback();
        }

        return;
      }


      if (
        !answerPlayer.paused &&
        !isPaused
      ) {

        animationId =
          requestAnimationFrame(
            monitor
          );
      }
    };


  animationId =
    requestAnimationFrame(
      monitor
    );
}


/* ==============================
   Repeatポーズ
============================== */

function calculateRepeatPause(
  wordCount
) {

  if (wordCount <= 8) {
    return 3000;
  }

  if (wordCount <= 14) {
    return 4000;
  }

  if (wordCount <= 20) {
    return 5000;
  }

  return 6000;
}


/* ==============================
   一時停止
============================== */

function enablePauseButton() {

  const button =
    document.getElementById(
      "practicePauseButton"
    );


  if (button) {
    button.disabled = false;
  }
}


function disablePauseButton() {

  const button =
    document.getElementById(
      "practicePauseButton"
    );


  if (button) {

    button.disabled = true;

    button.textContent =
      "一時停止";
  }


  isPaused = false;
}


function togglePause(button) {

  if (!isPaused) {

    isPaused = true;

    answerPlayer.pause();

    cancelAnimationFrame(
      animationId
    );

    button.textContent =
      "再開";

  } else {

    isPaused = false;

    button.textContent =
      "一時停止";

    answerPlayer.play();


    if (
      currentStep >= 2 &&
      currentStep <= 4
    ) {

      monitorSegment();
    }
  }
}


/* ==============================
   文字起こし開始
============================== */

function startRecognition(
  target,
  autoAccumulate
) {

  stopRecognition();


  if (!SpeechRecognition) {

    transcriptDisplay.textContent =
      "このブラウザでは文字起こしを利用できません。";

    return;
  }


  activeTarget =
    target;

  recognitionFinal = "";
  recognitionInterim = "";


  recognition =
    new SpeechRecognition();


  recognition.lang =
    "en-US";

  recognition.continuous =
    true;

  recognition.interimResults =
    true;


  recognition.onresult =
    function(event) {

      recognitionInterim = "";


      for (
        let i =
          event.resultIndex;
        i <
          event.results.length;
        i++
      ) {

        const text =
          event.results[i][0]
            .transcript;


        if (
          event.results[i].isFinal
        ) {

          recognitionFinal +=
            text + " ";

        } else {

          recognitionInterim +=
            text;
        }
      }


      const currentText =
        (
          recognitionFinal +
          recognitionInterim
        ).trim();


      if (autoAccumulate) {

        const previous =
          accumulatedTranscript
            .filter(Boolean)
            .join(" ");


        transcriptDisplay.textContent =
          (
            previous +
            " " +
            currentText
          ).trim();

      } else {

        transcriptDisplay.textContent =
          currentText;
      }


      updateLiveJudgment(
        currentText,
        target
      );
    };


  recognition.onerror =
    function(event) {

      console.log(
        "SpeechRecognition:",
        event.error
      );
    };


  recognition.onend =
    function() {

      if (
        recognitionFinishCallback
      ) {

        const callback =
          recognitionFinishCallback;

        recognitionFinishCallback =
          null;

        callback();
      }
    };


  try {

    recognition.start();

  } catch (error) {}
}


/* ==============================
   文字起こし停止
============================== */

function finishRecognition(
  callback
) {

  if (!recognition) {

    if (callback) {
      callback();
    }

    return;
  }


  recognitionFinishCallback =
    () => {

      const text =
        (
          recognitionFinal +
          recognitionInterim
        ).trim();


      if (
        currentStep >= 2 &&
        currentStep <= 4
      ) {

        accumulatedTranscript[
          currentSegment
        ] = text;


        transcriptDisplay.textContent =
          accumulatedTranscript
            .filter(Boolean)
            .join(" ");
      }


      recognition = null;


      if (callback) {
        callback();
      }
    };


  try {

    recognition.stop();

  } catch (error) {

    const fn =
      recognitionFinishCallback;

    recognitionFinishCallback =
      null;

    recognition = null;


    if (fn) {
      fn();
    }
  }


  setTimeout(
    () => {

      if (
        recognitionFinishCallback
      ) {

        const fn =
          recognitionFinishCallback;

        recognitionFinishCallback =
          null;

        recognition = null;

        fn();
      }

    },
    500
  );
}


function stopRecognition() {

  recognitionFinishCallback = null;


  if (recognition) {

    recognition.onend = null;


    try {
      recognition.stop();
    } catch (error) {}
  }


  recognition = null;
}


/* ==============================
   判定
============================== */

function updateLiveJudgment(
  spoken,
  target
) {

  if (!spoken) {

    judgmentDisplay.textContent = "";

    return;
  }


  const score =
    calculateSimilarity(
      spoken,
      target
    );


  showScore(score);
}


function evaluateCurrent(target) {

  const spoken =
    transcriptDisplay
      .textContent
      .trim();


  const score =
    calculateSimilarity(
      spoken,
      target
    );


  showScore(score);
}


function evaluateAccumulated() {

  const spoken =
    accumulatedTranscript
      .filter(Boolean)
      .join(" ");


  const target =
    QUESTION.sentences.join(" ");


  transcriptDisplay.textContent =
    spoken;


  const score =
    calculateSimilarity(
      spoken,
      target
    );


  showScore(score);
}


function showScore(score) {

  if (score >= PASS_SCORE) {

    judgmentDisplay.innerHTML =
      '<span class="pass">PASS</span>　' +
      score +
      "%";

  } else {

    judgmentDisplay.innerHTML =
      '<span class="retry">RETRY</span>　' +
      score +
      "%";
  }
}


/* ==============================
   一致率
============================== */

function calculateSimilarity(
  spoken,
  target
) {

  const spokenWords =
    normalize(spoken)
      .split(" ")
      .filter(Boolean);


  const targetWords =
    normalize(target)
      .split(" ")
      .filter(Boolean);


  if (
    spokenWords.length === 0 ||
    targetWords.length === 0
  ) {

    return 0;
  }


  const distance =
    levenshteinWords(
      spokenWords,
      targetWords
    );


  const length =
    Math.max(
      spokenWords.length,
      targetWords.length
    );


  return Math.round(
    Math.max(
      0,
      1 -
      distance / length
    ) * 100
  );
}


function normalize(text) {

  return String(text || "")
    .toLowerCase()
    .replace(/[’']/g, "")
    .replace(
      /[^a-z0-9\s]/g,
      " "
    )
    .replace(
      /\s+/g,
      " "
    )
    .trim();
}


function levenshteinWords(
  a,
  b
) {

  const matrix =
    Array.from(
      {
        length:
          a.length + 1
      },
      () =>
        new Array(
          b.length + 1
        ).fill(0)
    );


  for (
    let i = 0;
    i <= a.length;
    i++
  ) {

    matrix[i][0] = i;
  }


  for (
    let j = 0;
    j <= b.length;
    j++
  ) {

    matrix[0][j] = j;
  }


  for (
    let i = 1;
    i <= a.length;
    i++
  ) {

    for (
      let j = 1;
      j <= b.length;
      j++
    ) {

      const cost =
        a[i - 1] ===
        b[j - 1]
          ? 0
          : 1;


      matrix[i][j] =
        Math.min(
          matrix[i - 1][j] + 1,
          matrix[i][j - 1] + 1,
          matrix[i - 1][j - 1] +
            cost
        );
    }
  }


  return matrix[
    a.length
  ][
    b.length
  ];
}

/* ==============================
   録音
============================== */

recordButton.addEventListener(
  "click",
  async () => {

    if (
      mediaRecorder &&
      mediaRecorder.state ===
        "recording"
    ) {

      return;
    }


    try {

      recordStream =
        await navigator.mediaDevices
          .getUserMedia({
            audio: true
          });


      recordedChunks = [];


      mediaRecorder =
        new MediaRecorder(
          recordStream
        );


      mediaRecorder.ondataavailable =
        event => {

          if (
            event.data &&
            event.data.size > 0
          ) {

            recordedChunks.push(
              event.data
            );
          }
        };


      mediaRecorder.onstop =
        function() {

          const blob =
            new Blob(
              recordedChunks,
              {
                type:
                  mediaRecorder.mimeType ||
                  "audio/webm"
              }
            );


          if (recordedUrl) {

            URL.revokeObjectURL(
              recordedUrl
            );
          }


          recordedUrl =
            URL.createObjectURL(
              blob
            );


          recordPlayback.innerHTML =
            "";


          const audio =
            document.createElement(
              "audio"
            );

          audio.controls = true;

          audio.src =
            recordedUrl;


          recordPlayback.appendChild(
            audio
          );


          if (recordStream) {

            recordStream
              .getTracks()
              .forEach(
                track =>
                  track.stop()
              );

            recordStream = null;
          }
        };


      mediaRecorder.start();


      recordStatus.textContent =
        "● Recording";

      recordButton.disabled =
        true;

      stopRecordButton.disabled =
        false;


    } catch (error) {

      recordStatus.textContent =
        "マイクを使用できません。";
    }
  }
);


stopRecordButton.addEventListener(
  "click",
  () => {

    if (
      mediaRecorder &&
      mediaRecorder.state !==
        "inactive"
    ) {

      mediaRecorder.stop();
    }


    recordStatus.textContent =
      "";

    recordButton.disabled =
      false;

    stopRecordButton.disabled =
      true;
  }
);

function stopAllPractice() {

  practiceRunning = false;


  clearTimeout(
    repeatTimer
  );


  cancelAnimationFrame(
    animationId
  );


  answerPlayer.pause();

  answerPlayer.onended =
    null;


  stopRecognition();


  isPaused = false;

  disablePauseButton();


  statusDisplay.textContent =

    document.getElementById(

    );

  }
}

/* ==============================
   無音検出
============================== */

async function detectSentenceSegments(
  file,
  expectedCount
) {

  const response =
    await fetch(file);


  if (!response.ok) {

    throw new Error(
      "Audio fetch failed"
    );
  }


  const arrayBuffer =
    await response.arrayBuffer();


  const audioContext =
    new AudioContext();


  const audioBuffer =
    await audioContext
      .decodeAudioData(
        arrayBuffer
      );


  const length =
    audioBuffer.length;


  const mono =
    new Float32Array(
      length
    );


  for (
    let channel = 0;
    channel <
      audioBuffer.numberOfChannels;
    channel++
  ) {

    const data =
      audioBuffer.getChannelData(
        channel
      );


    for (
      let i = 0;
      i < length;
      i++
    ) {

      mono[i] +=
        data[i] /
        audioBuffer.numberOfChannels;
    }
  }


  const sampleRate =
    audioBuffer.sampleRate;

  const frameSeconds =
    0.02;

  const frameSize =
    Math.floor(
      sampleRate *
      frameSeconds
    );


  const frames = [];


  for (
    let start = 0;
    start < mono.length;
    start += frameSize
  ) {

    const end =
      Math.min(
        start + frameSize,
        mono.length
      );


    let sum = 0;


    for (
      let i = start;
      i < end;
      i++
    ) {

      sum +=
        mono[i] *
        mono[i];
    }


    const rms =
      Math.sqrt(
        sum /
        (end - start)
      );


    frames.push({
      time:
        start /
        sampleRate,

      rms: rms
    });
  }


  const silenceRanges = [];

  let silenceStart = null;


  for (
    let i = 0;
    i < frames.length;
    i++
  ) {

    const silent =
      frames[i].rms <
      SILENCE_THRESHOLD;


    if (
      silent &&
      silenceStart === null
    ) {

      silenceStart =
        frames[i].time;
    }


    if (
      !silent &&
      silenceStart !== null
    ) {

      const silenceEnd =
        frames[i].time;


      if (
        silenceEnd -
        silenceStart >=
        MIN_SILENCE_SECONDS
      ) {

        silenceRanges.push({
          start:
            silenceStart,

          end:
            silenceEnd,

          duration:
            silenceEnd -
            silenceStart
        });
      }


      silenceStart = null;
    }
  }


  if (
    silenceStart !== null
  ) {

    const silenceEnd =
      audioBuffer.duration;


    if (
      silenceEnd -
      silenceStart >=
      MIN_SILENCE_SECONDS
    ) {

      silenceRanges.push({
        start:
          silenceStart,

        end:
          silenceEnd,

        duration:
          silenceEnd -
          silenceStart
      });
    }
  }


  const internalSilences =
    silenceRanges.filter(
      range =>
        range.start > 0.3
        &&
        range.end <
          audioBuffer.duration -
          0.3
    );


  const requiredBreaks =
    expectedCount - 1;


  const selected =
    internalSilences
      .sort(
        (a, b) =>
          b.duration -
          a.duration
      )
      .slice(
        0,
        requiredBreaks
      )
      .sort(
        (a, b) =>
          a.start -
          b.start
      );


  if (
    selected.length !==
    requiredBreaks
  ) {

    await audioContext.close();

    throw new Error(
      "Sentence split failed"
    );
  }


  let actualStart = 0;

  let actualEnd =
    audioBuffer.duration;


  for (
    let i = 0;
    i < frames.length;
    i++
  ) {

    if (
      frames[i].rms >=
      SILENCE_THRESHOLD
    ) {

      actualStart =
        Math.max(
          0,
          frames[i].time -
          0.05
        );

      break;
    }
  }


  for (
    let i =
      frames.length - 1;
    i >= 0;
    i--
  ) {

    if (
      frames[i].rms >=
      SILENCE_THRESHOLD
    ) {

      actualEnd =
        Math.min(
          audioBuffer.duration,
          frames[i].time +
          frameSeconds +
          0.08
        );

      break;
    }
  }


  const result = [];

  let sentenceStart =
    actualStart;


  selected.forEach(
    gap => {

      result.push({

        start:
          sentenceStart,

        end:
          Math.min(
            actualEnd,
            gap.start + 0.05
          )

      });


      sentenceStart =
        Math.max(
          0,
          gap.end - 0.05
        );
    }
  );


  result.push({

    start:
      sentenceStart,

    end:
      actualEnd

  });


  await audioContext.close();


  return result;
}
