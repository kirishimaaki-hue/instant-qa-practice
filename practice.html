<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>英語リピート練習</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f6f6f6;
  color: #111;
}

.app {
  max-width: 900px;
  min-height: 100vh;
  margin: 0 auto;
  padding: 30px 36px 70px;
  background: white;
}

h1 {
  margin: 0 0 10px;
  font-size: 32px;
}

#practiceGuide {
  margin: 0 0 20px;
  font-size: 15px;
  line-height: 1.7;
  color: #555;
}

.selector-panel {
  display: grid;
  grid-template-columns: 1fr 1fr 1.4fr;
  gap: 10px;
  margin: 0 0 22px;
  padding: 14px;
  background: #f3f3f3;
  border-radius: 9px;
}

.selector-panel label {
  display: block;
  margin-bottom: 5px;
  font-size: 13px;
  font-weight: bold;
}

.selector-panel select {
  width: 100%;
  padding: 9px 10px;
  border: 1px solid #aaa;
  border-radius: 6px;
  background: white;
  font-size: 15px;
}

.voice-row {
  margin-top: 10px;
}

.voice-row label {
  margin-right: 6px;
  font-size: 13px;
  font-weight: bold;
}

#voiceSelect {
  max-width: 100%;
  padding: 7px 9px;
  border: 1px solid #aaa;
  border-radius: 6px;
  background: white;
}

.question {
  margin-bottom: 12px;
  font-size: 27px;
  font-weight: bold;
  line-height: 1.45;
}

button {
  font-family: inherit;
  cursor: pointer;
}

.button {
  padding: 10px 16px;
  margin: 4px 5px 4px 0;
  font-size: 16px;
  border: 1px solid #999;
  border-radius: 6px;
  background: white;
}

.button.primary {
  background: #111;
  color: white;
  border-color: #111;
}

.button.record {
  background: #b00020;
  color: white;
  border-color: #b00020;
}

.button:disabled {
  opacity: 0.4;
  cursor: default;
}

.record-controls {
  margin: 8px 0 12px;
}

#recordStatus {
  margin-left: 8px;
  font-weight: bold;
  color: #b00020;
}

#recordPlayback {
  margin-top: 10px;
}

#recordPlayback audio {
  width: 100%;
  max-width: 520px;
}

#transcriptSection {
  margin: 18px 0;
}

.transcript-header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 15px;
  margin-bottom: 7px;
}

.transcript-title {
  font-size: 19px;
  font-weight: bold;
}

#judgment {
  font-size: 21px;
  font-weight: bold;
  white-space: nowrap;
}

#transcript {
  min-height: 78px;
  padding: 14px;
  background: #f3f3f3;
  border-radius: 8px;
  font-size: 19px;
  line-height: 1.55;
}

.pass {
  color: #16803a;
}

.retry {
  color: #c00000;
}

.step-title {
  margin: 22px 0 13px;
  font-size: 21px;
  font-weight: bold;
}

.step-tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-bottom: 18px;
}

.step-button {
  padding: 11px 14px;
  font-size: 15px;
  border: 1px solid #bbb;
  border-radius: 7px;
  background: white;
}

.step-button.active {
  background: #111;
  color: white;
  border-color: #111;
}

#stepDescription {
  margin: 0 0 7px;
  font-size: 18px;
  font-weight: bold;
}

#step1Instruction {
  display: none;
  margin: 0 0 10px;
  color: #c00000;
}

.step1-main-line {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 14px;
  font-size: 16px;
}

#step1Cue {
  font-size: 19px;
  font-weight: bold;
  color: #c00000;
}

.mobile-step1-cue {
  display: none;
  margin: 8px 0 3px;
  min-height: 26px;
  font-size: 20px;
  font-weight: bold;
  color: #c00000;
}

.cue-note {
  margin-top: 4px;
  font-size: 13px;
  color: #c00000;
}

#step1Summary {
  display: none;
  margin: 12px 0 14px;
  padding: 13px 15px;
  background: #f3f3f3;
  border-radius: 8px;
  font-size: 17px;
  font-weight: bold;
  line-height: 1.6;
}

.sentence-result {
  min-height: 24px;
  margin-top: 7px;
  font-size: 18px;
  font-weight: bold;
}

#step24Area {
  display: none;
  margin: 0 0 10px;
}

#step24Cue {
  min-height: 24px;
  margin: 0 0 5px;
  font-size: 19px;
  font-weight: bold;
  color: #c00000;
}

#step24Notice {
  font-size: 16px;
}

#step24Result {
  margin-top: 9px;
  font-size: 19px;
  font-weight: bold;
}

#repeatInstruction {
  display: none;
  margin: 0 0 10px;
  color: #c00000;
}

.repeat-main-line {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  font-size: 16px;
}

#repeatCue {
  font-size: 22px;
  font-weight: bold;
  color: #c00000;
}

.blink {
  animation: repeatBlink 0.7s infinite;
}

@keyframes repeatBlink {

  0%, 45% {
    opacity: 1;
  }

  50%, 95% {
    opacity: 0.2;
  }

  100% {
    opacity: 1;
  }
}

#hintBox {
  min-height: 72px;
  margin-bottom: 16px;
  padding: 18px 20px;
  background: #f3f3f3;
  border-radius: 9px;
  font-size: 20px;
  line-height: 1.7;
}

.no-hint {
  text-align: center;
  color: #777;
}

.sentence-card {
  margin-bottom: 14px;
  padding: 17px 18px;
  background: #f3f3f3;
  border-radius: 9px;
}

.sentence-card.active-card {
  outline: 2px solid #aaa;
}

.sentence-text {
  margin-bottom: 9px;
  font-size: 20px;
  line-height: 1.55;
}

#practiceControls {
  margin-top: 12px;
}

#loading {
  margin-top: 8px;
  color: #777;
}

#dataError {
  display: none;
  margin: 10px 0;
  padding: 10px;
  background: #fff3f3;
  color: #b00020;
  border-radius: 6px;
}


@media (max-width: 700px) {

  .app {
    padding: 20px 14px 45px;
  }

  h1 {
    font-size: 26px;
  }

  #practiceGuide {
    margin-bottom: 16px;
    font-size: 14px;
  }

  .selector-panel {
    grid-template-columns: 1fr;
    gap: 9px;
    padding: 12px;
  }

  .question {
    font-size: 22px;
  }

  .button {
    width: 100%;
    min-height: 44px;
    margin: 4px 0;
    font-size: 16px;
  }

  .step-tabs {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
  }

  .step-button {
    width: 100%;
    padding: 10px 6px;
    font-size: 14px;
  }

  #transcriptSection {
    margin: 9px 0 4px;
  }

  #transcript {
    min-height: 62px;
    padding: 11px;
    font-size: 17px;
  }

  #judgment {
    font-size: 18px;
  }

  #hintBox {
    padding: 15px;
    font-size: 18px;
  }

  .sentence-text {
    font-size: 18px;
  }

  .sentence-card {
    padding: 14px;
  }

  #stepDescription {
    font-size: 17px;
  }

  .cue-note {
    font-size: 12px;
  }

  .mobile-step1-cue {
    display: block;
  }

  #step1Cue {
    display: none;
  }
}

</style>
</head>

<body>

<div class="app">

<h1 id="appTitle">英語リピート練習</h1>

<div id="practiceGuide">
リピート音声の正確さを点数で判定します。80点以上で合格です。なるべく合格点が出てから次のステップへ進みましょう。
</div>


<div class="selector-panel">

<div>
<label for="studentSelect">受講生</label>
<select id="studentSelect"></select>
</div>

<div>
<label for="topicSelect">Topic</label>
<select id="topicSelect"></select>
</div>

<div>
<label for="questionSelect">問題</label>
<select id="questionSelect"></select>
</div>

</div>


<div id="dataError"></div>

<div class="question" id="questionDisplay">
データを読み込んでいます...
</div>

<button id="questionAudioButton" class="button" disabled>
▶ 質問を聞く
</button>

<div class="voice-row">

<label for="voiceSelect">
英語音声
</label>

<select id="voiceSelect"></select>

</div>


<div class="record-controls">

<button id="recordButton" class="button record">
● 録音
</button>

<button id="stopRecordButton" class="button" disabled>
■ 停止
</button>

<span id="recordStatus"></span>

<div id="recordPlayback"></div>

</div>


<div id="transcriptHome"></div>

<div id="transcriptSection">

<div class="transcript-header">

<div class="transcript-title">
文字起こし
</div>

<div id="judgment"></div>

</div>

<div id="transcript">
リピートした英文がここに表示されます。
</div>

</div>


<div class="step-title">
練習ステップ
</div>


<div class="step-tabs">

<button class="step-button active" data-step="1">
Step 1
</button>

<button class="step-button" data-step="2">
Step 2
</button>

<button class="step-button" data-step="3">
Step 3
</button>

<button class="step-button" data-step="4">
Step 4
</button>

<button class="step-button" data-step="5">
Step 5
</button>

<button class="step-button" data-step="6">
Step 6
</button>

</div>


<div id="stepDescription"></div>


<div id="step1Instruction">

<div class="step1-main-line">

<span>
音声が終わってからリピートしてください。
</span>

<span id="step1Cue"></span>

</div>

<div class="cue-note">
※「Repeat」が表示されてから話してください。
</div>

</div>


<div id="step24Area">

<div id="step24Cue"></div>

<div id="step24Notice">
音声を聞いた後、1センテンスずつリピートしてください。
</div>

<div id="step24Result"></div>

</div>


<div id="repeatInstruction">

<div class="repeat-main-line">

<span>
「Repeat」が表示されてから話してください。
</span>

<span id="repeatCue"></span>

</div>

<div class="cue-note">
※話し終わってから約3秒後に判定します。
</div>

</div>


<div id="hintBox"></div>

<div id="step1Summary"></div>

<div id="step1Area"></div>

<div id="practiceControls"></div>

<div id="loading"></div>

</div>


<script>

/* =========================================================
   API
========================================================= */

const API_URL =
"https://script.google.com/macros/s/AKfycbzZIqSI_QMpzyUICUGRGOPup7QL1YJ4thZ5PttFfGxiR8z0IaPZRqSQXj9K2EYA2FgO/exec";


/* =========================================================
   設定
========================================================= */

const PASS_SCORE = 80;

const SPEECH_END_SILENCE_MS = 2500;

/*
  Androidの全文リピートだけは、
  文と文の間の短い間で終了しないよう
  少し長くする。
*/
const ANDROID_WHOLE_END_SILENCE_MS = 3500;

const CUE_CLEAR_DELAY_MS = 500;

const MOBILE_BREAKPOINT = 700;

const ANDROID_RESTART_DELAY_MS = 120;


/* =========================================================
   Android
========================================================= */

const IS_ANDROID =
/Android/i.test(navigator.userAgent);


/* =========================================================
   問題
========================================================= */

let QUESTION = {

  question: "",

  modelAnswer: "",

  sentences: [],

  keywords: "",

  topic: "",

  no: 1

};


/* =========================================================
   状態
========================================================= */

let currentStep = 1;

let currentSegment = 0;

let practiceRunning = false;

let recognition = null;

let recognitionText = "";

let speechEndTimer = null;

let cueClearTimer = null;

let speechToken = 0;

let isSpeechPaused = false;

let studentRecords = [];

let currentStudentId = "";

let currentActiveSentenceIndex = null;

let step1Scores = [];


/* =========================================================
   録音
========================================================= */

let recordStream = null;

let mediaRecorder = null;

let recordedChunks = [];

let recordedUrl = null;


/* =========================================================
   Browser API
========================================================= */

const SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;

const synth =
window.speechSynthesis;


/* =========================================================
   DOM
========================================================= */

const appTitle =
document.getElementById("appTitle");

const practiceGuide =
document.getElementById("practiceGuide");

const studentSelect =
document.getElementById("studentSelect");

const topicSelect =
document.getElementById("topicSelect");

const questionSelect =
document.getElementById("questionSelect");

const questionDisplay =
document.getElementById("questionDisplay");

const questionAudioButton =
document.getElementById("questionAudioButton");

const voiceSelect =
document.getElementById("voiceSelect");

const recordButton =
document.getElementById("recordButton");

const stopRecordButton =
document.getElementById("stopRecordButton");

const recordStatus =
document.getElementById("recordStatus");

const recordPlayback =
document.getElementById("recordPlayback");

const transcriptHome =
document.getElementById("transcriptHome");

const transcriptSection =
document.getElementById("transcriptSection");

const transcriptDisplay =
document.getElementById("transcript");

const judgmentDisplay =
document.getElementById("judgment");

const stepDescription =
document.getElementById("stepDescription");

const step1Instruction =
document.getElementById("step1Instruction");

const step1Cue =
document.getElementById("step1Cue");

const step24Area =
document.getElementById("step24Area");

const step24Cue =
document.getElementById("step24Cue");

const step24Result =
document.getElementById("step24Result");

const repeatInstruction =
document.getElementById("repeatInstruction");

const repeatCue =
document.getElementById("repeatCue");

const hintBox =
document.getElementById("hintBox");

const step1Summary =
document.getElementById("step1Summary");

const step1Area =
document.getElementById("step1Area");

const practiceControls =
document.getElementById("practiceControls");

const loadingDisplay =
document.getElementById("loading");

const dataError =
document.getElementById("dataError");

const stepButtons =
document.querySelectorAll(".step-button");


/* =========================================================
   初期化
========================================================= */

init();


async function init() {

  await loadVoices();

  await loadStudents();

}


/* =========================================================
   API
========================================================= */

async function fetchJson(url) {

  const response =
  await fetch(
    url,
    {
      cache: "no-store"
    }
  );

  if (!response.ok) {

    throw new Error(
      "データ取得に失敗しました。"
    );

  }

  return response.json();

}


/* =========================================================
   受講生一覧
========================================================= */

async function loadStudents() {

  setLoading(
    "受講生データを読み込んでいます..."
  );

  hideError();

  try {

    const result =
    await fetchJson(
      `${API_URL}?mode=students`
    );

    if (
      !result.success ||
      !Array.isArray(result.students)
    ) {

      throw new Error(
        "受講生一覧を取得できませんでした。"
      );

    }

    studentSelect.innerHTML = "";

    result.students.forEach(
      student => {

        const option =
        document.createElement("option");

        option.value =
        student.studentId;

        option.textContent =
        `${student.student} (${student.className})`;

        studentSelect.appendChild(
          option
        );

      }
    );

    const params =
    new URLSearchParams(
      location.search
    );

    const requestedStudent =
    params.get("studentId");

    if (
      requestedStudent &&
      [...studentSelect.options].some(
        option =>
        option.value === requestedStudent
      )
    ) {

      studentSelect.value =
      requestedStudent;

    }

    await loadStudentRecords(
      studentSelect.value,
      true
    );

  } catch (error) {

    showError(
      error.message
    );

  } finally {

    setLoading("");

  }

}


/* =========================================================
   受講生データ
========================================================= */

async function loadStudentRecords(
  studentId,
  useUrlSelection = false
) {

  stopAllPractice();

  resetTranscript();

  setLoading(
    "問題データを読み込んでいます..."
  );

  hideError();

  try {

    const result =
    await fetchJson(
      `${API_URL}?studentId=${encodeURIComponent(studentId)}`
    );

    if (
      !result.success ||
      !Array.isArray(result.data)
    ) {

      throw new Error(
        "問題データを取得できませんでした。"
      );

    }

    studentRecords =
    result.data;

    currentStudentId =
    studentId;

    const topics =
    [
      ...new Set(
        studentRecords
        .map(
          record =>
          record.topic
        )
        .filter(Boolean)
      )
    ];

    topicSelect.innerHTML = "";

    topics.forEach(
      topic => {

        const option =
        document.createElement("option");

        option.value =
        topic;

        option.textContent =
        topic;

        topicSelect.appendChild(
          option
        );

      }
    );

    if (useUrlSelection) {

      const params =
      new URLSearchParams(
        location.search
      );

      const requestedTopic =
      params.get("topic");

      if (
        requestedTopic &&
        topics.includes(
          requestedTopic
        )
      ) {

        topicSelect.value =
        requestedTopic;

      }

    }

    populateQuestionSelect(
      useUrlSelection
    );

  } catch (error) {

    showError(
      error.message
    );

  } finally {

    setLoading("");

  }

}


/* =========================================================
   問題一覧
========================================================= */

function populateQuestionSelect(
  useUrlSelection = false
) {

  const topic =
  topicSelect.value;

  const records =
  studentRecords
  .filter(
    record =>
    record.topic === topic
  )
  .sort(
    (a, b) =>
    Number(a.no) -
    Number(b.no)
  );

  questionSelect.innerHTML = "";

  records.forEach(
    record => {

      const option =
      document.createElement("option");

      option.value =
      String(record.no);

      option.textContent =
      `Q${record.no}. ${record.question}`;

      questionSelect.appendChild(
        option
      );

    }
  );

  if (useUrlSelection) {

    const params =
    new URLSearchParams(
      location.search
    );

    const requestedNo =
    params.get("no");

    if (
      requestedNo &&
      [...questionSelect.options].some(
        option =>
        option.value === requestedNo
      )
    ) {

      questionSelect.value =
      requestedNo;

    }

  }

  applySelectedQuestion();

}


/* =========================================================
   問題適用
========================================================= */

function applySelectedQuestion() {

  restoreTranscriptHome();

  stopAllPractice();

  resetTranscript();

  const topic =
  topicSelect.value;

  const no =
  Number(
    questionSelect.value
  );

  const record =
  studentRecords.find(
    item =>
    item.topic === topic &&
    Number(item.no) === no
  );

  if (!record) {

    showError(
      "選択した問題が見つかりません。"
    );

    return;

  }

  QUESTION = {

    question:
    record.question,

    modelAnswer:
    record.modelAnswer,

    sentences:
    splitIntoSentences(
      record.modelAnswer
    ),

    keywords:
    record.keywords || "",

    topic:
    record.topic,

    no:
    Number(record.no)

  };

  step1Scores =
  new Array(
    QUESTION.sentences.length
  ).fill(null);

  appTitle.textContent =
  `${QUESTION.topic} 練習`;

  questionDisplay.textContent =
  `Q${QUESTION.no}. ${QUESTION.question}`;

  questionAudioButton.disabled =
  false;

  currentStep = 1;

  currentActiveSentenceIndex =
  null;

  stepButtons.forEach(
    button => {

      button.classList.toggle(
        "active",
        Number(button.dataset.step) === 1
      );

    }
  );

  renderStep();

  updateUrl();

}


/* =========================================================
   Sentence分割
========================================================= */

function splitIntoSentences(text) {

  return (
    String(text).match(
      /[^.!?]+[.!?]+|[^.!?]+$/g
    ) || []
  )
  .map(
    sentence =>
    sentence.trim()
  )
  .filter(Boolean);

}


/* =========================================================
   選択変更
========================================================= */

studentSelect.addEventListener(
  "change",
  () => {

    loadStudentRecords(
      studentSelect.value
    );

  }
);

topicSelect.addEventListener(
  "change",
  () => {

    populateQuestionSelect();

  }
);

questionSelect.addEventListener(
  "change",
  applySelectedQuestion
);


/* =========================================================
   URL
========================================================= */

function updateUrl() {

  const url =
  new URL(
    location.href
  );

  url.searchParams.set(
    "studentId",
    currentStudentId
  );

  url.searchParams.set(
    "topic",
    QUESTION.topic
  );

  url.searchParams.set(
    "no",
    String(QUESTION.no)
  );

  history.replaceState(
    null,
    "",
    url
  );

}


/* =========================================================
   表示
========================================================= */

function setLoading(text) {

  loadingDisplay.textContent =
  text;

}


function showError(text) {

  dataError.style.display =
  "block";

  dataError.textContent =
  text;

}


function hideError() {

  dataError.style.display =
  "none";

  dataError.textContent =
  "";

}


/* =========================================================
   Voice
========================================================= */

async function loadVoices() {

  if (!synth) {
    return;
  }

  let voices =
  synth.getVoices();

  if (!voices.length) {

    await new Promise(
      resolve => {

        let done = false;

        const finish =
        () => {

          if (!done) {

            done = true;

            resolve();

          }

        };

        synth.onvoiceschanged =
        finish;

        setTimeout(
          finish,
          1200
        );

      }
    );

    voices =
    synth.getVoices();

  }

  const englishVoices =
  voices.filter(
    voice =>
    /^en(-|_)/i.test(
      voice.lang
    )
  );

  const sorted =
  englishVoices
  .slice()
  .sort(
    (a, b) =>
    voiceScore(b) -
    voiceScore(a)
  );

  voiceSelect.innerHTML = "";

  if (!sorted.length) {

    const option =
    document.createElement("option");

    option.value = "";

    option.textContent =
    "ブラウザ標準の英語音声";

    voiceSelect.appendChild(
      option
    );

    return;

  }

  sorted.forEach(
    (voice, index) => {

      const option =
      document.createElement("option");

      option.value =
      `${voice.name}|||${voice.lang}`;

      option.textContent =
      `${voice.name} (${voice.lang})`;

      if (index === 0) {

        option.selected =
        true;

      }

      voiceSelect.appendChild(
        option
      );

    }
  );

}


function voiceScore(voice) {

  const name =
  voice.name.toLowerCase();

  let score = 0;

  if (
    name.includes("google") &&
    name.includes("english")
  ) {

    score += 100;

  }

  if (
    name.includes("natural")
  ) {

    score += 90;

  }

  if (
    name.includes("aria") ||
    name.includes("jenny") ||
    name.includes("guy")
  ) {

    score += 80;

  }

  if (
    name.includes("samantha") ||
    name.includes("daniel") ||
    name.includes("karen") ||
    name.includes("moira")
  ) {

    score += 70;

  }

  if (/en-us/i.test(voice.lang)) {

    score += 20;

  }

  if (/en-gb/i.test(voice.lang)) {

    score += 15;

  }

  if (voice.default) {

    score += 5;

  }

  return score;

}


function getSelectedVoice() {

  if (!synth) {
    return null;
  }

  const [
    name,
    lang
  ] =
  String(
    voiceSelect.value || ""
  ).split("|||");

  return synth
  .getVoices()
  .find(
    voice =>
    voice.name === name &&
    voice.lang === lang
  ) || null;

}


/* =========================================================
   読み上げ
========================================================= */

function stopSpeech() {

  speechToken++;

  isSpeechPaused =
  false;

  if (synth) {

    synth.cancel();

  }

  disablePauseButton();

}


function speakText(
  text,
  onEnd = null
) {

  stopRecognition();

  stopSpeech();

  if (
    !synth ||
    typeof SpeechSynthesisUtterance ===
    "undefined"
  ) {

    showError(
      "このブラウザでは読み上げ機能を利用できません。"
    );

    return;

  }

  const token =
  ++speechToken;

  const utterance =
  new SpeechSynthesisUtterance(
    text
  );

  utterance.lang =
  "en-US";

  utterance.rate =
  0.92;

  utterance.pitch =
  1.0;

  const voice =
  getSelectedVoice();

  if (voice) {

    utterance.voice =
    voice;

    utterance.lang =
    voice.lang;

  }

  utterance.onend =
  () => {

    if (
      token !==
      speechToken
    ) {

      return;

    }

    disablePauseButton();

    if (onEnd) {

      onEnd();

    }

  };

  utterance.onerror =
  () => {

    if (
      token !==
      speechToken
    ) {

      return;

    }

    disablePauseButton();

  };

  synth.speak(
    utterance
  );

  setTimeout(
    enablePauseButton,
    100
  );

}

/* =========================================================
   Android Step1
========================================================= */

function startAndroidSentenceRecognition(
  target,
  index,
  useCue = true
) {

  stopRecognition();

  if (!SpeechRecognition) {

    transcriptDisplay.textContent =
    "このブラウザでは文字起こしを利用できません。";

    return;

  }

  const r =
  new SpeechRecognition();

  recognition =
  r;

  r.lang =
  "en-US";

  r.continuous =
  false;

  r.interimResults =
  false;

  r.maxAlternatives =
  5;

  let bestText = "";

  let bestScore = -1;

  let finished = false;


  const finish =
  () => {

    if (finished) {
      return;
    }

    finished = true;

    if (
      recognition === r
    ) {

      recognition =
      null;

    }

    if (!bestText) {

      transcriptDisplay.textContent =
      "文字起こしできませんでした。";

      if (useCue) {

        finishStep1Cue(
          index
        );

      }

      return;

    }

    recognitionText =
    bestText;

    transcriptDisplay.textContent =
    bestText;

    showScore(
      bestScore
    );

    saveBestStep1Score(
      index,
      bestScore
    );

    if (useCue) {

      finishStep1Cue(
        index
      );

    }

  };


  /*
    Androidで実際に認識開始してから
    Repeatを表示する。
  */

  r.onstart =
  () => {

    if (
      recognition !== r
    ) {

      return;

    }

    if (useCue) {

      setStep1Cue(
        index,
        `Sentence${index + 1}　Repeat`,
        true
      );

    }

  };


  r.onresult =
  event => {

    for (
      let i =
      event.resultIndex;
      i < event.results.length;
      i++
    ) {

      const result =
      event.results[i];

      for (
        let a = 0;
        a < result.length;
        a++
      ) {

        const text =
        String(
          result[a].transcript || ""
        )
        .replace(
          /\s+/g,
          " "
        )
        .trim();

        if (!text) {
          continue;
        }

        const score =
        calculateSimilarity(
          text,
          target
        );

        if (
          score > bestScore
        ) {

          bestScore =
          score;

          bestText =
          text;

        }

      }

    }

    /*
      画面には1候補だけ表示する。
      文字列を追加しない。
    */

    if (bestText) {

      transcriptDisplay.textContent =
      bestText;

    }

  };


  r.onend =
  finish;


  r.onerror =
  event => {

    if (
      finished
    ) {

      return;

    }

    if (
      event.error ===
      "no-speech"
    ) {

      transcriptDisplay.textContent =
      "音声を認識できませんでした。";

    } else {

      transcriptDisplay.textContent =
      "文字起こしを完了できませんでした。";

    }

    if (useCue) {

      finishStep1Cue(
        index
      );

    }

  };


  try {

    r.start();

  } catch (e) {

    transcriptDisplay.textContent =
    "文字起こしを開始できませんでした。";

  }

}


/* =========================================================
   PC Step1
========================================================= */

function startDesktopSentenceRecognition(
  target,
  index,
  useCue = true
) {

  stopRecognition();

  if (!SpeechRecognition) {

    transcriptDisplay.textContent =
    "このブラウザでは文字起こしを利用できません。";

    return;

  }

  const r =
  new SpeechRecognition();

  recognition =
  r;

  r.lang =
  "en-US";

  r.continuous =
  true;

  r.interimResults =
  true;

  let currentText = "";

  let finished = false;

  let hasSpeech = false;


  const finish =
  () => {

    if (
      finished ||
      !hasSpeech
    ) {

      return;

    }

    finished = true;

    clearTimeout(
      speechEndTimer
    );

    r.onend =
    null;

    if (
      recognition === r
    ) {

      try {

        r.stop();

      } catch (e) {}

      recognition =
      null;

    }

    recognitionText =
    currentText;

    transcriptDisplay.textContent =
    currentText;

    const score =
    calculateSimilarity(
      currentText,
      target
    );

    showScore(
      score
    );

    saveBestStep1Score(
      index,
      score
    );

    if (useCue) {

      finishStep1Cue(
        index
      );

    }

  };


  r.onresult =
  event => {

    currentText =
    buildCurrentRecognitionText(
      event.results
    );

    transcriptDisplay.textContent =
    currentText;

    if (currentText) {

      hasSpeech =
      true;

      clearTimeout(
        speechEndTimer
      );

      speechEndTimer =
      setTimeout(
        finish,
        SPEECH_END_SILENCE_MS
      );

    }

  };


  r.onend =
  () => {

    if (
      recognition === r
    ) {

      recognition =
      null;

    }

    if (hasSpeech) {

      finish();

    }

  };


  try {

    r.start();

  } catch (e) {}

}

function saveBestStep1Score(
  index,
  score
) {

  const oldScore =
  step1Scores[index];

  if (
    oldScore === null ||
    score > oldScore
  ) {

    step1Scores[index] =
    score;

  }

  refreshStep1Results();

}

/* =========================================================
   Step1結果
========================================================= */

function refreshStep1Results() {

  step1Scores.forEach(
    (score, index) => {

      const target =
      step1Area.querySelector(
        `[data-result-index="${index}"]`
      );

      if (!target) {
        return;
      }

      if (
        score === null
      ) {

        target.innerHTML =
        "";

        return;

      }

      if (
        score >= PASS_SCORE
      ) {

        target.innerHTML =
        `<span class="pass">最高 ${score}点　合格</span>`;

      } else {

        target.innerHTML =
        `<span class="retry">最高 ${score}点　再挑戦</span>`;

      }

    }
  );


  const attempted =
  step1Scores.filter(
    score =>
    score !== null
  ).length;


  if (
    attempted === 0
  ) {

    step1Summary.innerHTML =
    "3センテンスすべて練習してください。";

    return;

  }


  if (
    attempted <
    step1Scores.length
  ) {

    step1Summary.innerHTML =
    `${attempted}/${step1Scores.length}センテンス完了。残りも練習してください。`;

    return;

  }


  const failed =
  step1Scores
  .map(
    (score, index) => ({
      score,
      index
    })
  )
  .filter(
    item =>
    item.score < PASS_SCORE
  );


  if (
    !failed.length
  ) {

    step1Summary.innerHTML =
    '<span class="pass">Step 1 合格：すべてのセンテンスが80点以上です。</span>';

  } else {

    const names =
    failed
    .map(
      item =>
      `Sentence ${item.index + 1}`
    )
    .join("・");

    step1Summary.innerHTML =
    `<span class="retry">Step 1 再挑戦：${names}をもう一度練習しましょう。</span>`;

  }

}

function playNextStep2to4() {

    !practiceRunning
  ) {

    return;

  }

  if (
    currentSegment >=
    QUESTION.sentences.length
  ) {

    finishStep2to4();

    return;

  }

  const index =
  currentSegment;

  setCue(
    step24Cue,
    `Sentence${index + 1}　Listen`,
    false
  );

  speakText(
    QUESTION.sentences[index],
    () => {

      if (
        !practiceRunning
      ) {

        return;

      }

      setCue(
        step24Cue,
        `Sentence${index + 1}　Repeat`,
        true
      );

      const repeatMs =
      calculatePracticeTime(
        countWords(
          QUESTION.sentences[index]
        )
      );

      setTimeout(
        () => {

          if (
            !practiceRunning
          ) {

            return;

          }

          step24Cue.classList.remove(
            "blink"
          );

          currentSegment++;

          playNextStep2to4();

        },
        repeatMs
      );

    }
  );

}

  step24Cue.classList.remove(

  );

          QUESTION.modelAnswer
        );

      }

    }
  );

}


/* =========================================================
   Android Step5〜6
========================================================= */

function startAndroidWholeRecognition(target) {

  stopRecognition();

  if (!SpeechRecognition) {

    transcriptDisplay.textContent =
    "このブラウザでは文字起こしを利用できません。";

    return;

  }

  let accumulatedText = "";

  let finished = false;

  let firstStart = true;

  let lastResultTime = 0;

  let restartTimer = null;


  /*
    ここでのみ採点する。
    Android側が途中でRecognitionを終了しても
    onendでは採点しない。
  */

  const finishWhole =
  () => {

    if (finished) {
      return;
    }

    if (!accumulatedText) {
      return;
    }

    finished = true;

    practiceRunning =
    false;

    clearTimeout(
      speechEndTimer
    );

    clearTimeout(
      restartTimer
    );

    if (recognition) {

      recognition.onend =
      null;

      recognition.onerror =
      null;

      try {

        recognition.stop();

      } catch (e) {}

      recognition =
      null;

    }

    recognitionText =
    accumulatedText;

    transcriptDisplay.textContent =
    accumulatedText;

    const score =
    calculateSimilarity(
      accumulatedText,
      target
    );

    showScore(
      score
    );

    finishCue(
      repeatCue
    );

  };


  const scheduleFinish =
  () => {

    clearTimeout(
      speechEndTimer
    );

    speechEndTimer =
    setTimeout(
      () => {

        const elapsed =
        Date.now() -
        lastResultTime;

        if (
          accumulatedText &&
          elapsed >=
          ANDROID_WHOLE_END_SILENCE_MS -
          100
        ) {

          finishWhole();

        }

      },
      ANDROID_WHOLE_END_SILENCE_MS
    );

  };


  const startSession =
  () => {

    if (
      finished ||
      !practiceRunning
    ) {

      return;

    }

    const r =
    new SpeechRecognition();

    recognition =
    r;

    r.lang =
    "en-US";

    /*
      Androidでは途中で切れても、
      onendで再開する。
    */

    r.continuous =
    true;

    r.interimResults =
    false;

    r.maxAlternatives =
    3;


    r.onstart =
    () => {

      if (
        finished ||
        recognition !== r
      ) {

        return;

      }

      /*
        最初に実際の認識開始を確認してから
        Repeatを表示する。
      */

      if (firstStart) {

        firstStart =
        false;

        setCue(
          repeatCue,
          "Repeat",
          true
        );

      }

    };


    r.onresult =
    event => {

      if (finished) {
        return;
      }

      let sessionText = "";

      for (
        let i =
        event.resultIndex;
        i < event.results.length;
        i++
      ) {

        const result =
        event.results[i];

        let bestAlternative = "";

        let bestConfidence = -1;

        for (
          let a = 0;
          a < result.length;
          a++
        ) {

          const text =
          String(
            result[a].transcript || ""
          )
          .replace(
            /\s+/g,
            " "
          )
          .trim();

          if (!text) {
            continue;
          }

          const confidence =
          Number(
            result[a].confidence || 0
          );

          if (
            !bestAlternative ||
            confidence > bestConfidence
          ) {

            bestAlternative =
            text;

            bestConfidence =
            confidence;

          }

        }

        if (bestAlternative) {

          sessionText =
          mergeRecognitionText(
            sessionText,
            bestAlternative
          );

        }

      }

      if (!sessionText) {
        return;
      }

      /*
        セッションが再開して同じ文字列を返しても
        二重に追加しない。
      */

      accumulatedText =
      mergeRecognitionText(
        accumulatedText,
        sessionText
      );

      recognitionText =
      accumulatedText;

      transcriptDisplay.textContent =
      accumulatedText;

      lastResultTime =
      Date.now();

      scheduleFinish();

    };


    /*
      ここが今回の重要部分。
      Androidが途中でRecognitionを終了しても
      採点せず、再開する。
    */

    r.onend =
    () => {

      if (
        recognition === r
      ) {

        recognition =
        null;

      }

      if (
        finished ||
        !practiceRunning
      ) {

        return;

      }

      restartTimer =
      setTimeout(
        startSession,
        ANDROID_RESTART_DELAY_MS
      );

    };


    r.onerror =
    event => {

      if (
        finished ||
        !practiceRunning
      ) {

        return;

      }

      /*
        no-speech や aborted で
        途中終了しても、
        既に発話途中なら即採点しない。
      */

      if (
        event.error === "not-allowed" ||
        event.error === "service-not-allowed"
      ) {

        practiceRunning =
        false;

        transcriptDisplay.textContent =
        "マイクの音声認識を利用できません。";

        finishCue(
          repeatCue
        );

      }

    };


    try {

      r.start();

    } catch (e) {

      restartTimer =
      setTimeout(
        startSession,
        300
      );

    }

  };


  startSession();

}


/* =========================================================
   PC Step5〜6
========================================================= */

function startDesktopWholeRecognition(target) {

  stopRecognition();

  if (!SpeechRecognition) {

    transcriptDisplay.textContent =
    "このブラウザでは文字起こしを利用できません。";

    return;

  }

  const r =
  new SpeechRecognition();

  recognition =
  r;

  r.lang =
  "en-US";

  r.continuous =
  true;

  r.interimResults =
  true;

  let bestText = "";

  let bestScore = -1;

  let hasSpeech = false;

  let finished = false;


  const finish =
  () => {

    if (
      finished ||
      !hasSpeech
    ) {

      return;

    }

    finished = true;

    clearTimeout(
      speechEndTimer
    );

    r.onend =
    null;

    if (
      recognition === r
    ) {

      try {

        r.stop();

      } catch (e) {}

      recognition =
      null;

    }

    recognitionText =
    bestText;

    transcriptDisplay.textContent =
    bestText ||
    "文字起こしできませんでした。";

    if (bestText) {

      showScore(
        bestScore
      );

    }

    finishCue(
      repeatCue
    );

  };


  r.onstart =
  () => {

    if (
      recognition === r &&
      practiceRunning
    ) {

      setCue(
        repeatCue,
        "Repeat",
        true
      );

    }

  };


  r.onresult =
  event => {

    const candidate =
    buildCurrentRecognitionText(
      event.results
    );

    if (!candidate) {
      return;
    }

    hasSpeech =
    true;

    const candidateScore =
    calculateSimilarity(
      candidate,
      target
    );

    if (
      candidateScore >
      bestScore
    ) {

      bestScore =
      candidateScore;

      bestText =
      candidate;

    }

    transcriptDisplay.textContent =
    bestText;

    clearTimeout(
      speechEndTimer
    );

    speechEndTimer =
    setTimeout(
      finish,
      SPEECH_END_SILENCE_MS
    );

  };


  r.onend =
  () => {

    if (
      recognition === r
    ) {

      recognition =
      null;

    }

    if (hasSpeech) {

      finish();

    }

  };


  try {

    r.start();

  } catch (e) {}

}

function startSpeakOnlyWhole() {

}


/* =========================================================
   Android 全文の文字列結合
========================================================= */

function mergeRecognitionText(
  base,
  addition
) {

  base =
  String(base || "")
  .replace(
    /\s+/g,
    " "
  )
  .trim();

  addition =
  String(addition || "")
  .replace(
    /\s+/g,
    " "
  )
  .trim();

  if (!base) {
    return addition;
  }

  if (!addition) {
    return base;
  }


  const nBase =
  normalize(base);

  const nAddition =
  normalize(addition);


  /*
    完全に同じ
  */

  if (
    nBase ===
    nAddition
  ) {

    return base;

  }


  /*
    新しい文字列が既存文字列に
    完全に含まれている
  */

  if (
    nBase.includes(
      nAddition
    )
  ) {

    return base;

  }


  /*
    新しい結果が、
    既存全文を含んだより長い結果
  */

  if (
    nAddition.includes(
      nBase
    )
  ) {

    return addition;

  }


  const baseWords =
  base.split(/\s+/);

  const addWords =
  addition.split(/\s+/);

  const normalizedBaseWords =
  baseWords.map(
    word =>
    normalize(word)
  );

  const normalizedAddWords =
  addWords.map(
    word =>
    normalize(word)
  );

  const maxOverlap =
  Math.min(
    baseWords.length,
    addWords.length
  );


  /*
    既存末尾と新しい結果の先頭が
    重なる場合は1回だけ残す
  */

  for (
    let overlap =
    maxOverlap;
    overlap >= 1;
    overlap--
  ) {

    let same = true;

    for (
      let i = 0;
      i < overlap;
      i++
    ) {

      const baseIndex =
      normalizedBaseWords.length -
      overlap +
      i;

      if (
        normalizedBaseWords[baseIndex] !==
        normalizedAddWords[i]
      ) {

        same = false;

        break;

      }

    }

    if (same) {

      return [
        ...baseWords,
        ...addWords.slice(
          overlap
        )
      ].join(" ");

    }

  }


  return (
    base +
    " " +
    addition
  )
  .replace(
    /\s+/g,
    " "
  )
  .trim();

}


/* =========================================================
   PC用 現在のRecognition結果
========================================================= */

function buildCurrentRecognitionText(results) {

  const parts = [];

  for (
    let i = 0;
    i < results.length;
    i++
  ) {

    const text =
    String(
      results[i][0].transcript || ""
    )
    .replace(
      /\s+/g,
      " "
    )
    .trim();

    if (!text) {
      continue;
    }

    const previous =
    parts.length
    ?
    normalize(
      parts[
        parts.length - 1
      ]
    )
    :
    "";

    if (
      normalize(text) ===
      previous
    ) {

      continue;

    }

    parts.push(
      text
    );

  }

  return parts
  .join(" ")
  .replace(
    /\s+/g,
    " "
  )
  .trim();

}


/* =========================================================
   練習時間
========================================================= */

function calculatePracticeTime(
  wordCount
) {

  if (
    wordCount <= 8
  ) {

    return 4000;

  }

  if (
    wordCount <= 14
  ) {

    return 5000;

  }

  if (
    wordCount <= 20
  ) {

    return 6500;

  }

  return 8000;

}


/* =========================================================
   語数
========================================================= */

function countWords(text) {

  return String(
    text || ""
  )
  .trim()
  .split(/\s+/)
  .filter(Boolean)
  .length;

}

========================================================= */

function stopRecognition() {

  clearTimeout(
    speechEndTimer
  );

  if (!recognition) {
    return;
  }

  recognition.onend =
  null;

  recognition.onerror =
  null;

  try {

    recognition.stop();

  } catch (e) {}

  recognition =
  null;

}

========================================================= */

function enablePauseButton() {

  const button =
  document.getElementById(

  if (

    synth &&

  }

function disablePauseButton() {

  const button =
  document.getElementById(
    "practicePauseButton"
  );

  if (button) {

    button.disabled =
    true;

    button.textContent =
    "一時停止";

  }

}


function toggleSpeechPause(button) {

  if (
    !synth ||
    !synth.speaking

    return;

  }

  if (!isSpeechPaused) {

    synth.pause();

    isSpeechPaused =
    true;

    button.textContent =
    "再開";

  } else {

    synth.resume();

    isSpeechPaused =
    false;

    button.textContent =
    "一時停止";

  }

}

   Transcript reset
========================================================= */

function resetTranscript() {

========================================================= */

/* =========================================================
   採点
========================================================= */

function showScore(score) {

  if (
    score >= PASS_SCORE
  ) {

    judgmentDisplay.innerHTML =
    `<span class="pass">合格　${score}点</span>`;

  } else {

    judgmentDisplay.innerHTML =
    `<span class="retry">再挑戦　${score}点</span>`;

  }

}


/* =========================================================
   類似度
========================================================= */

function calculateSimilarity(
  spoken,
  target
) {

  const a =
  normalize(spoken)
  .split(" ")
  .filter(Boolean);

  const b =
  normalize(target)
  .split(" ")
  .filter(Boolean);

  if (
    !a.length ||
    !b.length
  ) {

    return 0;

  }

  const distance =
  levenshteinWords(
    a,
    b
  );

  const length =
  Math.max(
    a.length,
    b.length
  );

  return Math.round(
    Math.max(
      0,
      1 -
      distance /
      length
    ) *
    100
  );

}


/* =========================================================
   正規化
========================================================= */

function normalize(text) {

  return String(
    text || ""
  )
  .toLowerCase()
  .replace(
    /[’']/g,
    ""
  )
  .replace(
    /[^a-z0-9\s]/g,
    " "
  )
  .replace(
    /\s+/g,
    " "
  )
  .trim();

}


/* =========================================================
   Levenshtein
========================================================= */

function levenshteinWords(
  a,
  b
) {

  const matrix =
  Array.from(
    {
      length:
      a.length + 1
    },
    () =>
    new Array(
      b.length + 1
    ).fill(0)
  );

  for (
    let i = 0;
    i <= a.length;
    i++
  ) {

    matrix[i][0] =
    i;

  }

  for (
    let j = 0;
    j <= b.length;
    j++
  ) {

    matrix[0][j] =
    j;

  }

  for (
    let i = 1;
    i <= a.length;
    i++
  ) {

    for (
      let j = 1;
      j <= b.length;
      j++
    ) {

      const cost =
      a[i - 1] ===
      b[j - 1]
      ?
      0
      :
      1;

      matrix[i][j] =
      Math.min(

        matrix[i - 1][j] + 1,

        matrix[i][j - 1] + 1,

        matrix[i - 1][j - 1] +
        cost

      );

    }

  }

  return matrix[
    a.length
  ][
    b.length
  ];

}

function isMobileLayout() {

);


/* =========================================================
   HTML escape
========================================================= */

function escapeHtml(text) {

  return String(text)
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


/* =========================================================
   録音
========================================================= */

recordButton.onclick =
async () => {

  if (
    mediaRecorder &&
    mediaRecorder.state ===
    "recording"
  ) {

    return;

  }

  try {

    recordStream =
    await navigator.mediaDevices
    .getUserMedia(
      {
        audio: true
      }
    );

    recordedChunks = [];

    mediaRecorder =
    new MediaRecorder(
      recordStream
    );

    mediaRecorder.ondataavailable =
    event => {

      if (
        event.data &&
        event.data.size > 0
      ) {

        recordedChunks.push(
          event.data
        );

      }

    };

    mediaRecorder.onstop =
    () => {

      const blob =
      new Blob(
        recordedChunks,
        {
          type:
          mediaRecorder.mimeType ||
          "audio/webm"
        }
      );

      if (recordedUrl) {

        URL.revokeObjectURL(
          recordedUrl
        );

      }

      recordedUrl =
      URL.createObjectURL(
        blob
      );

      recordPlayback.innerHTML =
      "";

      const audio =
      document.createElement(
        "audio"
      );

      audio.controls =
      true;

      audio.src =
      recordedUrl;

      recordPlayback.appendChild(
        audio
      );

      if (recordStream) {

        recordStream
        .getTracks()
        .forEach(
          track =>
          track.stop()
        );

        recordStream =
        null;

      }

    };

    mediaRecorder.start();

    recordStatus.textContent =
    "● Recording";

    recordButton.disabled =
    true;

    stopRecordButton.disabled =
    false;

  } catch (e) {

    recordStatus.textContent =
    "マイクを使用できません。";

  }

};


stopRecordButton.onclick =
() => {

  if (
    mediaRecorder &&
    mediaRecorder.state !==
    "inactive"
  ) {

    mediaRecorder.stop();

  }

  recordStatus.textContent =
  "";

  recordButton.disabled =
  false;

  stopRecordButton.disabled =
  true;

};
