<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Favorites 練習</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f6f6f6;
  color: #111;
}

.app {
  max-width: 900px;
  min-height: 100vh;
  margin: 0 auto;
  padding: 35px 42px 70px;
  background: white;
}

h1 {
  margin: 0 0 30px;
  font-size: 32px;
}

.question {
  margin-bottom: 15px;
  font-size: 29px;
  font-weight: bold;
  line-height: 1.5;
}

button {
  font-family: inherit;
  cursor: pointer;
}

.button {
  padding: 10px 16px;
  margin: 4px 5px 4px 0;
  font-size: 16px;
  border: 1px solid #999;
  border-radius: 6px;
  background: white;
}

.button.primary {
  background: #111;
  color: white;
  border-color: #111;
}

.button.record {
  background: #b00020;
  color: white;
  border-color: #b00020;
}

.button:disabled {
  opacity: 0.4;
  cursor: default;
}

.record-controls {
  margin: 8px 0 12px;
}

#recordStatus {
  margin-left: 8px;
  font-weight: bold;
  color: #b00020;
}

#recordPlayback {
  margin-top: 10px;
}

#recordPlayback audio {
  width: 100%;
  max-width: 520px;
}

#transcriptSection {
  margin: 20px 0 18px;
}

.transcript-header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 15px;
  margin-bottom: 7px;
}

.transcript-title {
  font-size: 19px;
  font-weight: bold;
}

#judgment {
  font-size: 21px;
  font-weight: bold;
  white-space: nowrap;
}

#transcript {
  min-height: 85px;
  padding: 15px;
  background: #f3f3f3;
  border-radius: 8px;
  font-size: 19px;
  line-height: 1.6;
}

.pass {
  color: #16803a;
}

.retry {
  color: #c00000;
}

.step-title {
  margin: 22px 0 13px;
  font-size: 21px;
  font-weight: bold;
}

.step-tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-bottom: 18px;
}

.step-button {
  padding: 11px 14px;
  font-size: 15px;
  border: 1px solid #bbb;
  border-radius: 7px;
  background: white;
}

.step-button.active {
  background: #111;
  color: white;
  border-color: #111;
}

#stepDescription {
  margin: 0 0 7px;
  font-size: 18px;
  font-weight: bold;
}

#step1Instruction {
  display: none;
  align-items: center;
  flex-wrap: wrap;
  gap: 14px;
  margin: 0 0 10px;
  font-size: 16px;
  color: #c00000;
}

#step1Cue {
  font-size: 19px;
  font-weight: bold;
  color: #c00000;
}

#step24Area {
  display: none;
  margin: 0 0 10px;
}

#step24Cue {
  min-height: 24px;
  margin: 0 0 4px;
  font-size: 19px;
  font-weight: bold;
  color: #c00000;
}

#step24Notice {
  font-size: 16px;
}

#step24Result {
  margin-top: 7px;
  font-size: 21px;
  font-weight: bold;
}

#repeatInstruction {
  display: none;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  margin: 0 0 10px;
  font-size: 16px;
  color: #c00000;
}

#repeatCue {
  font-size: 22px;
  font-weight: bold;
  color: #c00000;
}

.blink {
  animation: repeatBlink 0.7s infinite;
}

@keyframes repeatBlink {
  0%, 45% {
    opacity: 1;
  }

  50%, 95% {
    opacity: 0.2;
  }

  100% {
    opacity: 1;
  }
}

#hintBox {
  min-height: 75px;
  margin-bottom: 16px;
  padding: 20px;
  background: #f3f3f3;
  border-radius: 9px;
  font-size: 20px;
  line-height: 1.8;
}

.no-hint {
  text-align: center;
  color: #777;
}

.sentence-card {
  margin-bottom: 14px;
  padding: 18px 20px;
  background: #f3f3f3;
  border-radius: 9px;
}

.sentence-text {
  margin-bottom: 9px;
  font-size: 20px;
  line-height: 1.6;
}

#practiceControls {
  margin-top: 12px;
}

#loading {
  min-height: 0;
  margin-top: 8px;
  color: #777;
}

@media (max-width: 600px) {
  .app {
    padding: 22px 16px 50px;
  }

  h1 {
    font-size: 27px;
  }

  .question {
    font-size: 24px;
  }

  .step-button {
    font-size: 14px;
  }

  #transcript,
  #hintBox {
    font-size: 18px;
  }
}
</style>
</head>

<body>

<div class="app">

  <h1>Favorites 練習</h1>

  <div class="question">
    Q1. What's your favorite season?
  </div>

  <button id="questionAudioButton" class="button">
    ▶ 質問を聞く
  </button>

  <div class="record-controls">

    <button id="recordButton" class="button record">
      ● 録音
    </button>

    <button id="stopRecordButton" class="button" disabled>
      ■ 停止
    </button>

    <span id="recordStatus"></span>

    <div id="recordPlayback"></div>

  </div>

  <div id="transcriptSection">

    <div class="transcript-header">

      <div class="transcript-title">
        文字起こし
      </div>

      <div id="judgment"></div>

    </div>

    <div id="transcript">
      リピートした英文がここに表示されます。
    </div>

  </div>

  <div class="step-title">
    練習ステップ
  </div>

  <div class="step-tabs">

    <button class="step-button active" data-step="1">Step 1</button>
    <button class="step-button" data-step="2">Step 2</button>
    <button class="step-button" data-step="3">Step 3</button>
    <button class="step-button" data-step="4">Step 4</button>
    <button class="step-button" data-step="5">Step 5</button>
    <button class="step-button" data-step="6">Step 6</button>
    <button class="step-button" data-step="7">Step 7</button>

  </div>

  <div id="stepDescription"></div>

  <div id="step1Instruction">
    <span>音声が終わってからリピートしてください。</span>
    <span id="step1Cue"></span>
  </div>

  <div id="step24Area">

    <div id="step24Cue"></div>

    <div id="step24Notice">
      このステップでは文字起こしを表示せず、話した量で判定します。
    </div>

    <div id="step24Result"></div>

  </div>

  <div id="repeatInstruction">
    <span>「Repeat」が表示されてから話してください。</span>
    <span id="repeatCue"></span>
  </div>

  <div id="hintBox"></div>

  <div id="step1Area"></div>

  <div id="practiceControls"></div>

  <div id="loading">
    音声を読み込んでいます…
  </div>

</div>

<script>

const QUESTION = {
  questionAudio: "fav01.mp3",
  answerAudio: "yasmin_fav01.mp3",

  sentences: [
    "My favorite season is summer.",
    "I hate cold weather.",
    "Summers here are humid and tough, but I still prefer summer."
  ],

  hintMany:
    "favorite season / summer / hate cold weather / humid / tough / still prefer summer",

  hintFew:
    "summer / cold / humid / prefer summer"
};


const PASS_SCORE = 90;

const FINAL_SENTENCE_GRACE_MS =
  2000;

const AMOUNT_PASS_RATIO =
  0.60;

/* 最後の認識から1.2秒無音なら発話終了と判断 */
const SPEECH_END_SILENCE_MS =
  1200;

/* 発話終了から0.5秒後にRepeatを消す */
const CUE_CLEAR_DELAY_MS =
  500;

const MIN_SILENCE_SECONDS =
  0.25;

const SILENCE_THRESHOLD =
  0.02;


/* DOM */

const questionAudioButton =
  document.getElementById("questionAudioButton");

const recordButton =
  document.getElementById("recordButton");

const stopRecordButton =
  document.getElementById("stopRecordButton");

const recordStatus =
  document.getElementById("recordStatus");

const recordPlayback =
  document.getElementById("recordPlayback");

const transcriptSection =
  document.getElementById("transcriptSection");

const transcriptDisplay =
  document.getElementById("transcript");

const judgmentDisplay =
  document.getElementById("judgment");

const stepDescription =
  document.getElementById("stepDescription");

const step1Instruction =
  document.getElementById("step1Instruction");

const step1Cue =
  document.getElementById("step1Cue");

const step24Area =
  document.getElementById("step24Area");

const step24Cue =
  document.getElementById("step24Cue");

const step24Result =
  document.getElementById("step24Result");

const repeatInstruction =
  document.getElementById("repeatInstruction");

const repeatCue =
  document.getElementById("repeatCue");

const hintBox =
  document.getElementById("hintBox");

const step1Area =
  document.getElementById("step1Area");

const practiceControls =
  document.getElementById("practiceControls");

const loadingDisplay =
  document.getElementById("loading");

const stepButtons =
  document.querySelectorAll(".step-button");


/* 基本 */

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

const questionPlayer =
  new Audio(QUESTION.questionAudio);

const answerPlayer =
  new Audio(QUESTION.answerAudio);

let segments = [];

let currentStep = 1;
let currentSegment = 0;

let practiceRunning = false;

let segmentEndTime = 0;
let animationId = null;

let isPaused = false;

let recognition = null;
let recognitionText = "";

let step24PassedCount = 0;

let speechEndTimer = null;
let cueClearTimer = null;


/* 録音 */

let recordStream = null;
let mediaRecorder = null;
let recordedChunks = [];
let recordedUrl = null;


/* 初期化 */

renderStep();
prepareSegments();


/* Cue */

function setCue(element, text, blink = false) {

  element.textContent = text;

  element.classList.toggle(
    "blink",
    blink
  );
}


function finishCue(element) {

  element.classList.remove("blink");

  clearTimeout(cueClearTimer);

  cueClearTimer =
    setTimeout(() => {

      element.textContent = "";

    }, CUE_CLEAR_DELAY_MS);
}


/* 質問音声 */

questionAudioButton.onclick = () => {

  stopAllPractice();

  questionPlayer.currentTime = 0;
  questionPlayer.play();
};


/* Step切替 */

stepButtons.forEach(button => {

  button.onclick = () => {

    stopAllPractice();

    currentStep =
      Number(button.dataset.step);

    stepButtons.forEach(btn => {

      btn.classList.toggle(
        "active",
        btn === button
      );
    });

    resetTranscript();
    renderStep();
  };
});


/* Step表示 */

function renderStep() {

  step1Area.innerHTML = "";
  practiceControls.innerHTML = "";
  hintBox.innerHTML = "";

  step1Cue.textContent = "";
  step24Cue.textContent = "";
  step24Result.textContent = "";
  repeatCue.textContent = "";

  step1Cue.classList.remove("blink");
  step24Cue.classList.remove("blink");
  repeatCue.classList.remove("blink");

  step1Instruction.style.display = "none";
  step24Area.style.display = "none";
  repeatInstruction.style.display = "none";

  transcriptSection.style.display = "block";


  if (currentStep === 1) {

    stepDescription.textContent =
      "1センテンスずつリピート";

    step1Instruction.style.display =
      "flex";

    hintBox.style.display =
      "none";

    QUESTION.sentences.forEach(
      (sentence, index) => {

        const card =
          document.createElement("div");

        card.className =
          "sentence-card";

        const text =
          document.createElement("div");

        text.className =
          "sentence-text";

        text.textContent =
          `${index + 1}. ${sentence}`;

        const listen =
          document.createElement("button");

        listen.className =
          "button";

        listen.textContent =
          "▶ リッスン＆リピート";

        listen.disabled =
          segments.length === 0;

        listen.onclick =
          () => playStep1(index);

        const speak =
          document.createElement("button");

        speak.className =
          "button";

        speak.textContent =
          "🎤 発話のみ練習";

        speak.onclick =
          () =>
            startStep1SpeakOnly(
              index
            );

        card.appendChild(text);
        card.appendChild(listen);
        card.appendChild(speak);

        step1Area.appendChild(card);
      }
    );

    return;
  }


  hintBox.style.display =
    "block";


  if (currentStep === 2) {

    transcriptSection.style.display =
      "none";

    step24Area.style.display =
      "block";

    stepDescription.textContent =
      "全文を見ながら、1センテンスずつリッスン＆リピート";

    hintBox.innerHTML =
      QUESTION.sentences.join("<br>");

    createPracticeButtons(
      "▶ リッスン＆リピート"
    );

    return;
  }


  if (currentStep === 3) {

    transcriptSection.style.display =
      "none";

    step24Area.style.display =
      "block";

    stepDescription.textContent =
      "ヒントを見ながら、1センテンスずつリッスン＆リピート";

    hintBox.textContent =
      QUESTION.hintFew;

    createPracticeButtons(
      "▶ リッスン＆リピート"
    );

    return;
  }


  if (currentStep === 4) {

    transcriptSection.style.display =
      "none";

    step24Area.style.display =
      "block";

    stepDescription.textContent =
      "ヒントなしで、1センテンスずつリッスン＆リピート";

    hintBox.innerHTML =
      '<div class="no-hint">ヒントなし</div>';

    createPracticeButtons(
      "▶ リッスン＆リピート"
    );

    return;
  }


  if (currentStep === 5) {

    repeatInstruction.style.display =
      "flex";

    stepDescription.textContent =
      "全文を聞いてから、ヒントを見ながらまとめてリピート";

    hintBox.textContent =
      QUESTION.hintMany;

    createPracticeButtons(
      "▶ 全文を聞く"
    );

    return;
  }


  if (currentStep === 6) {

    repeatInstruction.style.display =
      "flex";

    stepDescription.textContent =
      "全文を聞いてから、ヒントを見ながらまとめてリピート";

    hintBox.textContent =
      QUESTION.hintFew;

    createPracticeButtons(
      "▶ 全文を聞く"
    );

    return;
  }


  if (currentStep === 7) {

    repeatInstruction.style.display =
      "flex";

    stepDescription.textContent =
      "全文を聞いてから、ヒントなしでまとめてリピート";

    hintBox.innerHTML =
      '<div class="no-hint">ヒントなし</div>';

    createPracticeButtons(
      "▶ 全文を聞く"
    );
  }
}


/* Step2〜7 ボタン */

function createPracticeButtons(label) {

  const listen =
    document.createElement("button");

  listen.className =
    "button primary";

  listen.textContent =
    label;

  listen.disabled =
    segments.length === 0;

  listen.onclick =
    () => {

      if (
        currentStep >= 2 &&
        currentStep <= 4
      ) {

        startStep2to4();

      } else {

        startStep5to7();
      }
    };

  practiceControls.appendChild(
    listen
  );


  const speak =
    document.createElement("button");

  speak.className =
    "button";

  speak.textContent =
    "🎤 発話のみ練習";

  speak.onclick =
    startSpeakOnlyWhole;

  practiceControls.appendChild(
    speak
  );


  const pause =
    document.createElement("button");

  pause.id =
    "practicePauseButton";

  pause.className =
    "button";

  pause.textContent =
    "一時停止";

  pause.disabled =
    true;

  pause.onclick =
    () => togglePause(pause);

  practiceControls.appendChild(
    pause
  );
}


/* Step1 */

function playStep1(index) {

  stopAllPractice();
  resetTranscript();

  setCue(
    step1Cue,
    `Sentence${index + 1}　Listen`,
    false
  );

  playSegment(
    index,
    () => {

      setCue(
        step1Cue,
        `Sentence${index + 1}　Repeat`,
        true
      );

      startSimpleRecognition(
        QUESTION.sentences[index],
        step1Cue
      );
    }
  );
}


function startStep1SpeakOnly(index) {

  stopAllPractice();
  resetTranscript();

  step1Cue.textContent = "";

  startSimpleRecognition(
    QUESTION.sentences[index],
    null
  );
}


/* Step1 Recognition */

function startSimpleRecognition(
  target,
  cueElement
) {

  stopRecognition();

  if (!SpeechRecognition) {

    transcriptDisplay.textContent =
      "このブラウザでは文字起こしを利用できません。";

    return;
  }

  const r =
    new SpeechRecognition();

  recognition = r;
  recognitionText = "";

  r.lang = "en-US";
  r.continuous = true;
  r.interimResults = true;

  let hasSpeech = false;
  let finished = false;


  const finish = () => {

    if (
      finished ||
      !hasSpeech
    ) {
      return;
    }

    finished = true;

    clearTimeout(
      speechEndTimer
    );

    r.onend = null;

    if (
      recognition === r
    ) {

      try {
        r.stop();
      } catch (e) {}

      recognition = null;
    }

    if (
      recognitionText
    ) {

      showScore(
        calculateSimilarity(
          recognitionText,
          target
        )
      );
    }

    if (
      cueElement
    ) {

      finishCue(
        cueElement
      );
    }
  };


  r.onresult =
    event => {

      recognitionText =
        buildRecognitionText(
          event.results
        );

      transcriptDisplay.textContent =
        recognitionText;

      if (
        recognitionText
      ) {

        hasSpeech = true;

        clearTimeout(
          speechEndTimer
        );

        speechEndTimer =
          setTimeout(
            finish,
            SPEECH_END_SILENCE_MS
          );
      }
    };


  r.onend =
    () => {

      if (
        recognition === r
      ) {
        recognition = null;
      }

      if (
        hasSpeech
      ) {
        finish();
      }
    };


  try {
    r.start();
  } catch (e) {}
}


/* Step2〜4 */

function startStep2to4() {

  stopAllPractice();

  practiceRunning = true;
  currentSegment = 0;
  step24PassedCount = 0;

  step24Result.textContent = "";

  playNextStep2to4();
}


function playNextStep2to4() {

  if (
    !practiceRunning ||
    currentSegment >=
      QUESTION.sentences.length
  ) {

    finishStep2to4();
    return;
  }

  const index =
    currentSegment;

  setCue(
    step24Cue,
    `Sentence${index + 1}　Listen`,
    false
  );

  playSegmentCore(
    index,
    () => {

      if (
        !practiceRunning
      ) {
        return;
      }

      startAmountRecognition(
        QUESTION.sentences[index],
        index,
        result => {

          if (
            result
          ) {
            step24PassedCount++;
          }

          currentSegment++;

          if (
            currentSegment <
            QUESTION.sentences.length
          ) {

            playNextStep2to4();

          } else {

            finishStep2to4();
          }
        }
      );
    }
  );
}


function startAmountRecognition(
  targetSentence,
  index,
  onDone
) {

  stopRecognition();

  if (
    !SpeechRecognition
  ) {

    step24Result.innerHTML =
      '<span class="retry">判定機能を利用できません。</span>';

    onDone(false);
    return;
  }

  const r =
    new SpeechRecognition();

  recognition = r;

  r.lang = "en-US";
  r.continuous = true;
  r.interimResults = true;

  let maxWords = 0;
  let finished = false;
  let localTimer = null;

  const targetWordCount =
    countWords(
      targetSentence
    );

  const requiredWords =
    Math.max(
      1,
      Math.ceil(
        targetWordCount *
        AMOUNT_PASS_RATIO
      )
    );

  const repeatMs =
    calculateRepeatPause(
      targetWordCount
    ) +
    (
      index ===
      QUESTION.sentences.length - 1
        ? FINAL_SENTENCE_GRACE_MS
        : 0
    );


  const finish = () => {

    if (
      finished
    ) {
      return;
    }

    finished = true;

    clearTimeout(
      localTimer
    );

    r.onend = null;

    if (
      recognition === r
    ) {

      try {
        r.stop();
      } catch (e) {}

      recognition = null;
    }

    step24Cue.classList.remove(
      "blink"
    );

    const passed =
      maxWords >=
      requiredWords;

    onDone(
      passed
    );
  };


  r.onstart =
    () => {

      if (
        !practiceRunning ||
        recognition !== r
      ) {
        return;
      }

      setCue(
        step24Cue,
        `Sentence${index + 1}　Repeat`,
        true
      );

      localTimer =
        setTimeout(
          finish,
          repeatMs
        );
    };


  r.onresult =
    event => {

      const text =
        buildRecognitionText(
          event.results
        );

      const words =
        countRecognizedWords(
          text
        );

      if (
        words >
        maxWords
      ) {
        maxWords =
          words;
      }
    };


  r.onend =
    () => {

      if (
        recognition === r
      ) {
        recognition =
          null;
      }

      finish();
    };


  try {

    r.start();

  } catch (e) {

    finish();
  }
}


function finishStep2to4() {

  practiceRunning =
    false;

  step24Cue.classList.remove(
    "blink"
  );

  const total =
    QUESTION.sentences.length;

  const score =
    Math.round(
      (
        step24PassedCount /
        total
      ) *
      100
    );

  if (
    step24PassedCount ===
    total
  ) {

    step24Result.innerHTML =
      '<span class="pass">合格　' +
      score +
      '点</span>';

  } else {

    step24Result.innerHTML =
      '<span class="retry">再挑戦　' +
      score +
      '点</span>';
  }

  finishCue(
    step24Cue
  );
}


function countRecognizedWords(text) {

  const normalized =
    normalize(text);

  if (
    !normalized
  ) {
    return 0;
  }

  return normalized
    .split(" ")
    .filter(Boolean)
    .length;
}


/* Step5〜7 */

function startStep5to7() {

  stopAllPractice();
  resetTranscript();

  practiceRunning = true;

  repeatCue.textContent = "";

  repeatCue.classList.remove(
    "blink"
  );

  answerPlayer.currentTime =
    0;

  answerPlayer.onended =
    () => {

      answerPlayer.onended =
        null;

      if (
        !practiceRunning
      ) {
        return;
      }

      startWholeRecognitionWhenReady(
        QUESTION.sentences.join(" ")
      );
    };

  answerPlayer.play();
}


/* Step5〜7 Recognition */

function startWholeRecognitionWhenReady(
  target
) {

  stopRecognition();

  if (
    !SpeechRecognition
  ) {

    transcriptDisplay.textContent =
      "このブラウザでは文字起こしを利用できません。";

    return;
  }

  const r =
    new SpeechRecognition();

  recognition = r;
  recognitionText = "";

  r.lang = "en-US";
  r.continuous = true;
  r.interimResults = true;

  let hasSpeech = false;
  let finished = false;


  const finish = () => {

    if (
      finished ||
      !hasSpeech
    ) {
      return;
    }

    finished = true;

    clearTimeout(
      speechEndTimer
    );

    r.onend = null;

    if (
      recognition === r
    ) {

      try {
        r.stop();
      } catch (e) {}

      recognition = null;
    }

    if (
      recognitionText
    ) {

      showScore(
        calculateSimilarity(
          recognitionText,
          target
        )
      );
    }

    finishCue(
      repeatCue
    );
  };


  r.onstart =
    () => {

      if (
        recognition === r &&
        practiceRunning
      ) {

        setCue(
          repeatCue,
          "Repeat",
          true
        );
      }
    };


  r.onresult =
    event => {

      recognitionText =
        buildRecognitionText(
          event.results
        );

      transcriptDisplay.textContent =
        recognitionText;

      if (
        recognitionText
      ) {

        hasSpeech = true;

        clearTimeout(
          speechEndTimer
        );

        speechEndTimer =
          setTimeout(
            finish,
            SPEECH_END_SILENCE_MS
          );
      }
    };


  r.onend =
    () => {

      if (
        recognition === r
      ) {
        recognition =
          null;
      }

      if (
        hasSpeech
      ) {
        finish();
      }
    };


  try {
    r.start();
  } catch (e) {}
}


/* 発話のみ */

function startSpeakOnlyWhole() {

  stopAllPractice();
  resetTranscript();

  startSimpleRecognition(
    QUESTION.sentences.join(" "),
    null
  );
}


/* Recognition表示 */

function buildRecognitionText(
  results
) {

  let text = "";

  for (
    let i = 0;
    i < results.length;
    i++
  ) {

    text +=
      results[i][0]
        .transcript +
      " ";
  }

  return text
    .replace(
      /\s+/g,
      " "
    )
    .trim();
}


/* Recognition停止 */

function stopRecognition() {

  clearTimeout(
    speechEndTimer
  );

  if (
    !recognition
  ) {
    return;
  }

  recognition.onend =
    null;

  try {
    recognition.stop();
  } catch (e) {}

  recognition =
    null;
}


/* センテンス音声 */

function playSegment(
  index,
  callback
) {

  stopRecognition();

  playSegmentCore(
    index,
    callback
  );
}


function playSegmentCore(
  index,
  callback
) {

  if (
    !segments[index]
  ) {
    return;
  }

  cancelAnimationFrame(
    animationId
  );

  const segment =
    segments[index];

  answerPlayer.onended =
    null;

  answerPlayer.currentTime =
    segment.start;

  segmentEndTime =
    segment.end;

  answerPlayer._callback =
    callback;

  isPaused =
    false;

  answerPlayer.play();

  enablePauseButton();

  monitorSegment();
}


function monitorSegment() {

  cancelAnimationFrame(
    animationId
  );

  const monitor = () => {

    if (
      answerPlayer.currentTime >=
      segmentEndTime -
      0.03
    ) {

      answerPlayer.pause();

      disablePauseButton();

      const callback =
        answerPlayer._callback;

      answerPlayer._callback =
        null;

      if (
        callback
      ) {
        callback();
      }

      return;
    }

    if (
      !answerPlayer.paused &&
      !isPaused
    ) {

      animationId =
        requestAnimationFrame(
          monitor
        );
    }
  };

  animationId =
    requestAnimationFrame(
      monitor
    );
}


/* Repeat時間 */

function calculateRepeatPause(
  wordCount
) {

  if (
    wordCount <= 8
  ) {
    return 3000;
  }

  if (
    wordCount <= 14
  ) {
    return 4000;
  }

  if (
    wordCount <= 20
  ) {
    return 5000;
  }

  return 6000;
}


function countWords(text) {

  return String(
    text || ""
  )
    .trim()
    .split(/\s+/)
    .filter(Boolean)
    .length;
}


/* 一時停止 */

function enablePauseButton() {

  const button =

    );

  if (

  ) {

}


function disablePauseButton() {

    button.textContent =

function togglePause(button) {

  if (
    !isPaused
  ) {

    isPaused =

    answerPlayer.pause();

    cancelAnimationFrame(
      animationId
    );

    button.textContent =

}

/* 文字起こしリセット */

function resetTranscript() {

/* 採点 */

function showScore(score) {

  if (
    score >=
    PASS_SCORE
  ) {

    judgmentDisplay.innerHTML =
      '<span class="pass">合格　' +
      score +
      '点</span>';

  } else {

    judgmentDisplay.innerHTML =
      '<span class="retry">再挑戦　' +
      score +
      '点</span>';
  }
}


function calculateSimilarity(
  spoken,
  target
) {

  const a =
    normalize(spoken)
      .split(" ")
      .filter(Boolean);

  const b =
    normalize(target)
      .split(" ")
      .filter(Boolean);

  if (
    !a.length ||
    !b.length
  ) {
    return 0;
  }

  const distance =
    levenshteinWords(
      a,
      b
    );

  const length =
    Math.max(
      a.length,
      b.length
    );

  return Math.round(
    Math.max(
      0,
      1 -
      distance /
      length
    ) *
    100
  );
}


function normalize(text) {

  return String(
    text || ""
  )
    .toLowerCase()
    .replace(
      /[’']/g,
      ""
    )
    .replace(
      /[^a-z0-9\s]/g,
      " "
    )
    .replace(
      /\s+/g,
      " "
    )
    .trim();
}


function levenshteinWords(
  a,
  b
) {

  const matrix =
    Array.from(
      {
        length:
          a.length + 1
      },
      () =>
        new Array(
          b.length + 1
        ).fill(0)
    );

  for (
    let i = 0;
    i <= a.length;
    i++
  ) {
    matrix[i][0] = i;
  }

  for (
    let j = 0;
    j <= b.length;
    j++
  ) {
    matrix[0][j] = j;
  }

  for (
    let i = 1;
    i <= a.length;
    i++
  ) {

    for (
      let j = 1;
      j <= b.length;
      j++
    ) {

      const cost =
        a[i - 1] ===
        b[j - 1]
          ? 0
          : 1;

      matrix[i][j] =
        Math.min(
          matrix[i - 1][j] + 1,
          matrix[i][j - 1] + 1,
          matrix[i - 1][j - 1] +
          cost
        );
    }
  }

  return matrix[
    a.length
  ][
    b.length
  ];
}


/* 任意録音 */

recordButton.onclick =
  async () => {

    if (
      mediaRecorder &&
      mediaRecorder.state ===
        "recording"
    ) {
      return;
    }

    try {

      recordStream =
        await navigator.mediaDevices
          .getUserMedia({
            audio: true
          });

      recordedChunks = [];

      mediaRecorder =
        new MediaRecorder(
          recordStream
        );

      mediaRecorder.ondataavailable =
        event => {

          if (
            event.data &&
            event.data.size > 0
          ) {

            recordedChunks.push(
              event.data
            );
          }
        };

      mediaRecorder.onstop =
        () => {

          const blob =
            new Blob(
              recordedChunks,
              {
                type:
                  mediaRecorder.mimeType ||
                  "audio/webm"
              }
            );

          if (
            recordedUrl
          ) {

            URL.revokeObjectURL(
              recordedUrl
            );
          }

          recordedUrl =
            URL.createObjectURL(
              blob
            );

          recordPlayback.innerHTML =
            "";

          const audio =
            document.createElement(
              "audio"
            );

          audio.controls =
            true;

          audio.src =
            recordedUrl;

          recordPlayback.appendChild(
            audio
          );

          if (
            recordStream
          ) {

            recordStream
              .getTracks()
              .forEach(
                track =>
                  track.stop()
              );

            recordStream =
              null;
          }
        };

      mediaRecorder.start();

      recordStatus.textContent =
        "● Recording";

      recordButton.disabled =
        true;

      stopRecordButton.disabled =
        false;

    } catch (e) {

      recordStatus.textContent =
        "マイクを使用できません。";
    }
  };


stopRecordButton.onclick =
  () => {

    if (
      mediaRecorder &&
      mediaRecorder.state !==
        "inactive"
    ) {

      mediaRecorder.stop();
    }

    recordStatus.textContent =
      "";

    recordButton.disabled =
      false;

    stopRecordButton.disabled =
      true;
  };


/* 音声自動分割 */

async function prepareSegments() {

  try {

    segments =
      await detectSentenceSegments(
        QUESTION.answerAudio,
        QUESTION.sentences.length
      );

    loadingDisplay.textContent =
      "";

    renderStep();

  } catch (e) {

    console.error(e);

    loadingDisplay.textContent =
      "音声を正しく分割できませんでした。";
  }
}


async function detectSentenceSegments(
  file,
  expectedCount
) {

  const response =
    await fetch(file);

  if (!response.ok) {

    throw new Error(
      "Audio fetch failed"
    );
  }

  const arrayBuffer =
    await response.arrayBuffer();

  const audioContext =
    new AudioContext();

  const audioBuffer =
    await audioContext
      .decodeAudioData(
        arrayBuffer
      );

  const length =
    audioBuffer.length;

  const mono =
    new Float32Array(
      length
    );

  for (
    let channel = 0;
    channel <
      audioBuffer.numberOfChannels;
    channel++
  ) {

    const data =
      audioBuffer
        .getChannelData(
          channel
        );

    for (
      let i = 0;
      i < length;
      i++
    ) {

      mono[i] +=
        data[i] /
        audioBuffer.numberOfChannels;
    }
  }

  const sampleRate =
    audioBuffer.sampleRate;

  const frameSeconds =
    0.02;

  const frameSize =
    Math.floor(
      sampleRate *
      frameSeconds
    );

  const frames = [];

  for (
    let start = 0;
    start < mono.length;
    start += frameSize
  ) {

    const end =
      Math.min(
        start +
        frameSize,
        mono.length
      );

    let sum = 0;

    for (
      let i = start;
      i < end;
      i++
    ) {

      sum +=
        mono[i] *
        mono[i];
    }

    frames.push({

      time:
        start /
        sampleRate,

      rms:
        Math.sqrt(
          sum /
          (end - start)
        )
    });
  }

  const silenceRanges =
    [];

  let silenceStart =
    null;

  for (
    let i = 0;
    i < frames.length;
    i++
  ) {

    const silent =
      frames[i].rms <
      SILENCE_THRESHOLD;

    if (
      silent &&
      silenceStart ===
        null
    ) {

      silenceStart =
        frames[i].time;
    }

    if (
      !silent &&
      silenceStart !==
        null
    ) {

      const silenceEnd =
        frames[i].time;

      if (
        silenceEnd -
        silenceStart >=
        MIN_SILENCE_SECONDS
      ) {

        silenceRanges.push({

          start:
            silenceStart,

          end:
            silenceEnd,

          duration:
            silenceEnd -
            silenceStart
        });
      }

      silenceStart =
        null;
    }
  }

  if (
    silenceStart !==
    null
  ) {

    const silenceEnd =
      audioBuffer.duration;

    if (
      silenceEnd -
      silenceStart >=
      MIN_SILENCE_SECONDS
    ) {

      silenceRanges.push({

        start:
          silenceStart,

        end:
          silenceEnd,

        duration:
          silenceEnd -
          silenceStart
      });
    }
  }

  const internal =
    silenceRanges.filter(
      range =>
        range.start > 0.3 &&
        range.end <
          audioBuffer.duration -
          0.3
    );

  const selected =
    internal
      .sort(
        (a, b) =>
          b.duration -
          a.duration
      )
      .slice(
        0,
        expectedCount - 1
      )
      .sort(
        (a, b) =>
          a.start -
          b.start
      );

  if (
    selected.length !==
    expectedCount - 1
  ) {

    await audioContext.close();

    throw new Error(
      "Sentence split failed"
    );
  }

  let actualStart =
    0;

  let actualEnd =
    audioBuffer.duration;

  for (
    let i = 0;
    i < frames.length;
    i++
  ) {

    if (
      frames[i].rms >=
      SILENCE_THRESHOLD
    ) {

      actualStart =
        Math.max(
          0,
          frames[i].time -
          0.05
        );

      break;
    }
  }

  for (
    let i =
      frames.length - 1;
    i >= 0;
    i--
  ) {

    if (
      frames[i].rms >=
      SILENCE_THRESHOLD
    ) {

      actualEnd =
        Math.min(
          audioBuffer.duration,
          frames[i].time +
          frameSeconds +
          0.08
        );

      break;
    }
  }

  const result =
    [];

  let sentenceStart =
    actualStart;

  selected.forEach(
    gap => {

      result.push({

        start:
          sentenceStart,

        end:
          Math.min(
            actualEnd,
            gap.start +
            0.05
          )
      });

      sentenceStart =
        Math.max(
          0,
          gap.end -
          0.05
        );
    }
  );

  result.push({

    start:
      sentenceStart,

    end:
      actualEnd
  });

  await audioContext.close();

  return result;
}
