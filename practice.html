<head>

<title>英語リピート練習</title>
<style>

der:1px solid #bbb;border-radius:7px;background:#fff}.step-button.active{background:#111;color:#fff;border-color:#111}#stepDescription{margin:0 0 7px;font-size:18px;font-weight:bold}#step1Instruction{display:none;margin:0 0 10px;color:#c00000}.step1-main-line{display:flex;align-items:center;flex-wrap:wrap;gap:14px;font-size:16px}#step1Cue{display:none;font-size:19px;font-weight:bold;color:#c00000}.mobile-step1-cue{display:block;margin:8px 0 3px;min-height:26px;font-size:20px;font-weight:bold;color:#c00000}.cue-note{margin-top:4px;font-size:13px;color:#c00000}.step1-summary{display:none;margin:12px 0 14px;padding:13px 15px;background:#f3f3f3;border-radius:8px;font-size:17px;font-weight:bold;line-height:1.6}.sentence-result{min-height:24px;margin-top:7px;font-size:18px;font-weight:bold}#step24Area{display:none;margin:0 0 10px}#step24Cue{min-height:24px;margin:0 0 5px;font-size:19px;font-weight:bold;color:#c00000}#step24Notice{font-size:16px}#step24Result{margin-top:9px;font-size:19px;font-weight:bold}#repeatInstruction{display:none;margin:0 0 10px;color:#c00000}.repeat-main-line{display:flex;align-items:center;flex-wrap:wrap;gap:10px;font-size:16px}#repeatCue{font-size:22px;font-weight:bold;color:#c00000}.blink{animation:repeatBlink .7s infinite}@keyframes repeatBlink{0%,45%{opacity:1}50%,95%{opacity:.2}100%{opacity:1}}#hintBox{min-height:72px;margin-bottom:16px;padding:18px 20px;background:#f3f3f3;border-radius:9px;font-size:20px;line-height:1.7}.no-hint{text-align:center;color:#777}.sentence-card{margin-bottom:14px;padding:17px 18px;background:#f3f3f3;border-radius:9px}.sentence-card.active-card{outline:2px solid #aaa}.sentence-text{margin-bottom:9px;font-size:20px;line-height:1.55}#practiceControls{margin-top:12px}.whole-practice-result{display:none;margin:12px 0 4px;padding:13px 15px;background:#f3f3f3;border-radius:8px;font-size:18px;font-weight:bold;line-height:1.6}#loading{margin-top:8px;color:#777}#dataError{display:none;margin:10px 0;padding:10px;background:#fff3f3;color:#b00020;border-radius:6px}
@media(max-width:700px){.app{padding:20px 14px 45px}h1{font-size:26px}#practiceGuide{margin-bottom:16px;font-size:14px}.selector-panel{grid-template-columns:1fr;gap:9px;padding:12px}.question{font-size:22px}.button{width:100%;min-height:44px;margin:4px 0;font-size:16px}.step-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.step-button{width:100%;padding:10px 6px;font-size:14px}#transcriptSection{margin:9px 0 4px}#transcript{min-height:62px;padding:11px;font-size:17px}#judgment{font-size:18px}#hintBox{padding:15px;font-size:18px}.sentence-text{font-size:18px}.sentence-card{padding:14px}#stepDescription{font-size:17px}.cue-note{font-size:12px}}
</style>
</head>

<body>
<div class="app">

<h1 id="appTitle">英語リピート練習</h1>

<div id="practiceGuide">
リピート音声の正確さを点数で判定します。80点以上で合格です。なるべく合格点が出てから次のステップへ進みましょう。
</div>

<div class="selector-panel">
  <div>
    <label for="topicSelect">Topic</label>
    <select id="topicSelect"></select>
  </div>

  <div>
    <label for="questionSelect">問題</label>
    <select id="questionSelect"></select>
  </div>
</div>

<div id="dataError"></div>

<div class="question" id="questionDisplay">
データを読み込んでいます...
</div>

<button id="questionAudioButton" class="button" disabled>
▶ 質問を聞く
</button>

<div class="voice-row">
  <label for="voiceSelect">英語音声</label>
  <select id="voiceSelect"></select>
</div>

<div class="record-controls">
  <button id="recordButton" class="button record">● 録音</button>
  <button id="stopRecordButton" class="button" disabled>■ 停止</button>
  <span id="recordStatus"></span>
  <div id="recordPlayback"></div>
</div>

<div class="step-title">練習ステップ</div>

<div class="step-tabs">
  <button class="step-button active" data-step="1">Step 1</button>
  <button class="step-button" data-step="2">Step 2</button>
  <button class="step-button" data-step="3">Step 3</button>
  <button class="step-button" data-step="4">Step 4</button>
  <button class="step-button" data-step="5">Step 5</button>
</div>

<div id="transcriptHome"></div>

<div id="transcriptSection">
  <div class="transcript-header">
    <div class="transcript-title">文字起こし</div>
    <div id="judgment"></div>
  </div>

  <div id="transcript">
    リピートした英文がここに表示されます。
  </div>
</div>

<div id="stepDescription"></div>

<div id="step1Instruction">
  <div class="step1-main-line">
    <span>音声が終わってからリピートしてください。</span>
    <span id="step1Cue"></span>
  </div>

  <div class="cue-note">
    ※「Repeat」が表示されてから話してください。
  </div>
</div>

<div id="step24Area">
  <div id="step24Cue"></div>

  <div id="step24Notice">
    音声を聞いた後、1センテンスずつリピートしてください。
  </div>

  <div id="step24Result"></div>
</div>

<div id="repeatInstruction">
  <div class="repeat-main-line">
    <span>「Repeat」が表示されてから話してください。</span>
    <span id="repeatCue"></span>
  </div>

  <div class="cue-note">
    ※Androidでは3センテンスの文字起こし・点数判定は行いません。
  </div>

  <div id="wholePracticeResultTop" class="whole-practice-result"></div>
</div>

<div id="hintBox"></div>

<div id="step1SummaryTop" class="step1-summary"></div>

<div id="step1Area"></div>

<div id="step1SummaryBottom" class="step1-summary"></div>

<div id="practiceControls"></div>

<div id="wholePracticeResult" class="whole-practice-result"></div>

<div id="loading"></div>

</div>

<script>

const API_URL=
"https://script.google.com/macros/s/AKfycbzZIqSI_QMpzyUICUGRGOPup7QL1YJ4thZ5PttFfGxiR8z0IaPZRqSQXj9K2EYA2FgO/exec";

const PASS_SCORE=80;
const SPEECH_END_SILENCE_MS=2500;
const CUE_CLEAR_DELAY_MS=500;
const MOBILE_BREAKPOINT=700;

const ANDROID_REPEAT_DELAY_MS=650;
const ANDROID_WHOLE_SILENCE_MS=1800;
const ANDROID_MIN_SPEECH_MS=2500;

const IS_ANDROID=
/Android/i.test(navigator.userAgent);

const IS_IOS=
/iPhone|iPad|iPod/i.test(navigator.userAgent)||
(
  navigator.platform==="MacIntel"&&
  navigator.maxTouchPoints>1
);

const USE_SINGLE_SENTENCE_RECOGNITION=
IS_ANDROID||IS_IOS;

let QUESTION={
  question:"",
  modelAnswer:"",
  sentences:[],
  keywords:"",
  topic:"",
  no:1
};

let currentStep=1;
let currentSegment=0;
let practiceRunning=false;
let recognition=null;
let recognitionText="";
let speechEndTimer=null;
let cueClearTimer=null;
let speechToken=0;
let isSpeechPaused=false;
let studentRecords=[];
let currentStudentId="";
let currentActiveSentenceIndex=null;
let step1Scores=[];

let recordStream=null;
let mediaRecorder=null;
let recordedChunks=[];
let recordedUrl=null;

let wholeCheckStream=null;
let wholeCheckOwnsStream=false;
let wholeCheckAudioContext=null;
let wholeCheckSource=null;
let wholeCheckAnalyser=null;
let wholeCheckRaf=null;

let iosPrewarmStream=null;

const SpeechRecognition=
window.SpeechRecognition||
window.webkitSpeechRecognition;

const synth=
window.speechSynthesis;

const appTitle=
document.getElementById("appTitle");

const practiceGuide=
document.getElementById("practiceGuide");

const topicSelect=
document.getElementById("topicSelect");

const questionSelect=
document.getElementById("questionSelect");

const questionDisplay=
document.getElementById("questionDisplay");

const questionAudioButton=
document.getElementById("questionAudioButton");

const voiceSelect=
document.getElementById("voiceSelect");

const recordButton=
document.getElementById("recordButton");

const stopRecordButton=
document.getElementById("stopRecordButton");

const recordStatus=
document.getElementById("recordStatus");

const recordPlayback=
document.getElementById("recordPlayback");

const transcriptHome=
document.getElementById("transcriptHome");

const transcriptSection=
document.getElementById("transcriptSection");

const transcriptDisplay=
document.getElementById("transcript");

const judgmentDisplay=
document.getElementById("judgment");

const stepDescription=
document.getElementById("stepDescription");

const step1Instruction=
document.getElementById("step1Instruction");

const step1Cue=
document.getElementById("step1Cue");

const step24Area=
document.getElementById("step24Area");

const step24Cue=
document.getElementById("step24Cue");

const step24Result=
document.getElementById("step24Result");

const repeatInstruction=
document.getElementById("repeatInstruction");

const repeatCue=
document.getElementById("repeatCue");

const hintBox=
document.getElementById("hintBox");

const step1SummaryTop=
document.getElementById("step1SummaryTop");

const step1SummaryBottom=
document.getElementById("step1SummaryBottom");

const step1Area=
document.getElementById("step1Area");

const practiceControls=
document.getElementById("practiceControls");

const wholePracticeResultTop=
document.getElementById("wholePracticeResultTop");

const wholePracticeResult=
document.getElementById("wholePracticeResult");

const loadingDisplay=
document.getElementById("loading");

const dataError=
document.getElementById("dataError");

const stepButtons=
document.querySelectorAll(".step-button");

init();

async function init(){

  await loadVoices();
  await loadStudentFromUrl();
}

async function fetchJson(url){

  const response=
  await fetch(
    url,
    {cache:"no-store"}
  );

  if(!response.ok){

    throw new Error(
      "データ取得に失敗しました。"
    );
  }

  return response.json();
}

async function loadStudentFromUrl(){

  const params=
  new URLSearchParams(
    location.search
  );

  const studentId=
  (
    params.get("s")||
    params.get("studentId")||
    ""
  ).trim();

  if(!studentId){

    showError(
      "このページは個人URLからアクセスしてください。"
    );

    questionDisplay.textContent=
    "受講生IDが指定されていません。";

    return;
  }

  await loadStudentRecords(
    studentId,
    true
  );
}

async function loadStudentRecords(
  studentId,
  useUrlSelection=false
){

  stopAllPractice();
  resetTranscript();

  setLoading(
    "問題データを読み込んでいます..."
  );

  hideError();

  try{

    const result=
    await fetchJson(
      `${API_URL}?studentId=${encodeURIComponent(studentId)}`
    );

    if(
      !result.success||
      !Array.isArray(result.data)
    ){

      throw new Error(
        "問題データを取得できませんでした。"
      );
    }

    studentRecords=
    result.data;

    currentStudentId=
    studentId;

    const topics=[
      ...new Set(
        studentRecords
        .map(
          record=>
          record.topic
        )
        .filter(Boolean)
      )
    ];

    topicSelect.innerHTML="";

    topics.forEach(
      topic=>{

        const option=
        document.createElement(
          "option"
        );

        option.value=
        topic;

        option.textContent=
        topic;

        topicSelect.appendChild(
          option
        );
      }
    );

    if(useUrlSelection){

      const requestedTopic=
      new URLSearchParams(
        location.search
      ).get("topic");

      if(
        requestedTopic&&
        topics.includes(
          requestedTopic
        )
      ){

        topicSelect.value=
        requestedTopic;
      }
    }

    populateQuestionSelect(
      useUrlSelection
    );

  }catch(error){

    showError(
      error.message
    );

  }finally{

    setLoading("");
  }
}

function populateQuestionSelect(
  useUrlSelection=false
){

  const topic=
  topicSelect.value;

  const records=
  studentRecords
  .filter(
    record=>
    record.topic===topic
  )
  .sort(
    (a,b)=>
    Number(a.no)-
    Number(b.no)
  );

  questionSelect.innerHTML="";

  records.forEach(
    record=>{

      const option=
      document.createElement(
        "option"
      );

      option.value=
      String(record.no);

      option.textContent=
      `Q${record.no}. ${record.question}`;

      questionSelect.appendChild(
        option
      );
    }
  );

  if(useUrlSelection){

    const requestedNo=
    new URLSearchParams(
      location.search
    ).get("no");

    if(
      requestedNo&&
      [...questionSelect.options]
      .some(
        option=>
        option.value===requestedNo
      )
    ){

      questionSelect.value=
      requestedNo;
    }
  }

  applySelectedQuestion();
}

function applySelectedQuestion(){

  restoreTranscriptHome();
  stopAllPractice();
  resetTranscript();

  const topic=
  topicSelect.value;

  const no=
  Number(
    questionSelect.value
  );

  const record=
  studentRecords.find(
    item=>
    item.topic===topic&&
    Number(item.no)===no
  );

  if(!record){

    showError(
      "選択した問題が見つかりません。"
    );

    return;
  }

  QUESTION={
    question:record.question,
    modelAnswer:record.modelAnswer,
    sentences:splitIntoSentences(
      record.modelAnswer
    ),
    keywords:
    record.keywords||"",
    topic:record.topic,
    no:Number(record.no)
  };

  step1Scores=
  new Array(
    QUESTION.sentences.length
  ).fill(null);

  appTitle.textContent=
  `${QUESTION.topic} 練習`;

  questionDisplay.textContent=
  `Q${QUESTION.no}. ${QUESTION.question}`;

  questionAudioButton.disabled=
  false;

  currentStep=
  1;

  currentActiveSentenceIndex=
  null;

  stepButtons.forEach(
    button=>{

      button.classList.toggle(
        "active",
        Number(
          button.dataset.step
        )===1
      );
    }
  );

  renderStep();
  updateUrl();
}

function splitIntoSentences(text){

  return(
    String(text).match(
      /[^.!?]+[.!?]+|[^.!?]+$/g
    )||[]
  )
  .map(
    sentence=>
    sentence.trim()
  )
  .filter(Boolean);
}

topicSelect.addEventListener(
  "change",
  ()=>populateQuestionSelect()
);

questionSelect.addEventListener(
  "change",
  applySelectedQuestion
);

function updateUrl(){

  const url=
  new URL(
    location.href
  );

  url.searchParams.delete(
    "studentId"
  );

  url.searchParams.set(
    "s",
    currentStudentId
  );

  url.searchParams.set(
    "topic",
    QUESTION.topic
  );

  url.searchParams.set(
    "no",
    String(QUESTION.no)
  );

  history.replaceState(
    null,
    "",
    url
  );
}

function setLoading(text){

  loadingDisplay.textContent=
  text;
}

function showError(text){

  dataError.style.display=
  "block";

  dataError.textContent=
  text;
}

function hideError(){

  dataError.style.display=
  "none";

  dataError.textContent=
  "";
}

async function loadVoices(){

  if(!synth){
    return;
  }

  let voices=
  synth.getVoices();

  if(!voices.length){

    await new Promise(
      resolve=>{

        let done=false;

        const finish=()=>{

          if(!done){

            done=true;
            resolve();
          }
        };

        synth.onvoiceschanged=
        finish;

        setTimeout(
          finish,
          1200
        );
      }
    );

    voices=
    synth.getVoices();
  }

  const sorted=
  voices
  .filter(
    voice=>
    /^en(-|_)/i.test(
      voice.lang
    )
  )
  .slice()
  .sort(
    (a,b)=>
    voiceScore(b)-
    voiceScore(a)
  );

  voiceSelect.innerHTML="";

  if(!sorted.length){

    const option=
    document.createElement(
      "option"
    );

    option.value="";

    option.textContent=
    "ブラウザ標準の英語音声";

    voiceSelect.appendChild(
      option
    );

    return;
  }

  sorted.forEach(
    (voice,index)=>{

      const option=
      document.createElement(
        "option"
      );

      option.value=
      `${voice.name}|||${voice.lang}`;

      option.textContent=
      `${voice.name} (${voice.lang})`;

      if(index===0){

        option.selected=
        true;
      }

      voiceSelect.appendChild(
        option
      );
    }
  );
}

function voiceScore(voice){

  const name=
  voice.name.toLowerCase();

  let score=
  0;

  if(
    name.includes("google")&&
    name.includes("english")
  ){

    score+=
    100;
  }

  if(
    name.includes("natural")
  ){

    score+=
    90;
  }

  if(
    name.includes("aria")||
    name.includes("jenny")||
    name.includes("guy")
  ){

    score+=
    80;
  }

  if(
    name.includes("samantha")||
    name.includes("daniel")||
    name.includes("karen")||
    name.includes("moira")
  ){

    score+=
    70;
  }

  if(
    /en-us/i.test(
      voice.lang
    )
  ){

    score+=
    20;
  }

  if(
    /en-gb/i.test(
      voice.lang
    )
  ){

    score+=
    15;
  }

  if(voice.default){

    score+=
    5;
  }

  return score;
}

function getSelectedVoice(){

  if(!synth){

    return null;
  }

  const[
    name,
    lang
  ]=
  String(
    voiceSelect.value||
    ""
  ).split("|||");

  return synth
  .getVoices()
  .find(
    voice=>
    voice.name===name&&
    voice.lang===lang
  )||null;
}

function stopSpeech(){

  speechToken++;

  isSpeechPaused=
  false;

  if(synth){

    synth.cancel();
  }

  disablePauseButton();
}

function speakText(
  text,
  onEnd=null
){

  stopRecognition();
  stopSpeech();

  if(
    !synth||
    typeof SpeechSynthesisUtterance===
    "undefined"
  ){

    showError(
      "このブラウザでは読み上げ機能を利用できません。"
    );

    return;
  }

  const token=
  ++speechToken;

  const utterance=
  new SpeechSynthesisUtterance(
    text
  );

  utterance.lang=
  "en-US";

  utterance.rate=
  0.92;

  utterance.pitch=
  1.0;

  const voice=
  getSelectedVoice();

  if(voice){

    utterance.voice=
    voice;

    utterance.lang=
    voice.lang;
  }

  utterance.onend=
  ()=>{

    if(
      token!==
      speechToken
    ){

      return;
    }

    disablePauseButton();

    if(onEnd){

      onEnd();
    }
  };

  utterance.onerror=
  ()=>{

    if(
      token!==
      speechToken
    ){

      return;
    }

    disablePauseButton();
  };

  synth.speak(
    utterance
  );

  setTimeout(
    enablePauseButton,
    100
  );
}

questionAudioButton.onclick=
()=>{

  stopAllPractice();

  speakText(
    QUESTION.question
  );
};

stepButtons.forEach(
  button=>{

    button.onclick=
    ()=>{

      restoreTranscriptHome();
      stopAllPractice();

      currentStep=
      Number(
        button.dataset.step
      );

      currentActiveSentenceIndex=
      null;

      stepButtons.forEach(
        btn=>{

          btn.classList.toggle(
            "active",
            btn===button
          );
        }
      );

      resetTranscript();
      renderStep();
    };
  }
);

function renderStep(){

  if(
    !QUESTION.sentences.length
  ){

    return;
  }

  restoreTranscriptHome();

  practiceGuide.textContent=
  currentStep===5
  ?
  "リピート音声の正確さを点数で判定します。80点以上で合格です。このステップで合格点が出たら、リピート練習は終了です。"
  :
  "リピート音声の正確さを点数で判定します。80点以上で合格です。なるべく合格点が出てから次のステップへ進みましょう。";

  step1Area.innerHTML="";
  practiceControls.innerHTML="";
  hintBox.innerHTML="";
  step1Cue.textContent="";
  step24Cue.textContent="";
  step24Result.textContent="";
  repeatCue.textContent="";

  wholePracticeResultTop.style.display=
  "none";

  wholePracticeResultTop.innerHTML=
  "";

  wholePracticeResult.style.display=
  "none";

async function startIOSSentenceRecognition(
  target,
  index,
  useCue=true
){

  stopRecognition();
  stopIOSPrewarmMic();

  if(!SpeechRecognition){

    transcriptDisplay.textContent=
    "このブラウザでは文字起こしを利用できません。";

    return;
  }

  if(
    !navigator.mediaDevices||
    !navigator.mediaDevices.getUserMedia
  ){

    transcriptDisplay.textContent=
    "マイクを開始できませんでした。";

    return;
  }

  try{

    iosPrewarmStream=
    await navigator.mediaDevices
    .getUserMedia({
      audio:true
    });

    await new Promise(
      resolve=>
      setTimeout(
        resolve,
        500
      )
    );

  }catch(e){

    transcriptDisplay.textContent=
    "マイクを開始できませんでした。";

    if(useCue){

      finishStep1Cue(
        index
      );
    }

    stopIOSPrewarmMic();

    return;
  }

  const r=
  new SpeechRecognition();

  recognition=
  r;

  r.lang=
  "en-US";

  r.continuous=
  false;

  r.interimResults=
  false;

  r.maxAlternatives=
  5;

  let bestText="";
  let bestScore=-1;
  let finished=false;
  let repeatTimer=null;

  const finish=
  ()=>{

    if(finished){

      return;
    }

    finished=
    true;

    clearTimeout(
      repeatTimer
    );

    if(
      recognition===r
    ){

      recognition=
      null;
    }

    stopIOSPrewarmMic();

    if(!bestText){

      transcriptDisplay.textContent=
      "文字起こしできませんでした。";

      if(useCue){

        finishStep1Cue(
          index
        );
      }

      return;
    }

    recognitionText=
    bestText;

    transcriptDisplay.textContent=
    bestText;

    showScore(
      bestScore
    );

    saveBestStep1Score(
      index,
      bestScore
    );

    if(useCue){

      finishStep1Cue(
        index
      );
    }
  };

  r.onstart=
  ()=>{

    if(
      recognition!==r
    ){

      return;
    }

    if(useCue){

      repeatTimer=
      setTimeout(
        ()=>{

          if(
            recognition===r&&
            !finished
          ){

            setStep1Cue(
              index,
              `Sentence${index+1}　Repeat`,
              true
            );
          }
        },
        ANDROID_REPEAT_DELAY_MS
      );
    }
  };

  r.onresult=
  event=>{

    for(
      let i=
      event.resultIndex;
      i<
      event.results.length;
      i++
    ){

      const result=
      event.results[i];

      for(
        let a=0;
        a<result.length;
        a++
      ){

        const text=
        String(
          result[a].transcript||
          ""
        )
        .replace(
          /\s+/g,
          " "
        )
        .trim();

        if(!text){

          continue;
        }

        const score=
        calculateSimilarity(
          text,
          target
        );

        if(
          score>
          bestScore
        ){

          bestScore=
          score;

          bestText=
          text;
        }
      }
    }

    if(bestText){

      transcriptDisplay.textContent=
      bestText;
    }
  };

  r.onend=
  finish;

  r.onerror=
  event=>{

    if(finished){

      return;
    }

    finished=
    true;

    clearTimeout(
      repeatTimer
    );

    if(
      recognition===r
    ){

      recognition=
      null;
    }

    stopIOSPrewarmMic();

    if(
      event.error===
      "no-speech"
    ){

      transcriptDisplay.textContent=
      "音声を認識できませんでした。";

    }else{

      transcriptDisplay.textContent=
      "文字起こしを完了できませんでした。";
    }

    if(useCue){

      finishStep1Cue(
        index
      );
    }
  };

  try{

    r.start();

  }catch(e){

    if(
      recognition===r
    ){

      recognition=
      null;
    }

    stopIOSPrewarmMic();

    transcriptDisplay.textContent=
    "文字起こしを開始できませんでした。";

    if(useCue){

      finishStep1Cue(
        index
      );
    }
  }
}

function stopIOSPrewarmMic(){

  if(!iosPrewarmStream){

    return;
  }

  iosPrewarmStream
  .getTracks()
  .forEach(
    track=>
    track.stop()
  );

  iosPrewarmStream=
  null;
}

function startDesktopSentenceRecognition(
  target,
  index,
  useCue=true
){

  stopRecognition();

  if(!SpeechRecognition){

    transcriptDisplay.textContent=
    "このブラウザでは文字起こしを利用できません。";

    return;
  }

  const r=
  new SpeechRecognition();

  recognition=
  r;

  r.lang=
  "en-US";

  r.continuous=
  true;

  r.interimResults=
  true;

  let currentText="";
  let finished=false;
  let hasSpeech=false;

  const finish=
  ()=>{

    if(
      finished||
      !hasSpeech
    ){

      return;
    }

    finished=
    true;

    clearTimeout(
      speechEndTimer
    );

    r.onend=
    null;

    if(
      recognition===r
    ){

      try{

        r.stop();

      }catch(e){}

      recognition=
      null;
    }

    recognitionText=
    currentText;

    transcriptDisplay.textContent=
    currentText;

    const score=
    calculateSimilarity(
      currentText,
      target
    );

    showScore(
      score
    );

    saveBestStep1Score(
      index,
      score
    );

    if(useCue){

      finishStep1Cue(
        index
      );
    }
  };

  r.onresult=
  event=>{

    currentText=
    buildCurrentRecognitionText(
      event.results
    );

    transcriptDisplay.textContent=
    currentText;

    if(currentText){

      hasSpeech=
      true;

      clearTimeout(
        speechEndTimer
      );

      speechEndTimer=
      setTimeout(
        finish,
        SPEECH_END_SILENCE_MS
      );
    }
  };

  r.onend=
  ()=>{

    if(
      recognition===r
    ){

      recognition=
      null;
    }

    if(hasSpeech){

      finish();
    }
  };

  try{

    r.start();

  }catch(e){}
}

function saveBestStep1Score(
  index,
  score
){

  const oldScore=
  step1Scores[index];

  if(
    oldScore===null||
    score>oldScore
  ){

    step1Scores[index]=
    score;
  }

  refreshStep1Results();
}

function refreshStep1Results(){

  step1Scores.forEach(
    (score,index)=>{

      const target=
      step1Area.querySelector(
        `[data-result-index="${index}"]`
      );

      if(!target){

        return;
      }

      if(score===null){

        target.innerHTML=
        "";

        return;
      }

      target.innerHTML=
      score>=PASS_SCORE
      ?
      `<span class="pass">最高 ${score}点　合格</span>`
      :
      `<span class="retry">最高 ${score}点　再挑戦</span>`;
    }
  );

  const attempted=
  step1Scores.filter(
    score=>
    score!==null
  ).length;

  let html=
  "";

  if(attempted===0){

    html=
    "3センテンスすべて練習してください。";

  }else if(
    attempted<
    step1Scores.length
  ){

    html=
    `${attempted}/${step1Scores.length}センテンス完了。残りも練習してください。`;

  }else{

    const failed=
    step1Scores
    .map(
      (score,index)=>({
        score,
        index
      })
    )
    .filter(
      item=>
      item.score<
      PASS_SCORE
    );

    if(!failed.length){

      html=
      '<span class="pass">Step 1 合格：すべてのセンテンスが80点以上です。</span>';

    }else{

      html=
      `<span class="retry">Step 1 再挑戦：${failed.map(item=>`Sentence ${item.index+1}`).join("・")}をもう一度練習しましょう。</span>`;
    }
  }

  step1SummaryTop.innerHTML=
  html;

  step1SummaryBottom.innerHTML=
  html;
}

function playNextStep2to4(){

  if(
    !practiceRunning
  ){

    return;
  }

  if(
    currentSegment>=
    QUESTION.sentences.length
  ){

    finishStep2to4();

    return;
  }

  const index=
  currentSegment;

  setCue(
    step24Cue,
    `Sentence${index+1}　Listen`,
    false
  );

  speakText(
    QUESTION.sentences[index],
    ()=>{

      if(
        !practiceRunning
      ){

        return;
      }

      setCue(
        step24Cue,
        `Sentence${index+1}　Repeat`,
        true
      );

      const repeatMs=
      calculatePracticeTime(
        countWords(
          QUESTION.sentences[index]
        )
      );

      setTimeout(
        ()=>{

          if(
            !practiceRunning
          ){

            return;
          }

          step24Cue.classList.remove(
            "blink"
          );

          currentSegment++;

          playNextStep2to4();

        },
        repeatMs
      );
    }
  );
}

    "マイクを準備しています…"
  );

  try{

    if(
      recordStream&&
      recordStream.active
    ){

      wholeCheckStream=
      recordStream;

      wholeCheckOwnsStream=
      false;

    }else{

      wholeCheckStream=
      await navigator.mediaDevices
      .getUserMedia({
        audio:true
      });

      wholeCheckOwnsStream=
      true;
    }

    if(
      !practiceRunning
    ){

      stopAndroidWholeSpeechCheck();

      return;
    }

    const AudioContextClass=
    window.AudioContext||
    window.webkitAudioContext;

    if(!AudioContextClass){

      setWholePracticeResult(
        '<span class="retry">マイク音量の判定機能を利用できません。</span>',
        true
      );

      return;
    }

    wholeCheckAudioContext=
    new AudioContextClass();

    wholeCheckSource=
    wholeCheckAudioContext
    .createMediaStreamSource(
      wholeCheckStream
    );

    wholeCheckAnalyser=
    wholeCheckAudioContext
    .createAnalyser();

    wholeCheckAnalyser.fftSize=
    1024;

    wholeCheckSource.connect(
      wholeCheckAnalyser
    );

    const data=
    new Uint8Array(
      wholeCheckAnalyser.fftSize
    );

    const SPEECH_THRESHOLD=
    0.018;

    let speechStarted=
    false;

    let totalSpeechMs=
    0;

    let lastFrameTime=
    performance.now();

    let lastVoiceTime=
    0;

    let finished=
    false;

    setCue(
      repeatCue,
      "Repeat",
      true
    );

    setWholePracticeResult(
      "3センテンスまとめてリピートしてください。"
    );

    const finishPass=
    ()=>{

      if(finished){

        return;
      }

      finished=
      true;

      practiceRunning=
      false;

      repeatCue.classList.remove(
        "blink"
      );

      repeatCue.textContent=
      "";

      setWholePracticeResult(
        '<span class="pass">合格：3センテンスのリピート練習が完了しました。</span>',
        true
      );

      stopAndroidWholeSpeechCheck();
    };

    const tick=
    now=>{

      if(
        finished||
        !practiceRunning
      ){

        return;
      }

      wholeCheckAnalyser
      .getByteTimeDomainData(
        data
      );

      let sum=
      0;

      for(
        let i=0;
        i<data.length;
        i++
      ){

        const v=
        (data[i]-128)/128;

        sum+=
        v*v;
      }

      const rms=
      Math.sqrt(
        sum/data.length
      );

      const delta=
      Math.min(
        100,
        now-lastFrameTime
      );

      lastFrameTime=
      now;

      if(
        rms>=
        SPEECH_THRESHOLD
      ){

        if(!speechStarted){

          speechStarted=
          true;
        }

        totalSpeechMs+=
        delta;

        lastVoiceTime=
        now;

        setWholePracticeResult(
          "発話を確認しています…"
        );

      }else if(
        speechStarted&&
        totalSpeechMs>=
        ANDROID_MIN_SPEECH_MS&&
        now-lastVoiceTime>=
        ANDROID_WHOLE_SILENCE_MS
      ){

        finishPass();

        return;
      }

      wholeCheckRaf=
      requestAnimationFrame(
        tick
      );
    };

    wholeCheckRaf=
    requestAnimationFrame(
      tick
    );

  }catch(e){

    setWholePracticeResult(
      '<span class="retry">マイクを使用できません。</span>',
      true
    );

    repeatCue.textContent=
    "";

    repeatCue.classList.remove(
      "blink"
    );

    stopAndroidWholeSpeechCheck();
  }
}

function stopAndroidWholeSpeechCheck(){

  if(
    wholeCheckRaf!==null
  ){

    cancelAnimationFrame(
      wholeCheckRaf
    );

    wholeCheckRaf=
    null;
  }

  if(wholeCheckSource){

    try{

      wholeCheckSource.disconnect();

    }catch(e){}

    wholeCheckSource=
    null;
  }

  if(wholeCheckAnalyser){

    try{

      wholeCheckAnalyser.disconnect();

    }catch(e){}

    wholeCheckAnalyser=
    null;
  }

  if(wholeCheckAudioContext){

    try{

      wholeCheckAudioContext.close();

    }catch(e){}

    wholeCheckAudioContext=
    null;
  }

  if(
    wholeCheckStream&&
    wholeCheckOwnsStream
  ){

    wholeCheckStream
    .getTracks()
    .forEach(
      track=>
      track.stop()
    );
  }

  wholeCheckStream=
  null;

  wholeCheckOwnsStream=
  false;
}

function startDesktopWholeRecognition(
  target
){

  stopRecognition();

  if(!SpeechRecognition){

    transcriptDisplay.textContent=
    "このブラウザでは文字起こしを利用できません。";

    return;
  }

  const r=
  new SpeechRecognition();

  recognition=
  r;

  r.lang=
  "en-US";

  r.continuous=
  true;

  r.interimResults=
  true;

  let bestText="";
  let bestScore=-1;
  let hasSpeech=false;
  let finished=false;

  const finish=
  ()=>{

    if(
      finished||
      !hasSpeech
    ){

      return;
    }

    finished=
    true;

    clearTimeout(
      speechEndTimer
    );

    r.onend=
    null;

    if(
      recognition===r
    ){

      try{

        r.stop();

      }catch(e){}

      recognition=
      null;
    }

    recognitionText=
    bestText;

    transcriptDisplay.textContent=
    bestText||
    "文字起こしできませんでした。";

    if(bestText){

      showScore(
        bestScore
      );
    }

    finishCue(
      repeatCue
    );
  };

  r.onstart=
  ()=>{

    if(
      recognition===r&&
      practiceRunning
    ){

      setCue(
        repeatCue,
        "Repeat",
        true
      );
    }
  };

  r.onresult=
  event=>{

    const candidate=
    buildCurrentRecognitionText(
      event.results
    );

    if(!candidate){

      return;
    }

    hasSpeech=
    true;

    const score=
    calculateSimilarity(
      candidate,
      target
    );

    if(
      score>
      bestScore
    ){

      bestScore=
      score;

      bestText=
      candidate;
    }

    transcriptDisplay.textContent=
    bestText;

    clearTimeout(
      speechEndTimer
    );

    speechEndTimer=
    setTimeout(
      finish,
      SPEECH_END_SILENCE_MS
    );
  };

  r.onend=
  ()=>{

    if(
      recognition===r
    ){

      recognition=
      null;
    }

    if(hasSpeech){

      finish();
    }
  };

  try{

    r.start();

  }catch(e){}
}

function buildCurrentRecognitionText(
  results
){

  const parts=
  [];

  for(
    let i=0;
    i<results.length;
    i++
  ){

    const text=
    String(
      results[i][0].transcript||
      ""
    )
    .replace(
      /\s+/g,
      " "
    )
    .trim();

    if(!text){

      continue;
    }

    const previous=
    parts.length
    ?
    normalize(
      parts[
        parts.length-1
      ]
    )
    :
    "";

    if(
      normalize(text)===
      previous
    ){

      continue;
    }

    parts.push(
      text
    );
  }

  return parts
  .join(" ")
  .replace(
    /\s+/g,
    " "
  )
  .trim();
}

  return 8000;

function calculateSimilarity(
  spoken,
  target
){

  const a=
  normalize(
    spoken
  )
  .split(" ")
  .filter(Boolean);

  const b=
  normalize(
    target
  )
  .split(" ")
  .filter(Boolean);

  if(
    !a.length||
    !b.length
  ){

    return 0;
  }

  const distance=
  levenshteinWords(
    a,
    b
  );

  const length=
  Math.max(
    a.length,
    b.length
  );

  return Math.round(
    Math.max(
      0,
      1-
      distance/length
    )*
    100
  );
}

function normalize(
  text
){

  return String(
    text||
    ""
  )
  .toLowerCase()
  .replace(
    /[’']/g,
    ""
  )
  .replace(
    /[^a-z0-9\s]/g,
    " "
  )
  .replace(
    /\s+/g,
    " "
  )
  .trim();
}

function levenshteinWords(
  a,
  b
){

  const matrix=
  Array.from(
    {
      length:
      a.length+1
    },
    ()=>
    new Array(
      b.length+1
    ).fill(0)
  );

  for(
    let i=0;
    i<=a.length;
    i++
  ){

    matrix[i][0]=
    i;
  }

  for(
    let j=0;
    j<=b.length;
    j++
  ){

    matrix[0][j]=
    j;
  }

  for(
    let i=1;
    i<=a.length;
    i++
  ){

    for(
      let j=1;
      j<=b.length;
      j++
    ){

      const cost=
      a[i-1]===
      b[j-1]
      ?
      0
      :
      1;

      matrix[i][j]=
      Math.min(
        matrix[i-1][j]+1,
        matrix[i][j-1]+1,
        matrix[i-1][j-1]+cost
      );
    }
  }

  return matrix[
    a.length
  ][
    b.length
  ];
}

function escapeHtml(
  text
){

  return String(
    text
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );
}

recordButton.onclick=
async()=>{

  if(
    mediaRecorder&&
    mediaRecorder.state===
    "recording"
  ){

    return;
  }

  try{

    recordStream=
    await navigator.mediaDevices
    .getUserMedia({
      audio:true
    });

    recordedChunks=
    [];

    mediaRecorder=
    new MediaRecorder(
      recordStream
    );

    mediaRecorder.ondataavailable=
    event=>{

      if(
        event.data&&
        event.data.size>0
      ){

        recordedChunks.push(
          event.data
        );
      }
    };

    mediaRecorder.onstop=
    ()=>{

      const blob=
      new Blob(
        recordedChunks,
        {
          type:
          mediaRecorder.mimeType||
          "audio/webm"
        }
      );

      if(recordedUrl){

        URL.revokeObjectURL(
          recordedUrl
        );
      }

      recordedUrl=
      URL.createObjectURL(
        blob
      );

      recordPlayback.innerHTML=
      "";

      const audio=
      document.createElement(
        "audio"
      );

      audio.controls=
      true;

      audio.src=
      recordedUrl;

      recordPlayback.appendChild(
        audio
      );

      if(recordStream){

        recordStream
        .getTracks()
        .forEach(
          track=>
          track.stop()
        );

        recordStream=
        null;
      }
    };

    mediaRecorder.start();

    recordStatus.textContent=
    "● Recording";

    recordButton.disabled=
    true;

    stopRecordButton.disabled=
    false;

  }catch(e){

    recordStatus.textContent=
    "マイクを使用できません。";
  }
};

stopRecordButton.onclick=
()=>{

  if(
    mediaRecorder&&
    mediaRecorder.state!==
    "inactive"
  ){

    mediaRecorder.stop();
  }

  recordStatus.textContent=
  "";

  recordButton.disabled=
  false;

  stopRecordButton.disabled=
  true;
};
