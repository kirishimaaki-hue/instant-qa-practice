<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Favorites 練習</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f6f6f6;
  color: #111;
}

.app {
  display: flex;
  max-width: 1150px;
  min-height: 100vh;
  margin: 0 auto;
  background: white;
}

/* 左メニュー */

.sidebar {
  width: 220px;
  padding: 28px 18px;
  border-right: 1px solid #ddd;
  background: #fafafa;
}

.sidebar-title {
  font-size: 19px;
  font-weight: bold;
  margin-bottom: 16px;
}

.menu-item {
  width: 100%;
  padding: 14px;
  margin-bottom: 8px;
  text-align: left;
  font-size: 17px;
  border: 1px solid #ccc;
  border-radius: 7px;
  background: white;
}

.menu-item.active {
  background: #111;
  color: white;
}

/* メイン */

.main {
  flex: 1;
  padding: 38px 45px 70px;
}

h1 {
  font-size: 32px;
  margin-top: 0;
  margin-bottom: 32px;
}

.question {
  font-size: 29px;
  font-weight: bold;
  margin-bottom: 14px;
}

button {
  font-family: inherit;
  cursor: pointer;
}

.button {
  font-size: 16px;
  padding: 10px 16px;
  margin: 4px 4px 4px 0;
  border: 1px solid #999;
  border-radius: 6px;
  background: white;
}

.button.primary {
  background: #111;
  color: white;
  border-color: #111;
}

.button.record {
  background: #b00020;
  color: white;
  border-color: #b00020;
}

.button:disabled {
  opacity: 0.4;
  cursor: default;
}

/* 録音 */

.record-controls {
  margin: 16px 0 20px;
  padding: 14px 0;
}

#recordStatus {
  display: inline-block;
  margin-left: 8px;
  font-weight: bold;
  color: #b00020;
}

#recordPlayback {
  margin-top: 10px;
}

#recordPlayback audio {
  width: 100%;
  max-width: 500px;
}

/* 練習種類 */

.section-title {
  font-size: 22px;
  font-weight: bold;
  margin: 34px 0 14px;
}

.step-tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 18px;
}

.step-button {
  padding: 11px 15px;
  font-size: 16px;
  border: 1px solid #bbb;
  background: white;
  border-radius: 7px;
}

.step-button.active {
  background: #111;
  color: white;
}

/* ヒント */

.hint-box {
  background: #f4f4f4;
  border-radius: 9px;
  padding: 20px;
  margin-bottom: 20px;
  min-height: 75px;
  font-size: 21px;
  line-height: 1.7;
}

.no-hint {
  color: #777;
  text-align: center;
}

/* A-1 センテンス */

.sentence-card {
  background: #f4f4f4;
  border-radius: 9px;
  padding: 18px 20px;
  margin-bottom: 14px;
}

.sentence-text {
  font-size: 20px;
  line-height: 1.6;
  margin-bottom: 8px;
}

/* 状態 */

#status {
  min-height: 38px;
  margin: 15px 0 5px;
  font-size: 23px;
  font-weight: bold;
}

#loading {
  min-height: 22px;
  color: #777;
}

/* 文字起こし */

.transcript-area {
  margin-top: 24px;
  border-top: 1px solid #ddd;
  padding-top: 20px;
}

.transcript-title {
  font-size: 18px;
  font-weight: bold;
  margin-bottom: 7px;
}

#transcript {
  background: #f4f4f4;
  min-height: 75px;
  padding: 14px;
  border-radius: 8px;
  font-size: 18px;
  line-height: 1.6;
}

#judgment {
  min-height: 34px;
  margin-top: 10px;
  font-size: 21px;
  font-weight: bold;
}

.pass {
  color: #16803a;
}

.retry {
  color: #c00000;
}

/* スマホ */

@media (max-width: 760px) {
  .app {
    display: block;
  }

  .sidebar {
    width: 100%;
    border-right: none;
    border-bottom: 1px solid #ddd;
    padding: 14px;
  }

  .menu-item {
    width: auto;
    min-width: 70px;
  }

  .main {
    padding: 25px 18px 50px;
  }

  .question {
    font-size: 24px;
  }

  h1 {
    font-size: 27px;
  }
}
</style>
</head>

<body>

<div class="app">

  <aside class="sidebar">
    <div class="sidebar-title">問題一覧</div>

    <button class="menu-item active">
      Q1
    </button>
  </aside>


  <main class="main">

    <h1>Favorites 練習</h1>

    <div class="question">
      Q1. What's your favorite season?
    </div>

    <button id="questionAudioButton" class="button">
      ▶ 質問を聞く
    </button>


    <!-- 録音 -->
    <div class="record-controls">

      <button id="recordButton" class="button record">
        ● 録音
      </button>

      <button id="stopRecordButton" class="button" disabled>
        ■ 停止
      </button>

      <span id="recordStatus"></span>

      <div id="recordPlayback"></div>

    </div>


    <!-- A -->
    <div class="section-title">
      A：1センテンスずつ練習
    </div>

    <div class="step-tabs">

      <button class="step-button a-step active" data-step="1">
        Step 1 全文
      </button>

      <button class="step-button a-step" data-step="2">
        Step 2 ヒント
      </button>

      <button class="step-button a-step" data-step="3">
        Step 3 ヒントなし
      </button>

    </div>

    <div id="aPracticeArea"></div>


    <!-- B -->
    <div class="section-title">
      B：3センテンスまとめて練習
    </div>

    <div class="step-tabs">

      <button class="step-button b-step active" data-step="1">
        Step 1 ヒント多め
      </button>

      <button class="step-button b-step" data-step="2">
        Step 2 ヒント少なめ
      </button>

      <button class="step-button b-step" data-step="3">
        Step 3 ヒントなし
      </button>

    </div>

    <div id="bHintBox" class="hint-box"></div>

    <button id="bPlayButton" class="button primary" disabled>
      ▶ 3センテンスを聞いてまとめてリピート
    </button>

    <button id="pauseButton" class="button" disabled>
      一時停止
    </button>


    <div id="status"></div>
    <div id="loading">音声を読み込んでいます…</div>


    <!-- 文字起こし -->
    <div class="transcript-area">

      <div class="transcript-title">
        リピートした英文
      </div>

      <div id="transcript">
        リピートすると、ここに自動で文字起こしされます。
      </div>

      <div id="judgment"></div>

    </div>

  </main>

</div>


<script>

/* =====================================
   Q1
===================================== */

const QUESTION = {

  questionAudio:
    "fav01.mp3",

  answerAudio:
    "yasmin_fav01.mp3",

  sentences: [
    "My favorite season is summer.",
    "I hate cold weather.",
    "Summers here are humid and tough, but I still prefer summer."
  ],

  aHints: [
    "summer",
    "cold weather",
    "humid / tough / prefer summer"
  ],

  bHintMany:
    "favorite season / summer / hate cold weather / humid / tough / still prefer summer",

  bHintFew:
    "summer / cold / humid / prefer summer"
};


const PASS_SCORE = 90;

const MIN_SILENCE_SECONDS = 0.25;
const SILENCE_THRESHOLD = 0.02;


/* =====================================
   DOM
===================================== */

const questionAudioButton =
  document.getElementById("questionAudioButton");

const recordButton =
  document.getElementById("recordButton");

const stopRecordButton =
  document.getElementById("stopRecordButton");

const recordStatus =
  document.getElementById("recordStatus");

const recordPlayback =
  document.getElementById("recordPlayback");

const aPracticeArea =
  document.getElementById("aPracticeArea");

const bHintBox =
  document.getElementById("bHintBox");

const bPlayButton =
  document.getElementById("bPlayButton");

const pauseButton =
  document.getElementById("pauseButton");

const statusDisplay =
  document.getElementById("status");

const loadingDisplay =
  document.getElementById("loading");

const transcriptDisplay =
  document.getElementById("transcript");

const judgmentDisplay =
  document.getElementById("judgment");


/* =====================================
   音声
===================================== */

const answerPlayer =
  new Audio(
    QUESTION.answerAudio
  );

const questionPlayer =
  new Audio(
    QUESTION.questionAudio
  );

let segments = [];

let segmentEndTime = null;

let animationId = null;

let pauseTimer = null;

let currentCallback = null;

let isPaused = false;


/* =====================================
   Step状態
===================================== */

let aStep = 1;
let bStep = 1;


/* =====================================
   SpeechRecognition
===================================== */

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

let recognition = null;

let finalTranscript = "";
let interimTranscript = "";

let currentTarget = "";

let recognitionActive = false;


/* =====================================
   任意録音
===================================== */

let recordStream = null;

let mediaRecorder = null;

let recordedChunks = [];

let recordedUrl = null;


/* =====================================
   初期化
===================================== */

renderA();
renderB();

prepareSegments();


/* =====================================
   質問音声
===================================== */

questionAudioButton.addEventListener(
  "click",
  () => {

    stopRecognition();

    stopPracticeAudio();

    questionPlayer.currentTime = 0;

    questionPlayer.play();
  }
);


/* =====================================
   A Step切替
===================================== */

document
  .querySelectorAll(".a-step")
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          aStep =
            Number(
              button.dataset.step
            );

          document
            .querySelectorAll(".a-step")
            .forEach(
              btn =>
                btn.classList.toggle(
                  "active",
                  btn === button
                )
            );

          stopAllPractice();

          renderA();
        }
      );
    }
  );


/* =====================================
   A表示
===================================== */

function renderA() {

  aPracticeArea.innerHTML = "";


  /*
   Step 1だけ全文を表示
  */

  if (aStep === 1) {

    QUESTION.sentences.forEach(
      (sentence, index) => {

        const card =
          document.createElement("div");

        card.className =
          "sentence-card";


        const text =
          document.createElement("div");

        text.className =
          "sentence-text";

        text.textContent =
          (index + 1) +
          ". " +
          sentence;


        const button =
          document.createElement("button");

        button.className =
          "button";

        button.textContent =
          "▶ この文を聞く";

        button.disabled =
          segments.length === 0;


        button.addEventListener(
          "click",
          () => {

            playAIndividual(
              index,
              sentence
            );
          }
        );


        card.appendChild(text);
        card.appendChild(button);

        aPracticeArea.appendChild(
          card
        );
      }
    );

    return;
  }


  /*
   Step 2：ヒントだけ
  */

  if (aStep === 2) {

    QUESTION.aHints.forEach(
      (hint, index) => {

        const card =
          document.createElement("div");

        card.className =
          "sentence-card";


        const text =
          document.createElement("div");

        text.className =
          "sentence-text";

        text.textContent =
          (index + 1) +
          ". " +
          hint;


        const button =
          document.createElement("button");

        button.className =
          "button";

        button.textContent =
          "▶ この文を聞く";

        button.disabled =
          segments.length === 0;


        button.addEventListener(
          "click",
          () => {

            playAIndividual(
              index,
              QUESTION.sentences[index]
            );
          }
        );


        card.appendChild(text);
        card.appendChild(button);

        aPracticeArea.appendChild(
          card
        );
      }
    );

    return;
  }


  /*
   Step 3：答えを表示しない
  */

  QUESTION.sentences.forEach(
    (sentence, index) => {

      const card =
        document.createElement("div");

      card.className =
        "sentence-card";


      const text =
        document.createElement("div");

      text.className =
        "sentence-text";

      text.textContent =
        "Sentence " +
        (index + 1);


      const button =
        document.createElement("button");

      button.className =
        "button";

      button.textContent =
        "▶ この文を聞く";

      button.disabled =
        segments.length === 0;


      button.addEventListener(
        "click",
        () => {

          playAIndividual(
            index,
            sentence
          );
        }
      );


      card.appendChild(text);
      card.appendChild(button);

      aPracticeArea.appendChild(
        card
      );
    }
  );
}


/* =====================================
   A：1文ずつ
===================================== */

function playAIndividual(
  index,
  target
) {

  stopAllPractice();

  resetTranscript();

  currentTarget =
    target;

  statusDisplay.textContent =
    "Sentence " +
    (index + 1);


  playSegment(
    index,
    () => {

      statusDisplay.textContent =
        "Repeat";

      /*
       お手本終了後にだけ
       文字起こし開始
      */

      startRecognition(
        currentTarget
      );
    }
  );
}


/* =====================================
   B Step切替
===================================== */

document
  .querySelectorAll(".b-step")
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          bStep =
            Number(
              button.dataset.step
            );


          document
            .querySelectorAll(".b-step")
            .forEach(
              btn =>
                btn.classList.toggle(
                  "active",
                  btn === button
                )
            );


          stopAllPractice();

          renderB();
        }
      );
    }
  );


/* =====================================
   B表示
===================================== */

function renderB() {

  if (bStep === 1) {

    bHintBox.textContent =
      QUESTION.bHintMany;

    return;
  }


  if (bStep === 2) {

    bHintBox.textContent =
      QUESTION.bHintFew;

    return;
  }


  bHintBox.innerHTML =
    '<div class="no-hint">ヒントなし</div>';
}


/* =====================================
   B：3文全部聞いてからRepeat
===================================== */

bPlayButton.addEventListener(
  "click",
  () => {

    stopAllPractice();

    resetTranscript();


    const target =
      QUESTION.sentences.join(" ");


    currentTarget =
      target;


    statusDisplay.textContent =
      "Listen";


    /*
     Bでは元の3センテンス音声を
     ポーズなしでそのまま再生
    */

    answerPlayer.currentTime = 0;


    answerPlayer.onended =
      function() {

        statusDisplay.textContent =
          "Repeat";


        /*
         お手本音声終了後に
         学習者の声だけ認識
        */

        startRecognition(
          target
        );
      };


    answerPlayer.play();
  }
);


/* =====================================
   センテンス区間再生
===================================== */

function playSegment(
  index,
  callback
) {

  if (!segments[index]) {
    return;
  }


  stopRecognition();

  cancelAnimationFrame(
    animationId
  );


  const segment =
    segments[index];


  answerPlayer.currentTime =
    segment.start;

  segmentEndTime =
    segment.end;

  currentCallback =
    callback;

  isPaused = false;


  pauseButton.disabled =
    false;

  pauseButton.textContent =
    "一時停止";


  answerPlayer.play();


  monitorSegment();
}


function monitorSegment() {

  cancelAnimationFrame(
    animationId
  );


  const monitor =
    () => {

      if (
        answerPlayer.currentTime >=
          segmentEndTime - 0.03
      ) {

        answerPlayer.pause();

        pauseButton.disabled =
          true;


        if (currentCallback) {

          const callback =
            currentCallback;

          currentCallback =
            null;

          callback();
        }

        return;
      }


      if (
        !answerPlayer.paused &&
        !isPaused
      ) {

        animationId =
          requestAnimationFrame(
            monitor
          );
      }
    };


  animationId =
    requestAnimationFrame(
      monitor
    );
}


/* =====================================
   一時停止
===================================== */

pauseButton.addEventListener(
  "click",
  () => {

    if (!isPaused) {

      isPaused = true;

      answerPlayer.pause();

      cancelAnimationFrame(
        animationId
      );

      pauseButton.textContent =
        "再開";

    } else {

      isPaused = false;

      pauseButton.textContent =
        "一時停止";

      answerPlayer.play();

      monitorSegment();
    }
  }
);


/* =====================================
   文字起こし
===================================== */

function startRecognition(
  target
) {

  stopRecognition();


  if (!SpeechRecognition) {

    transcriptDisplay.textContent =
      "このブラウザでは文字起こしを利用できません。";

    return;
  }


  finalTranscript = "";
  interimTranscript = "";


  recognition =
    new SpeechRecognition();


  recognition.lang =
    "en-US";

  recognition.continuous =
    true;

  recognition.interimResults =
    true;


  recognition.onresult =
    function(event) {

      interimTranscript = "";


      for (
        let i =
          event.resultIndex;
        i <
          event.results.length;
        i++
      ) {

        const text =
          event.results[i][0]
            .transcript;


        if (
          event.results[i]
            .isFinal
        ) {

          finalTranscript +=
            text + " ";

        } else {

          interimTranscript +=
            text;
        }
      }


      const transcript =
        (
          finalTranscript +
          interimTranscript
        ).trim();


      transcriptDisplay.textContent =
        transcript;


      updateJudgment(
        transcript,
        target
      );
    };


  recognition.onerror =
    function(error) {

      console.log(
        error
      );
    };


  recognition.onend =
    function() {

      recognitionActive =
        false;
    };


  try {

    recognition.start();

    recognitionActive =
      true;

  } catch (error) {}
}


/* =====================================
   文字起こし停止
===================================== */

function stopRecognition() {

  if (recognition) {

    recognition.onend = null;


    try {

      recognition.stop();

    } catch (error) {}
  }


  recognition = null;

  recognitionActive = false;
}


/* =====================================
   判定
===================================== */

function updateJudgment(
  transcript,
  target
) {

  if (!transcript) {

    judgmentDisplay.textContent =
      "";

    return;
  }


  const score =
    calculateSimilarity(
      transcript,
      target
    );


  if (score >= PASS_SCORE) {

    judgmentDisplay.innerHTML =
      '<span class="pass">PASS</span>　' +
      score +
      "%";

  } else {

    judgmentDisplay.innerHTML =
      '<span class="retry">RETRY</span>　' +
      score +
      "%";
  }
}


/* =====================================
   単語単位の一致率
===================================== */

function calculateSimilarity(
  spoken,
  target
) {

  const a =
    normalize(spoken)
      .split(" ")
      .filter(Boolean);


  const b =
    normalize(target)
      .split(" ")
      .filter(Boolean);


  if (
    a.length === 0 ||
    b.length === 0
  ) {

    return 0;
  }


  const distance =
    levenshteinWords(
      a,
      b
    );


  const maxLength =
    Math.max(
      a.length,
      b.length
    );


  const score =
    Math.max(
      0,
      1 -
      distance /
      maxLength
    );


  return Math.round(
    score * 100
  );
}


function normalize(text) {

  return String(text || "")
    .toLowerCase()
    .replace(
      /[’']/g,
      ""
    )
    .replace(
      /[^a-z0-9\s]/g,
      " "
    )
    .replace(
      /\s+/g,
      " "
    )
    .trim();
}


function levenshteinWords(
  a,
  b
) {

  const matrix =
    Array.from(
      {
        length:
          a.length + 1
      },
      () =>
        new Array(
          b.length + 1
        ).fill(0)
    );


  for (
    let i = 0;
    i <= a.length;
    i++
  ) {

    matrix[i][0] = i;
  }


  for (
    let j = 0;
    j <= b.length;
    j++
  ) {

    matrix[0][j] = j;
  }


  for (
    let i = 1;
    i <= a.length;
    i++
  ) {

    for (
      let j = 1;
      j <= b.length;
      j++
    ) {

      const cost =
        a[i - 1] ===
        b[j - 1]
          ? 0
          : 1;


      matrix[i][j] =
        Math.min(

          matrix[i - 1][j] + 1,

          matrix[i][j - 1] + 1,

          matrix[i - 1][j - 1] +
            cost
        );
    }
  }


  return matrix[
    a.length
  ][
    b.length
  ];
}


/* =====================================
   文字起こし表示リセット
===================================== */

function resetTranscript() {

  stopRecognition();

  transcriptDisplay.textContent =
    "";

  judgmentDisplay.textContent =
    "";
}


/* =====================================
   任意録音
===================================== */

recordButton.addEventListener(
  "click",
  async () => {

    if (
      mediaRecorder &&
      mediaRecorder.state ===
        "recording"
    ) {

      return;
    }


    try {

      recordStream =
        await navigator.mediaDevices
          .getUserMedia({
            audio: true
          });


      recordedChunks = [];


      mediaRecorder =
        new MediaRecorder(
          recordStream
        );


      mediaRecorder.ondataavailable =
        event => {

          if (
            event.data &&
            event.data.size > 0
          ) {

            recordedChunks.push(
              event.data
            );
          }
        };


      mediaRecorder.onstop =
        function() {

          const blob =
            new Blob(
              recordedChunks,
              {
                type:
                  mediaRecorder.mimeType ||
                  "audio/webm"
              }
            );


          if (recordedUrl) {

            URL.revokeObjectURL(
              recordedUrl
            );
          }


          recordedUrl =
            URL.createObjectURL(
              blob
            );


          recordPlayback.innerHTML =
            "";


          const audio =
            document.createElement(
              "audio"
            );


          audio.controls =
            true;

          audio.src =
            recordedUrl;


          recordPlayback.appendChild(
            audio
          );


          if (recordStream) {

            recordStream
              .getTracks()
              .forEach(
                track =>
                  track.stop()
              );

            recordStream =
              null;
          }
        };


      mediaRecorder.start();


      recordStatus.textContent =
        "● Recording";


      recordButton.disabled =
        true;

      stopRecordButton.disabled =
        false;


    } catch (error) {

      recordStatus.textContent =
        "マイクを使用できません。";
    }
  }
);


stopRecordButton.addEventListener(
  "click",
  () => {

    if (
      mediaRecorder &&
      mediaRecorder.state !==
        "inactive"
    ) {

      mediaRecorder.stop();
    }


    recordStatus.textContent =
      "";

    recordButton.disabled =
      false;

    stopRecordButton.disabled =
      true;
  }
);


/* =====================================
   練習音声停止
===================================== */

function stopPracticeAudio() {

  clearTimeout(
    pauseTimer
  );

  cancelAnimationFrame(
    animationId
  );


  answerPlayer.pause();

  answerPlayer.onended =
    null;


  isPaused = false;

  pauseButton.disabled =
    true;

  pauseButton.textContent =
    "一時停止";
}


function stopAllPractice() {

  stopPracticeAudio();

  stopRecognition();

  statusDisplay.textContent =
    "";
}


/* =====================================
   音声分割準備
===================================== */

async function prepareSegments() {

  try {

    segments =
      await detectSentenceSegments(
        QUESTION.answerAudio,
        QUESTION.sentences.length
      );


    loadingDisplay.textContent =
      "";


    bPlayButton.disabled =
      false;


    renderA();


  } catch (error) {

    console.error(error);


    loadingDisplay.textContent =
      "音声を正しく分割できませんでした。";
  }
}


/* =====================================
   無音検出
===================================== */

async function detectSentenceSegments(
  file,
  expectedCount
) {

  const response =
    await fetch(file);


  const arrayBuffer =
    await response.arrayBuffer();


  const audioContext =
    new AudioContext();


  const audioBuffer =
    await audioContext
      .decodeAudioData(
        arrayBuffer
      );


  const length =
    audioBuffer.length;


  const mono =
    new Float32Array(
      length
    );


  for (
    let channel = 0;
    channel <
      audioBuffer.numberOfChannels;
    channel++
  ) {

    const data =
      audioBuffer.getChannelData(
        channel
      );


    for (
      let i = 0;
      i < length;
      i++
    ) {

      mono[i] +=
        data[i] /
        audioBuffer.numberOfChannels;
    }
  }


  const sampleRate =
    audioBuffer.sampleRate;


  const frameSeconds =
    0.02;


  const frameSize =
    Math.floor(
      sampleRate *
      frameSeconds
    );


  const frames = [];


  for (
    let start = 0;
    start < mono.length;
    start += frameSize
  ) {

    const end =
      Math.min(
        start + frameSize,
        mono.length
      );


    let sum = 0;


    for (
      let i = start;
      i < end;
      i++
    ) {

      sum +=
        mono[i] *
        mono[i];
    }


    const rms =
      Math.sqrt(
        sum /
        (end - start)
      );


    frames.push({
      time:
        start /
        sampleRate,

      rms: rms
    });
  }


  const silenceRanges = [];

  let silenceStart = null;


  for (
    let i = 0;
    i < frames.length;
    i++
  ) {

    const silent =
      frames[i].rms <
      SILENCE_THRESHOLD;


    if (
      silent &&
      silenceStart === null
    ) {

      silenceStart =
        frames[i].time;
    }


    if (
      !silent &&
      silenceStart !== null
    ) {

      const silenceEnd =
        frames[i].time;


      if (
        silenceEnd -
        silenceStart >=
        MIN_SILENCE_SECONDS
      ) {

        silenceRanges.push({
          start:
            silenceStart,

          end:
            silenceEnd,

          duration:
            silenceEnd -
            silenceStart
        });
      }


      silenceStart =
        null;
    }
  }


  const internalSilences =
    silenceRanges.filter(
      range =>
        range.start > 0.3
        &&
        range.end <
          audioBuffer.duration -
          0.3
    );


  const requiredBreaks =
    expectedCount - 1;


  const selected =
    internalSilences
      .sort(
        (a, b) =>
          b.duration -
          a.duration
      )
      .slice(
        0,
        requiredBreaks
      )
      .sort(
        (a, b) =>
          a.start -
          b.start
      );


  if (
    selected.length !==
    requiredBreaks
  ) {

    await audioContext.close();

    throw new Error(
      "Sentence split failed"
    );
  }


  let actualStart = 0;

  let actualEnd =
    audioBuffer.duration;


  for (
    let i = 0;
    i < frames.length;
    i++
  ) {

    if (
      frames[i].rms >=
      SILENCE_THRESHOLD
    ) {

      actualStart =
        Math.max(
          0,
          frames[i].time -
          0.05
        );

      break;
    }
  }


  for (
    let i =
      frames.length - 1;
    i >= 0;
    i--
  ) {

    if (
      frames[i].rms >=
      SILENCE_THRESHOLD
    ) {

      actualEnd =
        Math.min(
          audioBuffer.duration,
          frames[i].time +
          frameSeconds +
          0.08
        );

      break;
    }
  }


  const result = [];

  let sentenceStart =
    actualStart;


  selected.forEach(
    gap => {

      result.push({

        start:
          sentenceStart,

        end:
          Math.min(
            actualEnd,
            gap.start +
            0.05
          )

      });


      sentenceStart =
        Math.max(
          0,
          gap.end -
          0.05
        );
    }
  );


  result.push({

    start:
      sentenceStart,

    end:
      actualEnd

  });


  await audioContext.close();


  return result;
}
